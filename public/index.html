<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schätzpoker</title>
    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #root {
            width: 100%;
            max-width: 1300px;
            padding: 16px;
            margin: 0 auto;
        }

        /* ─── Utilities ─── */
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .items-center {
            align-items: center;
        }
        .justify-center {
            justify-content: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-3 {
            gap: 12px;
        }
        .gap-4 {
            gap: 16px;
        }
        .gap-6 {
            gap: 24px;
        }
        .gap-8 {
            gap: 32px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 0.875rem;
        }
        .text-lg {
            font-size: 1.25rem;
        }
        .text-xl {
            font-size: 1.5rem;
        }
        .text-2xl {
            font-size: 2rem;
        }
        .text-3xl {
            font-size: 2.5rem;
        }
        .text-4xl {
            font-size: 3rem;
        }
        .font-bold {
            font-weight: 700;
        }
        .font-semibold {
            font-weight: 600;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mt-6 {
            margin-top: 24px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }
        .relative {
            position: relative;
        }
        .rounded {
            border-radius: 12px;
        }
        .rounded-full {
            border-radius: 9999px;
        }
        .shadow {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .bg-dark {
            background: #141a24;
        }
        .bg-card {
            background: #1c2432;
        }
        .bg-green {
            background: #1b8a4a;
        }
        .bg-red {
            background: #b13e3e;
        }
        .bg-gold {
            background: #d4a030;
        }
        .bg-blue {
            background: #2a6b9c;
        }
        .bg-purple {
            background: #6b3fa0;
        }
        .border {
            border: 1px solid #2a3346;
        }
        .border-gold {
            border-color: #d4a030;
        }
        .text-gold {
            color: #f5c842;
        }
        .text-green {
            color: #4ade80;
        }
        .text-red {
            color: #f87171;
        }
        .text-muted {
            color: #8892a8;
        }
        .p-2 {
            padding: 8px;
        }
        .p-3 {
            padding: 12px;
        }
        .p-4 {
            padding: 16px;
        }
        .p-6 {
            padding: 24px;
        }
        .p-8 {
            padding: 32px;
        }
        .hidden {
            display: none !important;
        }
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ─── Buttons ─── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            background: #2a3346;
            min-width: 80px;
            touch-action: manipulation;
            user-select: none;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background: #2a6b9c;
        }
        .btn-success {
            background: #1b8a4a;
        }
        .btn-danger {
            background: #b13e3e;
        }
        .btn-gold {
            background: #d4a030;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #2a3346;
        }
        .btn-outline:hover:not(:disabled) {
            background: #2a3346;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.85rem;
            min-width: 60px;
        }
        .btn-lg {
            padding: 14px 32px;
            font-size: 1.15rem;
        }
        .btn-block {
            width: 100%;
        }

        /* ─── Inputs ─── */
        .input {
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid #2a3346;
            background: #0b0e14;
            color: #e8edf5;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: border 0.2s;
        }
        .input:focus {
            border-color: #2a6b9c;
        }
        .input::placeholder {
            color: #55607a;
        }

        /* ─── Cards / Table ─── */
        .table {
            background: #0d1520;
            border-radius: 24px;
            padding: 24px;
            box-shadow: inset 0 0 80px rgba(0, 20, 40, 0.6), 0 8px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e2a3a;
            position: relative;
            min-height: 500px;
        }
        .table-felt {
            background: radial-gradient(ellipse at center, #1a3a2a, #0d1f16);
            border-radius: 20px;
            padding: 20px;
            min-height: 420px;
        }

        .player-seat {
            background: #141c28;
            border-radius: 12px;
            padding: 10px 14px;
            border: 2px solid #2a3346;
            min-width: 120px;
            transition: all 0.3s;
        }
        .player-seat.active {
            border-color: #f5c842;
            box-shadow: 0 0 20px rgba(245, 200, 66, 0.2);
        }
        .player-seat.folded {
            opacity: 0.4;
        }
        .player-seat.self {
            border-color: #2a6b9c;
            background: #1a2a3a;
        }
        .player-seat.winner {
            border-color: #f5c842;
            background: #2a2a1a;
            box-shadow: 0 0 40px rgba(245, 200, 66, 0.3);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #1a2432;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #2a3346;
        }

        .bet-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #2a1a1a;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid #b13e3e;
            color: #f87171;
        }

        .pot-display {
            background: #0a121c;
            border-radius: 16px;
            padding: 12px 28px;
            border: 2px solid #d4a030;
            text-align: center;
            min-width: 120px;
        }

        .hint-box {
            background: #1a1a2a;
            border-radius: 12px;
            padding: 16px 24px;
            border-left: 4px solid #d4a030;
            animation: fadeIn 0.5s ease;
        }

        .guess-input {
            font-size: 2rem;
            text-align: center;
            max-width: 200px;
            padding: 12px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            max-width: 500px;
            width: 100%;
        }

        .timer-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid #2a3346;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: #0b0e14;
            transition: border-color 0.3s;
        }
        .timer-ring.warning {
            border-color: #f5c842;
        }
        .timer-ring.danger {
            border-color: #b13e3e;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-slide {
            animation: slideUp 0.5s ease;
        }
        .animate-fade {
            animation: fadeIn 0.5s ease;
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            #root {
                padding: 8px;
            }
            .table {
                padding: 12px;
                border-radius: 16px;
            }
            .table-felt {
                padding: 12px;
                min-height: 300px;
            }
            .player-seat {
                min-width: 80px;
                padding: 6px 10px;
                font-size: 0.8rem;
            }
            .text-4xl {
                font-size: 2rem;
            }
            .text-3xl {
                font-size: 1.8rem;
            }
            .text-2xl {
                font-size: 1.3rem;
            }
            .action-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.85rem;
                min-width: 60px;
            }
            .pot-display {
                padding: 8px 16px;
                min-width: 80px;
            }
            .guess-input {
                font-size: 1.5rem;
                max-width: 140px;
            }
            .timer-ring {
                width: 48px;
                height: 48px;
                font-size: 1.2rem;
            }
        }
        @media (max-width: 480px) {
            .action-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .player-seat {
                min-width: 60px;
                padding: 4px 8px;
                font-size: 0.7rem;
            }
            .btn {
                padding: 6px 10px;
                font-size: 0.75rem;
                min-width: 50px;
            }
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3346;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a4a5a;
        }

        /* ─── Badge ─── */
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-dealer {
            background: #d4a030;
            color: #0b0e14;
        }
        .badge-sb {
            background: #2a6b9c;
            color: #fff;
        }
        .badge-bb {
            background: #b13e3e;
            color: #fff;
        }
        .badge-fold {
            background: #3a2a2a;
            color: #f87171;
        }
        .badge-allin {
            background: #b13e3e;
            color: #fff;
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "socket.io-client": "https://esm.sh/socket.io-client@4.7.2"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SCHÄTZPOKER  –  Full Multiplayer Implementation (Plain JS)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        import React, {
            useState,
            useEffect,
            useRef,
            useCallback,
            useMemo,
            createContext,
            useContext,
        } from 'react';
        import ReactDOM from 'react-dom/client';
        import { io } from 'socket.io-client';

        // ─── Socket Context ──────────────────────────────────────────────

        const SocketContext = createContext(null);

        const SOCKET_URL = window.location.origin;

        function SocketProvider({ children }) {
            const [state, setState] = useState({
                game: null,
                playerId: null,
                connected: false,
                error: null,
            });
            const socketRef = useRef(null);

            useEffect(() => {
                const socket = io(SOCKET_URL, {
                    reconnection: true,
                    reconnectionAttempts: 10,
                    reconnectionDelay: 1000,
                });
                socketRef.current = socket;

                socket.on('connect', () => {
                    setState(s => ({ ...s, connected: true, error: null }));
                    console.log('🔗 Connected');
                });

                socket.on('disconnect', () => {
                    setState(s => ({ ...s, connected: false }));
                    console.log('🔌 Disconnected');
                });

                socket.on('connect_error', (err) => {
                    setState(s => ({ ...s, error: 'Verbindungsfehler: ' + err.message }));
                    console.error('Connection error:', err);
                });

                socket.on('game:state', (game) => {
                    setState(s => ({
                        ...s,
                        game: {
                            ...game,
                            players: game.players.map(p => ({
                                ...p,
                                isSelf: p.id === s.playerId,
                            })),
                        },
                    }));
                });

                socket.on('game:error', (msg) => {
                    setState(s => ({ ...s, error: msg }));
                    setTimeout(() => setState(s => ({ ...s, error: null })), 4000);
                });

                socket.on('player:id', (id) => {
                    setState(s => ({ ...s, playerId: id }));
                });

                socket.on('game:host', (hostId) => {
                    setState(s => {
                        if (!s.game) return s;
                        return {
                            ...s,
                            game: {
                                ...s.game,
                                hostId,
                                players: s.game.players.map(p => ({
                                    ...p,
                                    isHost: p.id === hostId,
                                })),
                            },
                        };
                    });
                });

                return () => {
                    socket.disconnect();
                };
            }, []);

            const emit = useCallback((event, data) => {
                if (socketRef.current) {
                    socketRef.current.emit(event, data);
                }
            }, []);

            const joinRoom = useCallback((roomId, name) => {
                emit('room:join', { roomId, name });
            }, [emit]);

            const createRoom = useCallback((name, settings) => {
                emit('room:create', { name, settings });
            }, [emit]);

            const submitGuess = useCallback((value) => {
                emit('guess:submit', { value });
            }, [emit]);

            const act = useCallback((action, amount) => {
                emit('bet:act', { action, amount });
            }, [emit]);

            const startGame = useCallback(() => {
                emit('game:start');
            }, [emit]);

            const ctxValue = {
                socket: socketRef.current,
                state,
                emit,
                joinRoom,
                createRoom,
                submitGuess,
                act,
                startGame,
            };

            return (
                React.createElement(SocketContext.Provider, { value: ctxValue }, children)
            );
        }

        function useSocket() {
            const ctx = useContext(SocketContext);
            if (!ctx) throw new Error('useSocket must be used within SocketProvider');
            return ctx;
        }

        // ─── Hooks ──────────────────────────────────────────────────────

        function useTimer(seconds, onExpire) {
            const [remaining, setRemaining] = useState(seconds);
            const intervalRef = useRef(null);

            useEffect(() => {
                setRemaining(seconds);
                if (seconds <= 0) {
                    onExpire();
                    return;
                }
                intervalRef.current = window.setInterval(() => {
                    setRemaining(r => {
                        if (r <= 1) {
                            clearInterval(intervalRef.current);
                            onExpire();
                            return 0;
                        }
                        return r - 1;
                    });
                }, 1000);
                return () => {
                    if (intervalRef.current) clearInterval(intervalRef.current);
                };
            }, [seconds, onExpire]);

            return remaining;
        }

        // ─── Components ──────────────────────────────────────────────────

        function Lobby({ game, isHost, onStart }) {
            return React.createElement(
                'div',
                { className: 'flex flex-col items-center gap-6 p-6' },
                React.createElement(
                    'div',
                    { className: 'text-center' },
                    React.createElement('h1', { className: 'text-3xl font-bold text-gold' }, '♠ SCHÄTZPOKER'),
                    React.createElement('p', { className: 'text-muted text-sm mt-2' },
                        'Raum: ', React.createElement('span', { className: 'text-gold font-semibold' }, game.roomId)
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'w-full max-w-md bg-card rounded p-6 border' },
                    React.createElement('h2', { className: 'text-lg font-semibold mb-4' },
                        'Spieler (', game.players.length, '/', game.maxPlayers, ')'
                    ),
                    React.createElement(
                        'div',
                        { className: 'flex flex-col gap-2' },
                        game.players.map(p =>
                            React.createElement(
                                'div',
                                { key: p.id, className: 'flex items-center justify-between bg-dark p-2 rounded' },
                                React.createElement('span', { className: 'font-medium' }, p.name),
                                React.createElement(
                                    'div',
                                    { className: 'flex items-center gap-2' },
                                    React.createElement('span', { className: 'chip' }, p.chips, ' 🪙'),
                                    p.isHost && React.createElement('span', { className: 'badge badge-dealer' }, 'Host'),
                                    p.isSelf && React.createElement('span', { className: 'text-sm text-blue' }, '(du)')
                                )
                            )
                        )
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'flex flex-col items-center gap-3 w-full max-w-md' },
                    isHost && React.createElement(
                        'button',
                        {
                            className: 'btn btn-gold btn-lg btn-block',
                            onClick: onStart,
                            disabled: game.players.length < 2,
                        },
                        game.players.length < 2 ? 'Warte auf Spieler...' : '▶ Spiel starten'
                    ),
                    React.createElement('p', { className: 'text-sm text-muted' },
                        isHost ?
                        (game.players.length < 2 ? 'Mindestens 2 Spieler benötigt' : 'Drücke "Spiel starten"') :
                        'Warte auf den Host...'
                    )
                )
            );
        }

        function GuessingPhase({ game, player, onSubmit }) {
            const [guess, setGuess] = useState('');
            const hasGuessed = player?.status === 'GUESSED';

            if (!game.question) {
                return React.createElement('div', { className: 'text-center text-muted' }, 'Lade Frage...');
            }

            return React.createElement(
                'div',
                { className: 'flex flex-col items-center gap-6 animate-fade' },
                React.createElement(
                    'div',
                    { className: 'text-center' },
                    React.createElement('div', { className: 'text-sm text-muted mb-1' }, 'Runde ', game.roundNumber),
                    React.createElement('h2', { className: 'text-2xl font-bold' }, game.question.question),
                    game.question.unit && React.createElement('p', { className: 'text-sm text-muted mt-1' }, 'Einheit: ', game
                        .question.unit),
                    React.createElement('div', { className: 'text-xs text-muted mt-1' },
                        game.question.category, ' · ', game.question.difficulty
                    )
                ),
                hasGuessed ?
                React.createElement(
                    'div',
                    { className: 'bg-green/20 border border-green rounded p-4 text-center' },
                    React.createElement('p', { className: 'text-green text-lg font-semibold' }, '✓ Schätzung abgegeben'),
                    React.createElement('p', { className: 'text-sm text-muted' }, 'Deine Zahl: ', React.createElement(
                        'strong', null, player?.guess)),
                    React.createElement('p', { className: 'text-xs text-muted mt-2' }, 'Warte auf andere Spieler...')
                ) :
                React.createElement(
                    'div',
                    { className: 'flex flex-col items-center gap-4' },
                    React.createElement('label', { className: 'text-lg font-semibold' }, 'Deine Schätzung'),
                    React.createElement('input', {
                        type: 'number',
                        className: 'input guess-input',
                        value: guess,
                        onChange: e => setGuess(e.target.value),
                        placeholder: '?',
                        autoFocus: true,
                        onKeyDown: e => {
                            if (e.key === 'Enter' && guess.trim() !== '') {
                                const val = Number(guess);
                                if (!isNaN(val)) onSubmit(val);
                            }
                        }
                    }),
                    React.createElement(
                        'button',
                        {
                            className: 'btn btn-success btn-lg',
                            onClick: () => {
                                const val = Number(guess);
                                if (!isNaN(val)) onSubmit(val);
                            },
                            disabled: guess.trim() === '' || isNaN(Number(guess)),
                        },
                        'Schätzung abgeben'
                    )
                )
            );
        }

        function BettingPhase({ game, player, isMyTurn, onAct, phaseLabel }) {
            const [raiseAmount, setRaiseAmount] = useState('');
            const [showRaiseInput, setShowRaiseInput] = useState(false);
            const hasFolded = player?.status === 'FOLD' || player?.status === 'OUT';
            const isAllIn = player?.status === 'ALL_IN';
            const canCheck = game.currentBet === player?.bet;
            const canCall = game.currentBet > player?.bet;
            const callAmount = player ? Math.min(game.currentBet - player.bet, player.chips) : 0;
            const canRaise = player && player.chips > 0 && !isAllIn && !hasFolded;
            const canAllIn = player && player.chips > 0 && !isAllIn && !hasFolded;
            const minRaise = player ? Math.max(game.currentBet + game.bigBlind, game.currentBet + 10) : 0;
            const maxRaise = player ? player.chips + player.bet : 0;

            const handleRaise = () => {
                const val = Number(raiseAmount);
                if (!isNaN(val) && val >= minRaise && val <= maxRaise) {
                    onAct('RAISE', val);
                    setRaiseAmount('');
                    setShowRaiseInput(false);
                }
            };

            if (!player) return null;

            return React.createElement(
                'div',
                { className: 'flex flex-col items-center gap-4 animate-fade w-full max-w-lg' },
                React.createElement(
                    'div',
                    { className: 'flex items-center gap-4 w-full justify-between bg-dark p-3 rounded border' },
                    React.createElement(
                        'div',
                        null,
                        React.createElement('span', { className: 'text-sm text-muted' }, 'Phase:'),
                        React.createElement('span', { className: 'font-semibold ml-2' }, phaseLabel)
                    ),
                    React.createElement(
                        'div',
                        null,
                        React.createElement('span', { className: 'text-sm text-muted' }, 'Einsatz:'),
                        React.createElement('span', { className: 'font-semibold ml-2 text-gold' }, game.currentBet, ' 🪙')
                    ),
                    React.createElement(
                        'div',
                        null,
                        React.createElement('span', { className: 'text-sm text-muted' }, 'Pot:'),
                        React.createElement('span', { className: 'font-semibold ml-2 text-gold' }, game.pot, ' 🪙')
                    )
                ),
                hasFolded ?
                React.createElement(
                    'div',
                    { className: 'bg-red/20 border border-red rounded p-3 text-center w-full' },
                    React.createElement('span', { className: 'text-red font-semibold' }, '✕ Gefolded')
                ) :
                isAllIn ?
                React.createElement(
                    'div',
                    { className: 'bg-red/30 border border-red rounded p-3 text-center w-full' },
                    React.createElement('span', { className: 'text-red font-semibold animate-pulse' }, 'ALL-IN!')
                ) :
                !isMyTurn ?
                React.createElement(
                    'div',
                    { className: 'text-center text-muted' },
                    game.currentPlayerId ? 'Warte auf anderen Spieler...' : 'Warte...'
                ) :
                React.createElement(
                    'div',
                    { className: 'w-full' },
                    React.createElement(
                        'div',
                        { className: 'action-grid' },
                        canCheck && React.createElement('button', { className: 'btn btn-outline', onClick: () => onAct(
                                'CHECK') }, 'Check'),
                        canCall && React.createElement('button', { className: 'btn btn-primary', onClick: () => onAct(
                                'CALL') }, 'Call ', callAmount, ' 🪙'),
                        canRaise && !showRaiseInput && React.createElement('button', { className: 'btn btn-gold',
                            onClick: () => setShowRaiseInput(true) }, 'Raise'),
                        canAllIn && React.createElement('button', { className: 'btn btn-danger', onClick: () => onAct(
                                'ALL_IN') }, 'All-In'),
                        !hasFolded && !isAllIn && React.createElement('button', { className: 'btn btn-danger',
                            onClick: () => onAct('FOLD') }, 'Fold')
                    ),
                    showRaiseInput && React.createElement(
                        'div',
                        { className: 'flex items-center gap-2 mt-3 w-full' },
                        React.createElement('input', {
                            type: 'number',
                            className: 'input flex-1',
                            value: raiseAmount,
                            onChange: e => setRaiseAmount(e.target.value),
                            placeholder: 'Min ' + minRaise,
                            autoFocus: true,
                            onKeyDown: e => {
                                if (e.key === 'Enter') handleRaise();
                                if (e.key === 'Escape') setShowRaiseInput(false);
                            }
                        }),
                        React.createElement('button', { className: 'btn btn-success', onClick: handleRaise }, '✓'),
                        React.createElement('button', { className: 'btn btn-outline', onClick: () => setShowRaiseInput(
                                false) }, '✕')
                    )
                ),
                game.timeRemaining > 0 && isMyTurn && !hasFolded && !isAllIn && React.createElement(
                    'div',
                    { className: 'timer-ring ' + (game.timeRemaining <= 5 ? 'danger' : game.timeRemaining <= 10 ?
                            'warning' : '') },
                    game.timeRemaining
                )
            );
        }

        function HintDisplay({ hint, number }) {
            return React.createElement(
                'div',
                { className: 'hint-box animate-fade w-full max-w-md' },
                React.createElement('div', { className: 'text-sm text-muted' }, '💡 Hinweis ', number),
                React.createElement('div', { className: 'text-lg font-semibold text-gold' }, hint)
            );
        }

        function RevealPhase({ game }) {
            return React.createElement(
                'div',
                { className: 'flex flex-col items-center gap-4 animate-slide' },
                React.createElement('div', { className: 'text-sm text-muted' }, 'Die richtige Antwort ist...'),
                React.createElement('div', { className: 'text-5xl font-bold text-gold' }, game.correctAnswer),
                game.question?.unit && React.createElement('div', { className: 'text-sm text-muted' }, game.question.unit),
                React.createElement('div', { className: 'text-sm text-muted mt-2' }, '⬇ Finale Setzrunde beginnt gleich ⬇')
            );
        }

        function Showdown({ game }) {
            const sorted = [...game.players]
                .filter(p => p.guess !== undefined && p.status !== 'FOLD' && p.status !== 'OUT')
                .sort((a, b) => (a.distance ?? Infinity) - (b.distance ?? Infinity));

            const winner = sorted.length > 0 ? sorted[0] : null;

            return React.createElement(
                'div',
                { className: 'flex flex-col items-center gap-4 animate-slide w-full max-w-lg' },
                React.createElement('div', { className: 'text-2xl font-bold text-gold' }, '🏆 SHOWDOWN'),
                React.createElement('div', { className: 'text-sm text-muted' },
                    'Richtige Antwort: ', React.createElement('strong', { className: 'text-gold' }, game.correctAnswer)
                ),
                React.createElement(
                    'div',
                    { className: 'w-full bg-dark rounded p-4 border' },
                    game.players.map(p => {
                        const isActive = p.guess !== undefined && p.status !== 'FOLD' && p.status !== 'OUT';
                        if (!isActive && p.status !== 'FOLD' && p.status !== 'OUT') return null;
                        const isWinner = winner && p.id === winner.id;
                        return React.createElement(
                            'div',
                            { key: p.id,
                                className: 'flex items-center justify-between p-2 rounded ' + (isWinner ?
                                    'bg-gold/20 border border-gold' : '') },
                            React.createElement('span', { className: 'font-medium' },
                                p.name, p.isSelf && ' (du)',
                                isWinner && ' 👑'
                            ),
                            p.guess !== undefined ?
                            React.createElement('span', { className: 'flex items-center gap-3' },
                                React.createElement('span', null, p.guess),
                                React.createElement('span', { className: 'text-sm text-muted' }, '→'),
                                React.createElement('span', { className: 'font-semibold ' + (p.distance === 0 ?
                                        'text-green' : p.distance && p.distance <= 2 ? 'text-gold' :
                                        'text-muted') },
                                    p.distance, ' daneben'
                                ),
                                isWinner && React.createElement('span', { className: 'badge badge-dealer' },
                                    'GEWINNER')
                            ) :
                            React.createElement('span', { className: 'text-sm text-muted' }, 'Gefolded')
                        );
                    })
                ),
                winner && React.createElement(
                    'div',
                    { className: 'bg-gold/20 border border-gold rounded p-4 text-center w-full' },
                    React.createElement('span', { className: 'text-xl font-bold text-gold' },
                        winner.name, ' gewinnt ', game.winningAmount || game.pot, ' 🪙!'
                    )
                )
            );
        }

        function ResultPhase({ game, onNext }) {
            return React.createElement(
                'div',
                { className: 'flex flex-col items-center gap-4 animate-slide' },
                React.createElement('div', { className: 'text-2xl font-bold text-gold' }, 'Runde ', game.roundNumber,
                    ' beendet'),
                React.createElement('button', { className: 'btn btn-primary', onClick: onNext }, 'Nächste Runde ➜')
            );
        }

        function GameTable() {
            const { state, submitGuess, act, startGame } = useSocket();
            const game = state.game;
            const player = game?.players.find(p => p.isSelf);

            if (!game) {
                return React.createElement(
                    'div',
                    { className: 'table flex items-center justify-center min-h-[300px]' },
                    React.createElement(
                        'div',
                        { className: 'text-center text-muted' },
                        React.createElement('div', { className: 'text-2xl mb-2' }, '♠'),
                        React.createElement('p', null, 'Verbindung zum Server wird hergestellt...')
                    )
                );
            }

            const isHost = player?.isHost || false;
            const isMyTurn = game.currentPlayerId === player?.id && player?.status !== 'FOLD' && player?.status !== 'OUT';
            const phaseLabels = {
                LOBBY: 'Lobby',
                QUESTION: 'Frage',
                GUESSING: 'Schätzung',
                BETTING_1: 'Setzrunde 1',
                HINT_1: 'Hinweis 1',
                BETTING_2: 'Setzrunde 2',
                HINT_2: 'Hinweis 2',
                BETTING_3: 'Setzrunde 3',
                REVEAL: 'Auflösung',
                FINAL_BETTING: 'Finale Setzrunde',
                SHOWDOWN: 'Showdown',
                RESULT: 'Ergebnis',
            };

            const renderPhase = () => {
                switch (game.phase) {
                    case 'LOBBY':
                        return React.createElement(Lobby, { game, isHost, onStart: startGame });
                    case 'QUESTION':
                    case 'GUESSING':
                        return React.createElement(GuessingPhase, { game, player, onSubmit: submitGuess });
                    case 'BETTING_1':
                    case 'BETTING_2':
                    case 'BETTING_3':
                    case 'FINAL_BETTING':
                        return React.createElement(BettingPhase, {
                            game,
                            player,
                            isMyTurn,
                            onAct: act,
                            phaseLabel: phaseLabels[game.phase] || game.phase,
                        });
                    case 'HINT_1':
                    case 'HINT_2': {
                        const idx = game.phase === 'HINT_1' ? 0 : 1;
                        const hint = game.question?.hints?.[idx];
                        return React.createElement(
                            'div',
                            { className: 'flex flex-col items-center gap-4 w-full' },
                            hint ? React.createElement(HintDisplay, { hint: hint.text, number: idx + 1 }) :
                            React.createElement('div', { className: 'text-muted' }, 'Kein Hinweis verfügbar'),
                            React.createElement('div', { className: 'text-sm text-muted' },
                                'Die nächste Setzrunde beginnt gleich...')
                        );
                    }
                    case 'REVEAL':
                        return React.createElement(RevealPhase, { game });
                    case 'SHOWDOWN':
                        return React.createElement(Showdown, { game });
                    case 'RESULT':
                        return React.createElement(ResultPhase, { game, onNext: () => act('NEXT_ROUND') });
                    default:
                        return React.createElement('div', { className: 'text-muted' }, 'Unbekannte Phase: ', game.phase);
                }
            };

            return React.createElement(
                'div',
                { className: 'table' },
                React.createElement(
                    'div',
                    { className: 'flex justify-between items-center mb-4 flex-wrap gap-2' },
                    React.createElement(
                        'div',
                        { className: 'flex items-center gap-3' },
                        React.createElement('span', { className: 'text-gold font-bold' }, '♠ ', game.roomId),
                        React.createElement('span', { className: 'text-sm text-muted' }, 'Runde ', game.roundNumber),
                        React.createElement('span', { className: 'badge badge-dealer' }, phaseLabels[game.phase] || game
                            .phase)
                    ),
                    React.createElement(
                        'div',
                        { className: 'flex items-center gap-3' },
                        React.createElement('span', { className: 'text-sm text-muted' }, 'Pot:'),
                        React.createElement('span', { className: 'pot-display text-gold font-bold' }, game.pot, ' 🪙')
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'table-felt' },
                    React.createElement(
                        'div',
                        { className: 'grid grid-cols-2 md:grid-cols-4 gap-2 mb-4' },
                        game.players.map(p => {
                            const isSelf = p.isSelf;
                            const isWinner = p.isWinner;
                            const isFolded = p.status === 'FOLD' || p.status === 'OUT';
                            const isActive = p.status === 'ACTIVE' || p.status === 'CHECK' || p.status === 'CALL' ||
                                p.status === 'RAISE';
                            const isAllIn = p.status === 'ALL_IN';
                            const isDealer = p.isDealer;

                            return React.createElement(
                                'div',
                                { key: p.id,
                                    className: 'player-seat ' +
                                        (isSelf ? 'self ' : '') +
                                        (isWinner ? 'winner ' : '') +
                                        (isFolded ? 'folded ' : '') +
                                        (isActive && game.currentPlayerId === p.id ? 'active' : '')
                                },
                                React.createElement(
                                    'div',
                                    { className: 'flex items-center justify-between' },
                                    React.createElement('span', { className: 'font-semibold truncate' }, p.name),
                                    isSelf && React.createElement('span', { className: 'text-xs text-blue ml-1' },
                                        'du')
                                ),
                                React.createElement(
                                    'div',
                                    { className: 'flex items-center gap-1 flex-wrap mt-1' },
                                    React.createElement('span', { className: 'chip' }, p.chips, ' 🪙'),
                                    isDealer && React.createElement('span', { className: 'badge badge-dealer' },
                                        'D'),
                                    p.isSmallBlind && React.createElement('span', { className: 'badge badge-sb' },
                                        'SB'),
                                    p.isBigBlind && React.createElement('span', { className: 'badge badge-bb' },
                                        'BB'),
                                    isAllIn && React.createElement('span', { className: 'badge badge-allin' },
                                        'ALL-IN'),
                                    isFolded && React.createElement('span', { className: 'badge badge-fold' },
                                        'FOLD')
                                ),
                                p.bet > 0 && React.createElement('div', { className: 'bet-chip mt-1' }, p.bet, ' 🪙'),
                                p.guess !== undefined && p.guess !== null && game.phase === 'SHOWDOWN' &&
                                React.createElement('div', { className: 'text-xs text-muted mt-1' }, 'Tipp: ', p
                                    .guess)
                            );
                        })
                    ),
                    React.createElement(
                        'div',
                        { className: 'flex justify-center items-center min-h-[200px]' },
                        renderPhase()
                    )
                ),
                state.error && React.createElement(
                    'div',
                    { className: 'mt-4 bg-red/20 border border-red rounded p-3 text-center text-red' },
                    state.error
                ),
                !state.connected && React.createElement(
                    'div',
                    { className: 'mt-2 text-center text-sm text-red' },
                    '⚡ Verbindung verloren – Versuche neu zu verbinden...'
                )
            );
        }

        // ─── App ──────────────────────────────────────────────────────────

        function App() {
            const { state, joinRoom, createRoom } = useSocket();
            const [name, setName] = useState('');
            const [roomCode, setRoomCode] = useState('');
            const [createName, setCreateName] = useState('');

            if (state.game && state.game.roomId) {
                return React.createElement(GameTable);
            }

            return React.createElement(
                'div',
                { className: 'flex flex-col items-center justify-center min-h-[60vh] gap-6 p-4' },
                React.createElement(
                    'div',
                    { className: 'text-center' },
                    React.createElement('h1', { className: 'text-4xl font-bold text-gold' }, '♠ SCHÄTZPOKER'),
                    React.createElement('p', { className: 'text-muted mt-2' }, 'Schätzen · Bluffen · Gewinnen')
                ),
                React.createElement(
                    'div',
                    { className: 'bg-card rounded p-6 border w-full max-w-md' },
                    React.createElement(
                        'div',
                        { className: 'flex flex-col gap-4' },
                        React.createElement(
                            'div',
                            null,
                            React.createElement('label', { className: 'block text-sm font-semibold mb-1' },
                                'Dein Name'),
                            React.createElement('input', {
                                className: 'input',
                                value: name,
                                onChange: e => setName(e.target.value),
                                placeholder: 'Dein Spielername',
                            })
                        ),
                        React.createElement(
                            'div',
                            { className: 'flex gap-3' },
                            React.createElement(
                                'div',
                                { className: 'flex-1' },
                                React.createElement('label', { className: 'block text-sm font-semibold mb-1' },
                                    'Raum beitreten'),
                                React.createElement(
                                    'div',
                                    { className: 'flex gap-2' },
                                    React.createElement('input', {
                                        className: 'input',
                                        value: roomCode,
                                        onChange: e => setRoomCode(e.target.value.toUpperCase()),
                                        placeholder: 'Code z.B. K7X4P',
                                        maxLength: 6,
                                    }),
                                    React.createElement(
                                        'button',
                                        {
                                            className: 'btn btn-primary',
                                            onClick: () => {
                                                if (name.trim() && roomCode.trim()) {
                                                    joinRoom(roomCode.trim(), name.trim());
                                                }
                                            },
                                            disabled: !name.trim() || !roomCode.trim(),
                                        },
                                        'Join'
                                    )
                                )
                            )
                        ),
                        React.createElement(
                            'div',
                            { className: 'relative flex items-center gap-4' },
                            React.createElement('div', { className: 'flex-1 border-t border-gray-600' }),
                            React.createElement('span', { className: 'text-sm text-muted' }, 'oder'),
                            React.createElement('div', { className: 'flex-1 border-t border-gray-600' })
                        ),
                        React.createElement(
                            'div',
                            null,
                            React.createElement('label', { className: 'block text-sm font-semibold mb-1' },
                                'Neuen Raum erstellen'),
                            React.createElement(
                                'div',
                                { className: 'flex gap-2' },
                                React.createElement('input', {
                                    className: 'input',
                                    value: createName,
                                    onChange: e => setCreateName(e.target.value),
                                    placeholder: 'Dein Name',
                                }),
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn btn-success',
                                        onClick: () => {
                                            if (createName.trim()) {
                                                createRoom(createName.trim());
                                            }
                                        },
                                        disabled: !createName.trim(),
                                    },
                                    'Erstellen'
                                )
                            )
                        ),
                        state.error && React.createElement('div', { className: 'text-sm text-red text-center' }, state
                            .error),
                        !state.connected && React.createElement('div', { className: 'text-sm text-muted text-center' },
                            '⏳ Verbindung zum Server wird hergestellt...'
                        )
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'text-xs text-muted text-center max-w-md' },
                    'Schätzpoker – Ein Multiplayer-Bluffspiel. Schätze Zahlen, setze Chips und bluffe deine Gegner aus.'
                )
            );
        }

        // ─── Mount ──────────────────────────────────────────────────────

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            React.createElement(
                React.StrictMode,
                null,
                React.createElement(
                    SocketProvider,
                    null,
                    React.createElement(App)
                )
            )
        );

        console.log('✅ Schätzpoker client loaded.');
    </script>
</body>
</html>
