<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Sportdirektor-Simulator // Bundesliga &amp; 2. Bundesliga 2026/27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           RETRO ARCADE / TELETEXT THEME
           Palette: DFL-Rot #e3000f · Bundesliga-Gold #ffd200 · Terminal-Grün #39ff14
           Tiefschwarz-Blau #05070f / #0c1024 · Panel #10142a
           Pixel-Font "Press Start 2P" fuer Ueberschriften/UI, "VT323" fuer Zahlen/Ticker
        =================================================================== */
        :root {
            --bg: #05070f;
            --panel: #0c1024;
            --panel-2: #10142a;
            --line: #2a2f52;
            --red: #e3000f;
            --gold: #ffd200;
            --blue: #1e5fff;
            --green: #39ff14;
            --text: #e8ecff;
            --dim: #8890c0;
            --pixel: 'Press Start 2P', monospace;
            --mono: 'VT323', 'JetBrains Mono', monospace;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scrollbar-color: var(--red) var(--bg);
        }
        body {
            font-family: var(--mono);
            font-size: 20px;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            line-height: 1.35;
            background-image: radial-gradient(ellipse at top, rgba(30, 95, 255, 0.12), transparent 60%),
                radial-gradient(ellipse at bottom, rgba(227, 0, 15, 0.10), transparent 60%);
        }
        /* CRT scanline + flicker overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.035) 0px,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 2px,
                    transparent 3px);
            mix-blend-mode: overlay;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 998;
            box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.75);
            animation: flicker 6s infinite;
        }
        @keyframes flicker {
            0%,
            97%,
            100% {
                opacity: 1;
            }
            98% {
                opacity: 0.94;
            }
            99% {
                opacity: 0.98;
            }
        }
        h1,
        h2,
        h3 {
            font-family: var(--pixel);
            color: var(--gold);
            text-shadow: 2px 2px 0 var(--red), 4px 4px 0 rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            line-height: 1.6;
        }
        h1 {
            font-size: 22px;
            padding: 14px 0;
            text-align: center;
        }
        h2 {
            font-size: 15px;
            margin-bottom: 10px;
        }
        h3 {
            font-size: 12px;
            margin-bottom: 10px;
            color: var(--blue);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
        }
        h4 {
            font-family: var(--pixel);
            font-size: 10px;
            color: var(--green);
            margin: 10px 0;
        }
        p {
            font-size: 20px;
        }
        .small-text {
            font-size: 16px;
        }
        .tiny-text {
            font-size: 14px;
        }

        button {
            font-family: var(--pixel);
            font-size: 10px;
            background: var(--red);
            border: none;
            outline: 3px solid #7a0009;
            outline-offset: -3px;
            color: #fff;
            padding: 10px 14px;
            border-radius: 0;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            text-transform: uppercase;
        }
        button:hover {
            background: #ff2436;
        }
        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000;
        }
        button:focus-visible {
            outline: 3px dashed var(--gold);
            outline-offset: 2px;
        }
        button.secondary {
            background: var(--blue);
            outline-color: #0b2a80;
        }
        button.success {
            background: #158a3d;
            outline-color: #0a4a20;
        }
        button.danger {
            background: var(--red);
            outline-color: #7a0009;
        }
        button.gold {
            background: var(--gold);
            color: #000;
            outline-color: #a08600;
        }
        button.small {
            font-size: 8px;
            padding: 5px 10px;
        }
        button.tiny {
            font-size: 7px;
            padding: 3px 8px;
        }

        input,
        select,
        textarea {
            font-family: var(--mono);
            font-size: 20px;
            padding: 6px 12px;
            border-radius: 0;
            border: 2px solid var(--line);
            margin: 4px 0;
            background: #060814;
            color: var(--green);
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--gold);
            border-color: var(--gold);
        }

        .container {
            background: var(--panel);
            padding: 20px;
            border: 2px solid var(--line);
            border-image: linear-gradient(135deg, var(--red), var(--gold), var(--blue)) 1;
            margin-top: 14px;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
        }
        .card {
            background: var(--panel-2);
            padding: 15px;
            border: 2px solid var(--line);
            flex: 1 1 200px;
            position: relative;
        }
        .card h3,
        .card h4 {
            margin-top: 0;
        }
        .card.wide {
            flex: 1 1 100%;
        }
        .card .value {
            font-size: 28px;
            color: var(--gold);
            font-family: var(--pixel);
        }
        .card .label {
            font-size: 14px;
            color: var(--dim);
            font-family: var(--pixel);
        }

        .menu {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .menu button {
            background: var(--panel-2);
            outline-color: var(--line);
            color: var(--dim);
            font-size: 9px;
            padding: 8px 12px;
        }
        .menu button.active {
            background: var(--red);
            color: #fff;
            outline-color: #7a0009;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 20px;
        }
        th,
        td {
            padding: 5px 10px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        th {
            background: var(--panel-2);
            color: var(--gold);
            font-family: var(--pixel);
            font-size: 9px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--red);
        }
        tr.row-champions td:first-child {
            box-shadow: inset 4px 0 0 var(--blue);
        }
        tr.row-europa td:first-child {
            box-shadow: inset 4px 0 0 var(--green);
        }
        tr.row-playoff td:first-child {
            box-shadow: inset 4px 0 0 var(--gold);
        }
        tr.row-relegation td:first-child {
            box-shadow: inset 4px 0 0 var(--red);
        }
        tr.row-own {
            background: rgba(255, 210, 0, 0.12);
        }
        tr.row-own td:first-child {
            font-weight: bold;
            color: var(--gold);
        }
        tr.clickable {
            cursor: pointer;
        }
        tr.clickable:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .highlight {
            color: var(--gold);
            font-weight: bold;
        }
        .text-green {
            color: var(--green);
        }
        .text-red {
            color: var(--red);
        }
        .text-dim {
            color: var(--dim);
        }
        .ticker {
            background: #010102;
            border: 2px solid var(--line);
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 20px;
            color: var(--green);
        }
        .ticker p {
            margin: 4px 0;
        }
        .ticker hr {
            border: none;
            border-top: 1px dashed var(--line);
            margin: 8px 0;
        }
        .hidden {
            display: none !important;
        }
        .status {
            font-family: var(--pixel);
            font-size: 11px;
            padding: 8px 12px;
            background: var(--panel-2);
            border: 2px solid var(--red);
            color: var(--gold);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .btn-group button {
            background: var(--blue);
            outline-color: #0b2a80;
        }
        .btn-group button.danger {
            background: var(--red);
            outline-color: #7a0009;
        }
        .btn-group button.success {
            background: #158a3d;
            outline-color: #0a4a20;
        }
        .btn-group button.gold {
            background: var(--gold);
            color: #000;
            outline-color: #a08600;
        }

        .progress-bar {
            display: flex;
            height: 18px;
            background: #0a0c1a;
            border: 1px solid var(--line);
            margin: 4px 0;
            width: 100%;
            max-width: 200px;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--gold);
            transition: width 0.3s;
        }
        .progress-bar .fill.green {
            background: var(--green);
        }
        .progress-bar .fill.red {
            background: var(--red);
        }
        .progress-bar .fill.blue {
            background: var(--blue);
        }

        .crest {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            font-family: var(--pixel);
            font-size: 11px;
            background: var(--panel-2);
            border: 2px solid var(--gold);
            box-shadow: 3px 3px 0 #000;
            color: var(--gold);
            flex-shrink: 0;
        }
        .crest.league-2 {
            border-color: var(--blue);
            color: var(--blue);
        }
        .club-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .club-card .club-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .club-card .club-head h3 {
            margin: 0;
            font-size: 11px;
        }
        .league-tag {
            display: inline-block;
            font-family: var(--pixel);
            font-size: 8px;
            padding: 3px 6px;
            margin-bottom: 6px;
            background: var(--red);
            color: #fff;
        }
        .league-tag.tag-2 {
            background: var(--blue);
        }

        .arcade-title {
            text-align: center;
            margin-bottom: 4px;
        }
        .blink {
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        .subtitle {
            text-align: center;
            font-family: var(--pixel);
            font-size: 9px;
            color: var(--dim);
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .league-tabs {
            display: flex;
            gap: 8px;
            margin: 10px 0 16px;
        }
        .league-tabs button {
            background: var(--panel-2);
            color: var(--dim);
            outline-color: var(--line);
        }
        .league-tabs button.active {
            background: var(--gold);
            color: #000;
            outline-color: #a08600;
        }

        ::selection {
            background: var(--gold);
            color: #000;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--red);
            border: 2px solid var(--bg);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: var(--panel);
            border: 3px solid var(--gold);
            padding: 30px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.7);
        }
        .modal-box h2 {
            margin-top: 0;
        }
        .modal-box .close-btn {
            float: right;
            background: var(--red);
            outline-color: #7a0009;
            font-size: 14px;
            padding: 5px 14px;
        }

        .news-item {
            padding: 10px;
            border-left: 4px solid var(--blue);
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
        }
        .news-item .news-date {
            color: var(--dim);
            font-size: 14px;
            font-family: var(--pixel);
        }
        .news-item .news-title {
            color: var(--gold);
            font-weight: bold;
        }
        .news-item.urgent {
            border-left-color: var(--red);
            background: rgba(227, 0, 15, 0.08);
        }
        .news-item.success {
            border-left-color: var(--green);
            background: rgba(57, 255, 20, 0.05);
        }
        .news-item.warning {
            border-left-color: var(--gold);
            background: rgba(255, 210, 0, 0.06);
        }

        .badge {
            display: inline-block;
            font-family: var(--pixel);
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 0;
            margin: 0 4px;
        }
        .badge.gold {
            background: var(--gold);
            color: #000;
        }
        .badge.red {
            background: var(--red);
            color: #fff;
        }
        .badge.blue {
            background: var(--blue);
            color: #fff;
        }
        .badge.green {
            background: var(--green);
            color: #000;
        }
        .badge.dim {
            background: var(--dim);
            color: #000;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .player-row .p-info {
            flex: 1;
            min-width: 120px;
        }
        .player-row .p-stats {
            display: flex;
            gap: 12px;
            font-size: 16px;
            color: var(--dim);
        }

        .morale-bar {
            display: inline-block;
            width: 60px;
            height: 8px;
            background: #0a0c1a;
            border: 1px solid var(--line);
            position: relative;
        }
        .morale-bar .fill {
            height: 100%;
            transition: width 0.3s;
        }

        .task-item {
            padding: 8px 12px;
            margin: 4px 0;
            border-left: 3px solid var(--gold);
            background: rgba(255, 210, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .task-item.urgent {
            border-left-color: var(--red);
            background: rgba(227, 0, 15, 0.08);
        }
        .task-item.done {
            border-left-color: var(--green);
            background: rgba(57, 255, 20, 0.05);
            opacity: 0.7;
        }

        .match-result {
            padding: 6px 12px;
            margin: 2px 0;
            border-left: 3px solid var(--dim);
        }
        .match-result.win {
            border-left-color: var(--green);
        }
        .match-result.loss {
            border-left-color: var(--red);
        }
        .match-result.draw {
            border-left-color: var(--gold);
        }

        .form-indicator {
            display: inline-flex;
            gap: 4px;
            font-size: 16px;
        }
        .form-indicator span {
            width: 24px;
            text-align: center;
        }
        .form-indicator .w {
            color: var(--green);
        }
        .form-indicator .l {
            color: var(--red);
        }
        .form-indicator .d {
            color: var(--gold);
        }

        @media (max-width: 700px) {
            body {
                font-size: 16px;
                padding: 10px;
            }
            h1 {
                font-size: 14px;
            }
            h2 {
                font-size: 11px;
            }
            button {
                font-size: 8px;
                padding: 6px 10px;
            }
            .card {
                flex: 1 1 100%;
            }
            .menu button {
                font-size: 7px;
                padding: 5px 8px;
            }
            table {
                font-size: 16px;
            }
            th,
            td {
                padding: 3px 6px;
            }
            .modal-box {
                padding: 16px;
            }
            .task-item {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <h1 class="arcade-title">⚽ SPORTDIREKTOR SIMULATOR</h1>
    <p class="subtitle">1. BUNDESLIGA <span class="blink">▮</span> 2. BUNDESLIGA — SAISON 2026/27</p>

    <div id="app">
        <!-- ====== START SCREEN ====== -->
        <div id="start-screen" class="container">
            <div style="text-align:center;padding:30px 0;">
                <h1 style="font-size:32px;">⚽ SPORTDIREKTOR</h1>
                <p style="font-size:28px;color:var(--gold);">BUNDESLIGA MANAGEMENT</p>
                <p style="font-size:18px;color:var(--dim);margin:20px 0 40px;">SIMULATOR 2026/27</p>
                <div style="display:flex;flex-direction:column;gap:16px;align-items:center;max-width:300px;margin:0 auto;">
                    <button id="btn-new-career" style="width:100%;font-size:14px;padding:16px;">🆕 NEUE KARRIERE</button>
                    <button id="btn-load-career" style="width:100%;font-size:14px;padding:16px;background:var(--blue);outline-color:#0b2a80;">📂 KARRIERE LADEN</button>
                </div>
                <p style="margin-top:30px;color:var(--dim);font-size:14px;">Alle Daten werden lokal im Browser gespeichert.</p>
            </div>
        </div>

        <!-- ====== SELECT SCREEN ====== -->
        <div id="select-screen" class="container hidden">
            <h2>&gt; Wähle deinen Verein_</h2>
            <div id="league-tabs" class="league-tabs">
                <button data-league="Bundesliga" class="active">1. Bundesliga</button>
                <button data-league="2. Bundesliga">2. Bundesliga</button>
            </div>
            <div id="club-list" class="flex"></div>
            <button id="back-to-start" class="secondary" style="margin-top:14px;">⬅ Zurück</button>
        </div>

        <!-- ====== MAIN GAME UI ====== -->
        <div id="game-screen" class="hidden">
            <!-- Header -->
            <div class="flex" style="justify-content:space-between;align-items:center;">
                <h2 id="club-name-header"></h2>
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                    <span id="season-display" class="status">Saison 2026/27</span>
                    <span id="matchday-display" class="status">Spieltag 0</span>
                    <span id="budget-display" class="status" style="border-color:var(--gold);">€0.0M</span>
                </div>
            </div>

            <!-- Menu -->
            <div class="menu" id="main-menu">
                <button data-tab="dashboard" class="active">Dashboard</button>
                <button data-tab="squad">Kader</button>
                <button data-tab="transfers">Transfers</button>
                <button data-tab="scouting">Scouting</button>
                <button data-tab="coach">Trainer</button>
                <button data-tab="board">Vorstand</button>
                <button data-tab="news">News</button>
                <button data-tab="matchday">Spieltag</button>
                <button data-tab="save">Speichern</button>
            </div>

            <!-- Tab Contents -->
            <div id="tab-dashboard" class="container tab-content"></div>
            <div id="tab-squad" class="container tab-content hidden"></div>
            <div id="tab-transfers" class="container tab-content hidden"></div>
            <div id="tab-scouting" class="container tab-content hidden"></div>
            <div id="tab-coach" class="container tab-content hidden"></div>
            <div id="tab-board" class="container tab-content hidden"></div>
            <div id="tab-news" class="container tab-content hidden"></div>
            <div id="tab-matchday" class="container tab-content hidden"></div>
            <div id="tab-save" class="container tab-content hidden"></div>
        </div>
    </div>

    <!-- ====== MODAL CONTAINER ====== -->
    <div id="modal-container"></div>

    <script>
        // ================================================================
        //  DATA MODELS
        // ================================================================

        const POSITIONS = ["IV", "AV", "ZM", "FL", "ST"];
        const ATTRIBUTES = ["geschwindigkeit", "passspiel", "schuss", "defensive", "kopfball"];
        const POSITION_WEIGHTS = {
            IV: { defensive: 0.6, kopfball: 0.2, passspiel: 0.1, geschwindigkeit: 0.05, schuss: 0.05 },
            AV: { geschwindigkeit: 0.3, defensive: 0.3, passspiel: 0.2, schuss: 0.1, kopfball: 0.1 },
            ZM: { passspiel: 0.3, schuss: 0.2, geschwindigkeit: 0.15, defensive: 0.25, kopfball: 0.1 },
            FL: { geschwindigkeit: 0.3, schuss: 0.25, passspiel: 0.2, defensive: 0.1, kopfball: 0.15 },
            ST: { schuss: 0.35, kopfball: 0.25, geschwindigkeit: 0.2, passspiel: 0.1, defensive: 0.1 }
        };

        const FIRST_NAMES = ["Max", "Lukas", "Julian", "Marco", "Mats", "Thomas", "Manuel", "Joshua", "Serge", "Leon",
            "Kai", "Timo", "Niclas", "Florian", "Robin", "Bernd", "Kevin", "Matthias", "Christian", "Jan",
            "Felix", "Luis", "Paul", "Finn", "Luca", "Elias", "Marlon", "Emil", "Anton", "Oskar",
            "David", "Noah", "Matteo", "Johannes", "Philipp", "Moritz", "Benedikt", "Jakob", "Alexander", "Niklas"
        ];
        const LAST_NAMES = ["Müller", "Schmidt", "Schneider", "Fischer", "Weber", "Meyer", "Wagner", "Becker", "Schulz",
            "Hoffmann",
            "Koch", "Richter", "Klein", "Wolf", "Schröder", "Neumann", "Zimmermann", "Braun", "Krüger", "Frank",
            "Bauer", "König", "Huber", "Keller", "Baum", "Schulze", "Lange", "Werner", "Hartmann", "Krause",
            "Fuchs", "Peters", "Möller", "Weiß", "Jung", "Hahn", "Schubert", "Vogel", "Friedrich", "Klein"
        ];

        function randomName() {
            return randomItem(FIRST_NAMES) + " " + randomItem(LAST_NAMES);
        }

        function randomNationality() { return randomItem(NATIONALITIES); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function rand(min, max) { return min + Math.random() * (max - min); }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        // ---- Player ----
        class Player {
            constructor(id, name, age, position, attributes, marketValue, salary, contractYears, potential, nationality) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.position = position;
                this.attributes = attributes;
                this.marketValue = marketValue;
                this.salary = salary;
                this.contractYears = contractYears;
                this.potential = potential;
                this.nationality = nationality || randomNationality();
                this.satisfaction = 60 + randInt(0, 35);
                this.gamesPlayed = 0;
                this.goals = 0;
                this.assists = 0;
                this.injuryWeeks = 0;
                this.formPenalty = 0;
                this.morale = 60 + randInt(0, 30);
                this.reputation = 40 + randInt(0, 40);
                this.role = "Stammspieler";
                this.yellowCards = 0;
                this.redCards = 0;
                this.weeksDeveloped = 0;
                this.moraleHistory = [];
                this.contractDemand = null; // {salary, years, bonus}
                this.wantsTransfer = false;
                this.transferRequestReason = null;
                this.personality = randomItem(["ehrgeizig", "loyal", "professionell", "temperamentvoll", "ruhig"]);
            }

            get overall() {
                const vals = Object.values(this.attributes);
                let ov = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                ov = clamp(ov - this.formPenalty, 1, 99);
                return ov;
            }

            get form() {
                let f = 70 + randInt(-5, 5);
                f = clamp(f - this.formPenalty * 1.5, 0, 100);
                return Math.round(f);
            }

            get moraleLevel() {
                if (this.morale >= 75) return "hoch";
                if (this.morale >= 50) return "mittel";
                return "niedrig";
            }

            get moraleColor() {
                if (this.morale >= 75) return "var(--green)";
                if (this.morale >= 50) return "var(--gold)";
                return "var(--red)";
            }

            getMoraleReason() {
                const reasons = [];
                if (this.gamesPlayed < 5 && this.role === "Stammspieler") reasons.push("Zu wenig Einsatzzeit");
                if (this.salary < this.marketValue * 0.08) reasons.push("Unterbezahlt");
                if (this.injuryWeeks > 0) reasons.push("Verletzt");
                if (this.contractYears < 2) reasons.push("Vertrag läuft aus");
                if (this.wantsTransfer) reasons.push("Wechselwunsch");
                if (this.morale < 40 && reasons.length === 0) reasons.push("Allgemein unzufrieden");
                return reasons.length ? reasons.join(", ") : "Zufrieden";
            }

            toJSON() {
                return { ...this, attributes: { ...this.attributes }, moraleHistory: [...this.moraleHistory] };
            }

            static fromJSON(data) {
                const p = new Player(data.id, data.name, data.age, data.position, data.attributes,
                    data.marketValue, data.salary, data.contractYears, data.potential, data.nationality);
                p.satisfaction = data.satisfaction;
                p.gamesPlayed = data.gamesPlayed;
                p.goals = data.goals;
                p.assists = data.assists;
                p.injuryWeeks = data.injuryWeeks;
                p.formPenalty = data.formPenalty;
                p.morale = data.morale;
                p.reputation = data.reputation;
                p.role = data.role;
                p.yellowCards = data.yellowCards || 0;
                p.redCards = data.redCards || 0;
                p.weeksDeveloped = data.weeksDeveloped || 0;
                p.moraleHistory = data.moraleHistory || [];
                p.contractDemand = data.contractDemand || null;
                p.wantsTransfer = data.wantsTransfer || false;
                p.transferRequestReason = data.transferRequestReason || null;
                p.personality = data.personality || "professionell";
                return p;
            }
        }

        function generatePlayer(id, age = null, position = null) {
            if (age === null) age = 18 + randInt(0, 18);
            if (position === null) position = randomItem(POSITIONS);
            const attrs = {};
            ATTRIBUTES.forEach(attr => {
                let base = 45 + randInt(0, 40);
                const weights = POSITION_WEIGHTS[position];
                if (weights && weights[attr]) {
                    base += Math.floor(weights[attr] * 25);
                }
                attrs[attr] = clamp(base, 1, 99);
            });
            const overall = Math.round(Object.values(attrs).reduce((a, b) => a + b, 0) / ATTRIBUTES.length);
            const marketValue = Math.round((0.3 + (overall / 100) * 12 + rand(-0.5, 0.5)) * 10) / 10;
            const salary = Math.round((0.15 + (overall / 100) * 5 + rand(-0.3, 0.3)) * 10) / 10;

            return new Player(id, randomName(), age, position, attrs, Math.max(0.1, marketValue),

        function buildLeagueClubs(clubDefs, league, startId, financeScale) {
            const clubs = [];
            let playerId = startId;
            clubDefs.forEach((def, idx) => {
                const factor = 1.0 - (idx / (clubDefs.length * 1.3));
                const f = clamp(factor, 0.2, 1.0);
                const financial = Math.round((financeScale.reserveBase + f * financeScale.reserveSpan) * 10) / 10;
                const transfer = Math.round((financeScale.transferBase + f * financeScale.transferSpan) * 10) / 10;
                const salary = Math.round((financeScale.salaryBase + f * financeScale.salarySpan) * 10) / 10;
                const goals = {
                    leaguePlace: 1 + randInt(0, 17),
                    cupRound: ["round1", "round2", "quarter", "semi", "final"][randInt(0, 4)]
                };
                const stadium = { name: def.stadium, capacity: def.capacity };
                const club = new Club(def.name, league, financial, transfer, salary, goals,
                    1 + randInt(0, 5), stadium, def.reputation || 50);
                const numPlayers = 22 + randInt(0, 8);
                for (let i = 0; i < numPlayers; i++) {
                    let age = 18 + randInt(0, 18);
                    if (i < 4) age = 17 + randInt(0, 4);
                    else if (i > 18) age = 30 + randInt(0, 6);
                    const p = generatePlayer(playerId++, age);
                    const valueMult = (0.6 + 0.5 * f) * financeScale.valueMultiplier;
                    p.marketValue = Math.round(p.marketValue * valueMult * 10) / 10;
                    p.salary = Math.round(p.salary * (0.7 + 0.5 * f) * 10) / 10;
                    club.players.push(p);
                }
                const coach = generateCoach(1000 + idx + startId);
                coach.wageDemand = Math.round((0.5 + f * 2.5) * 10) / 10;
                club.coach = coach;
                clubs.push(club);
            });
            return clubs;
        }
