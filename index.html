<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Sportdirektor-Simulator // Bundesliga &amp; 2. Bundesliga 2026/27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           MODERN EA FC KARRIERE MODUS – STYLE
           ================================================================ */
        :root {
            --bg: #0b0e14;
            --panel: #14181f;
            --panel-2: #1c222b;
            --line: #2a3340;
            --red: #e60023;
            --gold: #f5c400;
            --blue: #1a6dff;
            --green: #3ddc84;
            --text: #eef2f7;
            --dim: #8a9bb5;
            --shadow: 0 8px 24px rgba(0,0,0,0.6);
            --radius: 12px;
            --font: 'Inter', 'Roboto', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font);
            font-size: 16px;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            line-height: 1.5;
            background-image: radial-gradient(ellipse at top, rgba(26,109,255,0.08), transparent 60%);
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--blue);
            border-radius: 4px;
        }

        h1, h2, h3, h4 {
            font-family: var(--font);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
        }
        h1 { font-size: 28px; padding: 16px 0; }
        h2 { font-size: 22px; margin-bottom: 12px; color: var(--gold); }
        h3 { font-size: 18px; margin-bottom: 10px; color: #fff; }
        h4 { font-size: 16px; margin: 10px 0; color: var(--dim); }

        p { font-size: 16px; }
        .small-text { font-size: 14px; }
        .tiny-text { font-size: 12px; }

        /* Buttons modern */
        button {
            font-family: var(--font);
            font-weight: 600;
            font-size: 14px;
            background: var(--blue);
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-transform: none;
            letter-spacing: 0.3px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(26,109,255,0.4);
            background: #2a7aff;
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        button.secondary {
            background: #2a3340;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button.secondary:hover {
            background: #3a4555;
        }
        button.success {
            background: var(--green);
            color: #000;
        }
        button.success:hover {
            background: #4eea8e;
        }
        button.danger {
            background: var(--red);
        }
        button.danger:hover {
            background: #ff1a3a;
        }
        button.gold {
            background: var(--gold);
            color: #000;
        }
        button.gold:hover {
            background: #ffd633;
        }
        button.small {
            font-size: 12px;
            padding: 6px 14px;
        }
        button.tiny {
            font-size: 10px;
            padding: 4px 10px;
        }

        input, select, textarea {
            font-family: var(--font);
            font-size: 16px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: #fff;
            width: 100%;
            max-width: 300px;
        }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--blue);
            border-color: var(--blue);
        }

        /* Container / Cards */
        .container {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }
        .card {
            background: var(--panel-2);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--line);
            flex: 1 1 220px;
            transition: all 0.2s;
        }
        .card:hover {
            border-color: var(--blue);
        }
        .card.wide {
            flex: 1 1 100%;
        }
        .card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
        }
        .card .label {
            font-size: 13px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* Menu */
        .menu {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 20px 0 10px;
            background: var(--panel);
            border-radius: var(--radius);
            padding: 8px 12px;
            border: 1px solid var(--line);
        }
        .menu button {
            background: transparent;
            box-shadow: none;
            border-radius: 8px;
            color: var(--dim);
            font-weight: 500;
            padding: 10px 18px;
            font-size: 14px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .menu button:hover {
            background: var(--panel-2);
            color: #fff;
            transform: none;
            box-shadow: none;
        }
        .menu button.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
            box-shadow: 0 4px 12px rgba(26,109,255,0.3);
        }

        /* Tabelle */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 15px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        th {
            background: var(--panel-2);
            color: var(--gold);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--blue);
        }
        tr:hover td {
            background: rgba(255,255,255,0.03);
        }
        tr.row-own {
            background: rgba(26,109,255,0.12);
        }
        tr.row-own td:first-child {
            font-weight: 700;
            color: var(--gold);
        }
        .row-champions td:first-child { border-left: 4px solid var(--blue); }
        .row-europa td:first-child { border-left: 4px solid var(--green); }
        .row-playoff td:first-child { border-left: 4px solid var(--gold); }
        .row-relegation td:first-child { border-left: 4px solid var(--red); }

        /* Ticker / News */
        .ticker {
            background: var(--panel-2);
            border-radius: var(--radius);
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--line);
        }
        .ticker p {
            margin: 6px 0;
            font-size: 15px;
        }
        .ticker hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: 8px 0;
        }

        .news-item {
            padding: 12px 16px;
            border-left: 4px solid var(--blue);
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .news-item .news-date {
            color: var(--dim);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .news-item.urgent { border-left-color: var(--red); background: rgba(230,0,35,0.08); }
        .news-item.success { border-left-color: var(--green); background: rgba(61,220,132,0.06); }
        .news-item.warning { border-left-color: var(--gold); background: rgba(245,196,0,0.06); }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin: 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge.gold { background: var(--gold); color: #000; }
        .badge.red { background: var(--red); color: #fff; }
        .badge.blue { background: var(--blue); color: #fff; }
        .badge.green { background: var(--green); color: #000; }
        .badge.dim { background: var(--dim); color: #000; }

        /* Crest */
        .crest {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            font-weight: 800;
            font-size: 14px;
            background: var(--panel-2);
            border: 2px solid var(--gold);
            border-radius: 50%;
            color: var(--gold);
            flex-shrink: 0;
        }
        .crest.league-2 {
            border-color: var(--blue);
            color: var(--blue);
        }

        /* Club Card */
        .club-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--panel-2);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--line);
            transition: all 0.2s;
        }
        .club-card:hover {
            border-color: var(--blue);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .club-card .club-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .club-card .club-head h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .league-tag {
            display: inline-block;
            font-weight: 700;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--red);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .league-tag.tag-2 {
            background: var(--blue);
        }

        .league-tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0 20px;
        }
        .league-tabs button {
            background: var(--panel-2);
            color: var(--dim);
            border: 1px solid var(--line);
            box-shadow: none;
            border-radius: 30px;
            padding: 8px 24px;
        }
        .league-tabs button.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(245,196,0,0.3);
        }

        /* Progress / Morale */
        .progress-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            background: var(--line);
            overflow: hidden;
            margin: 4px 0;
            width: 100%;
            max-width: 200px;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: var(--gold);
            transition: width 0.3s;
        }
        .progress-bar .fill.green { background: var(--green); }
        .progress-bar .fill.red { background: var(--red); }
        .progress-bar .fill.blue { background: var(--blue); }

        .morale-bar {
            display: inline-block;
            width: 70px;
            height: 6px;
            border-radius: 3px;
            background: var(--line);
            overflow: hidden;
            vertical-align: middle;
            margin-right: 6px;
        }
        .morale-bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* Spielerzeile */
        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        .player-row .p-info {
            flex: 1;
            min-width: 140px;
        }
        .player-row .p-stats {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: var(--dim);
        }

        .task-item {
            padding: 12px 16px;
            margin: 6px 0;
            border-left: 4px solid var(--gold);
            background: rgba(245,196,0,0.04);
            border-radius: 0 var(--radius) var(--radius) 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .task-item.urgent { border-left-color: var(--red); background: rgba(230,0,35,0.06); }
        .task-item.warning { border-left-color: var(--gold); background: rgba(245,196,0,0.06); }
        .task-item.done { border-left-color: var(--green); background: rgba(61,220,132,0.06); opacity: 0.8; }

        .match-result {
            padding: 8px 14px;
            margin: 4px 0;
            border-left: 4px solid var(--dim);
            border-radius: 0 var(--radius) var(--radius) 0;
            background: rgba(255,255,255,0.02);
        }
        .match-result.win { border-left-color: var(--green); }
        .match-result.loss { border-left-color: var(--red); }
        .match-result.draw { border-left-color: var(--gold); }

        .form-indicator {
            display: inline-flex;
            gap: 4px;
            font-size: 14px;
        }
        .form-indicator .w { color: var(--green); }
        .form-indicator .l { color: var(--red); }
        .form-indicator .d { color: var(--gold); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 760px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal-box h2 {
            margin-top: 0;
            color: var(--gold);
        }
        .modal-box .close-btn {
            float: right;
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--dim);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: none;
        }
        .modal-box .close-btn:hover {
            background: var(--red);
            color: #fff;
        }

        /* Status */
        .status {
            font-weight: 600;
            padding: 8px 16px;
            background: var(--panel-2);
            border-radius: 30px;
            border: 1px solid var(--line);
            color: var(--dim);
            font-size: 14px;
        }
        .status.gold {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Start Screen */
        .start-box {
            text-align: center;
            padding: 40px 20px;
        }
        .start-box h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #ffd966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .start-box .sub {
            font-size: 20px;
            color: var(--dim);
            margin-bottom: 32px;
        }
        .start-box .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 320px;
            margin: 0 auto;
        }
        .start-box .btn-group button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
        }

        /* misc */
        .hidden { display: none !important; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-dim { color: var(--dim); }
        .highlight { color: var(--gold); font-weight: 700; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        /* Responsive */
        @media (max-width: 700px) {
            body { padding: 12px; }
            h1 { font-size: 22px; }
            h2 { font-size: 18px; }
            button { font-size: 13px; padding: 8px 16px; }
            .card { flex: 1 1 100%; }
            .menu button { font-size: 12px; padding: 6px 12px; }
            table { font-size: 13px; }
            th, td { padding: 6px 8px; }
            .modal-box { padding: 20px; }
            .crest { width: 40px; height: 40px; font-size: 12px; }
            .start-box h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <h1 style="text-align:center; margin-bottom:0;">⚽ SPORTDIREKTOR</h1>
    <p style="text-align:center; color:var(--dim); font-weight:500; letter-spacing:1px; margin-top:-6px;">BUNDESLIGA &amp; 2. BUNDESLIGA — SAISON 2026/27</p>

    <div id="app">
        <!-- ====== START SCREEN ====== -->
        <div id="start-screen" class="container" style="background:var(--panel-2);">
            <div class="start-box">
                <h1>⚽ SPORTDIREKTOR</h1>
                <p class="sub">Bundesliga Management Simulator</p>
                <div class="btn-group">
                    <button id="btn-new-career" style="background:var(--gold);color:#000;">🆕 NEUE KARRIERE</button>
                    <button id="btn-load-career" class="secondary">📂 KARRIERE LADEN</button>
                </div>
                <p style="margin-top:30px; font-size:14px; color:var(--dim);">Alle Daten werden lokal im Browser gespeichert.</p>
                <p style="font-size:12px; color:var(--dim);">⚡ Realistische Kader &amp; Marktwerte 2026/27</p>
            </div>
        </div>

        <!-- ====== SELECT SCREEN ====== -->
        <div id="select-screen" class="container hidden">
            <h2>&gt; Wähle deinen Verein</h2>
            <div id="league-tabs" class="league-tabs">
                <button data-league="Bundesliga" class="active">1. Bundesliga</button>
                <button data-league="2. Bundesliga">2. Bundesliga</button>
            </div>
            <div id="club-list" class="flex"></div>
            <button id="back-to-start" class="secondary" style="margin-top:20px;">⬅ Zurück</button>
        </div>

        <!-- ====== MAIN GAME UI ====== -->
        <div id="game-screen" class="hidden">
            <!-- Header -->
            <div class="flex" style="justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                <h2 id="club-name-header" style="margin:0;"></h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <span id="season-display" class="status">Saison 2026/27</span>
                    <span id="matchday-display" class="status">Spieltag 0</span>
                    <span id="budget-display" class="status gold">€0.0M</span>
                </div>
            </div>

            <!-- Menu -->
            <div class="menu" id="main-menu">
                <button data-tab="dashboard" class="active">Dashboard</button>
                <button data-tab="squad">Kader</button>
                <button data-tab="transfers">Transfers</button>
                <button data-tab="scouting">Scouting</button>
                <button data-tab="coach">Trainer</button>
                <button data-tab="board">Vorstand</button>
                <button data-tab="news">News</button>
                <button data-tab="matchday">Spieltag</button>
                <button data-tab="save">Speichern</button>
            </div>

            <!-- Tab Contents -->
            <div id="tab-dashboard" class="container tab-content"></div>
            <div id="tab-squad" class="container tab-content hidden"></div>
            <div id="tab-transfers" class="container tab-content hidden"></div>
            <div id="tab-scouting" class="container tab-content hidden"></div>
            <div id="tab-coach" class="container tab-content hidden"></div>
            <div id="tab-board" class="container tab-content hidden"></div>
            <div id="tab-news" class="container tab-content hidden"></div>
            <div id="tab-matchday" class="container tab-content hidden"></div>
            <div id="tab-save" class="container tab-content hidden"></div>
        </div>
    </div>

    <!-- ====== MODAL CONTAINER ====== -->
    <div id="modal-container"></div>

    <script>
        // ================================================================
        //  REALISTIC DATA – Bundesliga & 2. Bundesliga 2026/27
        //  Based on transfermarkt.de data (2025/26 season, projected to 2026/27)
        // ================================================================

        // ---- CLUB DATA with philosophies and realistic budgets ----

            { name: "SC Freiburg", crest: "SCF", reputation: 74, stadium: "Europa-Park Stadion", capacity: 34700,

                budget: { reserve: 35, transfer: 18, salary: 22 }, goal: { league: 8, cup: "round2" } },
            { name: "1. FC Union Berlin", crest: "FCU", reputation: 72, stadium: "Stadion An der Alten Försterei",

        // ---- Helper functions ----
        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function rand(min, max) { return min + Math.random() * (max - min); }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        // ---- Build player objects from data ----
        function buildPlayersFromData(clubName, dataArray) {
            const players = [];
            let id = 10000 + Math.random() * 100000;
            dataArray.forEach((pData, idx) => {
                const attrs = {};
                const pos = pData.pos;
                const ovr = pData.ovr || 70;
                // Generate attributes based on position
                ATTRIBUTES.forEach(attr => {
                    let base = ovr + randInt(-8, 8);
                    const weights = POSITION_WEIGHTS[pos] || POSITION_WEIGHTS["ZM"];
                    if (weights && weights[attr]) {
                        base += Math.floor(weights[attr] * 12);
                    }
                    attrs[attr] = clamp(base, 1, 99);
                });
                const player = new Player(
                    id + idx,
                    pData.name,
                    pData.age || 20,
                    pos,
                    attrs,
                    pData.val || 1.0,
                    pData.sal || 0.5,
                    2 + randInt(0, 3),
                    pData.pot || pData.ovr || 70,
                    pData.nat || "Deutschland"
                );
                player.gamesPlayed = randInt(0, 30);
                player.goals = randInt(0, 10);
                player.morale = 50 + randInt(0, 40);
                player.reputation = ovr + randInt(-10, 5);
                players.push(player);
            });
            return players;
        }

        // ---- Player class (extends with realism) ----
        class Player {
            constructor(id, name, age, position, attributes, marketValue, salary, contractYears, potential, nationality) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.position = position;
                this.attributes = attributes;
                this.marketValue = marketValue;
                this.salary = salary;
                this.contractYears = contractYears;
                this.potential = potential;
                this.nationality = nationality || "Deutschland";
                this.satisfaction = 60 + randInt(0, 35);
                this.gamesPlayed = 0;
                this.goals = 0;
                this.assists = 0;
                this.injuryWeeks = 0;
                this.formPenalty = 0;
                this.morale = 60 + randInt(0, 30);
                this.reputation = 40 + randInt(0, 40);
                this.role = "Stammspieler";
                this.yellowCards = 0;
                this.redCards = 0;
                this.weeksDeveloped = 0;
                this.moraleHistory = [];
                this.contractDemand = null;
                this.wantsTransfer = false;
                this.transferRequestReason = null;
                this.personality = randomItem(["ehrgeizig", "loyal", "professionell", "temperamentvoll", "ruhig"]);
                this.clubHistory = [];
                this.seasonStats = { goals: 0, assists: 0, appearances: 0 };
                this.careerStats = { goals: 0, assists: 0, appearances: 0 };
            }

            get overall() {
                const vals = Object.values(this.attributes);
                let ov = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                ov = clamp(ov - this.formPenalty, 1, 99);
                return ov;
            }

            get form() {
                let f = 70 + randInt(-5, 5);
                f = clamp(f - this.formPenalty * 1.5, 0, 100);
                return Math.round(f);
            }

            get moraleLevel() {
                if (this.morale >= 75) return "hoch";
                if (this.morale >= 50) return "mittel";
                return "niedrig";
            }

            getMoraleReason() {
                const reasons = [];
                if (this.gamesPlayed < 5 && this.role === "Stammspieler") reasons.push("Zu wenig Einsatzzeit");
                if (this.salary < this.marketValue * 0.08) reasons.push("Unterbezahlt");
                if (this.injuryWeeks > 0) reasons.push("Verletzt");
                if (this.contractYears < 2) reasons.push("Vertrag läuft aus");
                if (this.wantsTransfer) reasons.push("Wechselwunsch");
                if (this.morale < 40 && reasons.length === 0) reasons.push("Allgemein unzufrieden");
                return reasons.length ? reasons.join(", ") : "Zufrieden";
            }

            toJSON() {
                return { ...this, attributes: { ...this.attributes }, moraleHistory: [...this.moraleHistory] };
            }

            static fromJSON(data) {
                const p = new Player(data.id, data.name, data.age, data.position, data.attributes,
                    data.marketValue, data.salary, data.contractYears, data.potential, data.nationality);
                p.satisfaction = data.satisfaction;
                p.gamesPlayed = data.gamesPlayed;
                p.goals = data.goals;
                p.assists = data.assists;
                p.injuryWeeks = data.injuryWeeks;
                p.formPenalty = data.formPenalty;
                p.morale = data.morale;
                p.reputation = data.reputation;
                p.role = data.role;
                p.yellowCards = data.yellowCards || 0;
                p.redCards = data.redCards || 0;
                p.weeksDeveloped = data.weeksDeveloped || 0;
                p.moraleHistory = data.moraleHistory || [];
                p.contractDemand = data.contractDemand || null;
                p.wantsTransfer = data.wantsTransfer || false;
                p.transferRequestReason = data.transferRequestReason || null;
                p.personality = data.personality || "professionell";
                p.clubHistory = data.clubHistory || [];
                p.seasonStats = data.seasonStats || { goals: 0, assists: 0, appearances: 0 };
                p.careerStats = data.careerStats || { goals: 0, assists: 0, appearances: 0 };
                return p;
            }
        }

                this.staff = { scouts: [] };
                this.avgAge = 0;
                this.squadValueCache = 0;
            }

            averageOverall() {
                if (!this.players.length) return 0;
                const sum = this.players.reduce((acc, p) => acc + p.overall, 0);
                return Math.round(sum / this.players.length);
            }

            totalWages() {
                return this.players.reduce((acc, p) => acc + p.salary, 0);
            }

            squadValue() {
                return this.players.reduce((acc, p) => acc + p.marketValue, 0);
            }

            getFormString() {
                const res = this.lastFiveResults.slice(-5);
                return res.map(r => r === 'W' ? 'W' : r === 'L' ? 'L' : 'D').join('');
            }

            toJSON() {
                return {
                    name: this.name,
                    league: this.league,
                    financialReserves: this.financialReserves,
                    transferBudget: this.transferBudget,
                    salaryBudget: this.salaryBudget,
                    seasonGoals: { ...this.seasonGoals },
                    youthAcademyLevel: this.youthAcademyLevel,
                    stadium: { ...this.stadium },
                    reputation: this.reputation,
                    philosophy: this.philosophy,
                    fanTrust: this.fanTrust,
                    boardSatisfaction: this.boardSatisfaction,
                    fanSatisfaction: this.fanSatisfaction,
                    trophies: [...this.trophies],
                    seasonPoints: this.seasonPoints,
                    seasonGoalsScored: this.seasonGoalsScored,
                    seasonGoalsConceded: this.seasonGoalsConceded,
                    history: [...this.history],
                    sponsorIncome: this.sponsorIncome,
                    ticketIncome: this.ticketIncome,
                    merchandisingIncome: this.merchandisingIncome,
                    youthTalents: this.youthTalents.map(t => ({ ...t })),
                    players: this.players.map(p => p.toJSON()),
                    coach: this.coach ? this.coach.toJSON() : null,
                    lastFiveResults: [...this.lastFiveResults],
                    financialHistory: [...this.financialHistory],
                    staff: { scouts: [...this.staff.scouts] },
                    avgAge: this.avgAge,
                    squadValueCache: this.squadValueCache
                };
            }

            static fromJSON(data) {
                const club = new Club(data.name, data.league || "Bundesliga", data.financialReserves, data.transferBudget,
