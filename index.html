        }

        function showSquadAnalysis() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const report = eng.squadDepthReport(club);
            document.getElementById('squad-analysis-output').innerHTML = `<pre>${report}</pre>`;
        }

        function showPlayerDetails() {
            const club = appState.playerClub;
            const name = prompt("Spielername eingeben:");
            if (!name) return;
            const p = club.players.find(p => p.name.toLowerCase().includes(name.toLowerCase()));
            if (!p) { alert("Spieler nicht gefunden."); return; }
            const attrs = Object.entries(p.attributes).map(([k, v]) => `${k}: ${v}`).join(', ');
            showModal(`🧑 ${p.name}`, `
                <p><strong>Position:</strong> ${p.position} | <strong>Alter:</strong> ${p.age}</p>
                <p><strong>Nationalität:</strong> ${p.nationality}</p>
                <p><strong>Stärke:</strong> ${p.overall} | <strong>Potential:</strong> ${p.potential}</p>
                <p><strong>Marktwert:</strong> ${formatMoney(p.marketValue)} | <strong>Gehalt:</strong> ${formatMoney(p.salary)}</p>
                <p><strong>Vertrag:</strong> ${p.contractYears} Jahre | <strong>Rolle:</strong> ${p.role}</p>
                <p><strong>Moral:</strong> ${p.morale}% ${moraleBar(p.morale)}</p>
                <p><strong>Einsätze:</strong> ${p.gamesPlayed} | <strong>Tore:</strong> ${p.goals}</p>
                <p><strong>Attribute:</strong> ${attrs}</p>
                <p><strong>Moral-Grund:</strong> ${p.getMoraleReason()}</p>
                ${p.injuryWeeks > 0 ? `<p style="color:var(--red);">🩹 Verletzt: ${p.injuryWeeks} Wochen</p>` : ''}
                ${p.wantsTransfer ? `<p style="color:var(--gold);">🚪 Wechselwunsch: ${p.transferRequestReason || 'Allgemein'}</p>` : ''}
                ${p.contractDemand ? `<p style="color:var(--blue);">📝 Vertragsforderung: ${formatMoney(p.contractDemand.salary)} für ${p.contractDemand.years} Jahre</p>` : ''}
                <div class="btn-group">
                    <button onclick="closeModal();extendContractPlayer(${p.id})">📝 Vertrag verlängern</button>
                    <button onclick="closeModal();changeRole(${p.id})">🔄 Rolle ändern</button>
                </div>
            `);
        }

        function extendContractPlayer(id) {
            const club = appState.playerClub;
            const p = club.players.find(p => p.id === id);
            if (!p) return;
            const years = parseInt(prompt(`Vertragslaufzeit für ${p.name} verlängern (1-4 Jahre):`));
            if (isNaN(years) || years < 1 || years > 4) return;
            if (p.satisfaction > 30) {
                p.contractYears += years;
                p.satisfaction = clamp(p.satisfaction + 5, 0, 100);
                p.morale = clamp(p.morale + 8, 0, 100);
                p.contractDemand = null;
                alert(`✅ Vertrag verlängert! ${p.name} hat noch ${p.contractYears} Jahre.`);
                appState.engine.addNews(`📝 ${p.name} hat seinen Vertrag bei ${club.name} verlängert.`, "success");
            } else {
                alert(`❌ ${p.name} ist unzufrieden und lehnt ab.`);
            }
            renderSquad();
        }

        function changeRole(id) {
            const club = appState.playerClub;
            const p = club.players.find(p => p.id === id);
            if (!p) return;
            const roles = ["Stammspieler", "Rotationsspieler", "Ersatz", "Talent", "Führungsspieler"];
            const choice = prompt(`Rolle für ${p.name}:\n${roles.map((r,i) => `${i+1}. ${r}`).join('\n')}\nAuswahl (1-5):`);
            if (!choice) return;
            const idx = parseInt(choice) - 1;
            if (idx < 0 || idx >= roles.length) return;
            p.role = roles[idx];
            p.morale = clamp(p.morale + (idx < 2 ? 5 : -3), 0, 100);
            alert(`✅ Rolle von ${p.name} auf "${p.role}" geändert.`);
            renderSquad();
        }

        function showContractNegotiations() {
            const club = appState.playerClub;
            const demands = club.players.filter(p => p.contractDemand);
            if (!demands.length) {
                showModal("📝 Verträge", "<p>Keine offenen Vertragsforderungen.</p>");
                return;
            }
            let html = `<h4>Offene Vertragsforderungen</h4>`;
            demands.forEach(p => {
                html += `
                    <div class="task-item warning">
                        <span><strong>${p.name}</strong> fordert ${formatMoney(p.contractDemand.salary)} für ${p.contractDemand.years} Jahre</span>
                        <div>
                            <button class="tiny success" onclick="acceptContractDemand(${p.id})">Annehmen</button>
                            <button class="tiny danger" onclick="rejectContractDemand(${p.id})">Ablehnen</button>
                        </div>
                    </div>
                `;
            });
            showModal("📝 Vertragsverhandlungen", html);
        }

        function acceptContractDemand(id) {
            const club = appState.playerClub;
            const p = club.players.find(p => p.id === id);
            if (!p || !p.contractDemand) return;
            const demand = p.contractDemand;
            if (demand.salary > club.salaryBudget * 1.2) {
                alert(`❌ Gehalt zu hoch für das Budget.`);
                return;
            }
            p.salary = demand.salary;
            p.contractYears += demand.years;
            p.morale = clamp(p.morale + 15, 0, 100);
            p.satisfaction = clamp(p.satisfaction + 10, 0, 100);
            p.contractDemand = null;
            appState.engine.addNews(`📝 ${p.name} hat einen neuen Vertrag unterschrieben.`, "success");
            closeModal();
            renderSquad();
            updateHeader();
        }

        function rejectContractDemand(id) {
            const club = appState.playerClub;
            const p = club.players.find(p => p.id === id);
            if (!p) return;
            p.morale = clamp(p.morale - 15, 0, 100);
            p.satisfaction = clamp(p.satisfaction - 10, 0, 100);
            p.contractDemand = null;
            if (p.morale < 25) {
                p.wantsTransfer = true;
                p.transferRequestReason = "Vertragsstreit";
                appState.engine.addNews(`😤 ${p.name} ist verärgert über Vertragsverhandlungen und will wechseln.`,
                "urgent");
            }
            closeModal();
            renderSquad();
        }

        function sellPlayerUI() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const name = prompt("Spielername zum Verkauf:");
            if (!name) return;
            const p = club.players.find(p => p.name.toLowerCase().includes(name.toLowerCase()));
            if (!p) { alert("Spieler nicht gefunden."); return; }
            const interested = eng.clubs.filter(c => c !== club && c.transferBudget > p.marketValue * 0.5);
            if (!interested.length) { alert("Keine interessierten Vereine."); return; }
            const buyer = randomItem(interested);
            const offer = Math.round((p.marketValue * (0.7 + rand(0, 0.5))) * 10) / 10;
            if (confirm(`${buyer.name} bietet ${formatMoney(offer)} für ${p.name}. Verkaufen?`)) {
                const offerObj = {
                    id: Date.now() + Math.random(),
                    player: p,
                    fromClub: club,
                    toClub: buyer,
                    amount: offer,
                    status: 'accept'
                };
                eng.executeTransfer(offerObj);
                alert(`✅ ${p.name} für ${formatMoney(offer)} an ${buyer.name} verkauft.`);
                renderSquad();
                renderDashboard();
                updateHeader();
            } else {
                alert("Verkauf abgelehnt.");
            }
        }

        function extendContractUI() {
            const club = appState.playerClub;
            const name = prompt("Spielername für Vertragsverlängerung:");
            if (!name) return;
            const p = club.players.find(p => p.name.toLowerCase().includes(name.toLowerCase()));
            if (!p) { alert("Spieler nicht gefunden."); return; }
            const years = parseInt(prompt(`${p.name} – zusätzliche Jahre (1-4):`));
            if (isNaN(years) || years < 1 || years > 4) return;
            if (p.satisfaction > 30) {
                p.contractYears += years;
                p.satisfaction = clamp(p.satisfaction + 5, 0, 100);
                p.morale = clamp(p.morale + 8, 0, 100);
                alert(`✅ Vertrag verlängert! ${p.name} hat noch ${p.contractYears} Jahre.`);
                appState.engine.addNews(`📝 ${p.name} hat seinen Vertrag verlängert.`, "success");
            } else {
                alert(`❌ ${p.name} ist unzufrieden.`);
            }
            renderSquad();
        }

        // ---- TRANSFERS ----
        function renderTransfers() {
            const club = appState.playerClub;
            const eng = appState.engine;
            let html = `
                <h3>💰 Transfermarkt</h3>
                <div class="btn-group">
                    <button onclick="scoutPlayersUI()" class="secondary">🔍 Scouten</button>

        function makeOfferUI() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const search = prompt("Spielername oder ID für Angebot:");
            if (!search) return;
            let targetPlayer = null,
                targetClub = null;
            const id = parseInt(search);
            if (!isNaN(id)) {
                for (let c of eng.clubs) {
                    if (c === club) continue;
                    const p = c.players.find(p => p.id === id);
                    if (p) { targetPlayer = p;
                        targetClub = c; break; }
                }
            } else {
                const name = search.toLowerCase();
                for (let c of eng.clubs) {
                    if (c === club) continue;
                    const p = c.players.find(p => p.name.toLowerCase().includes(name));
                    if (p) { targetPlayer = p;
                        targetClub = c; break; }
                }
            }
            if (!targetPlayer) { alert("❌ Spieler nicht gefunden."); return; }
            const amount = parseFloat(prompt(`Angebot für ${targetPlayer.name} (Wert: ${formatMoney(targetPlayer.marketValue)}):`));
            if (isNaN(amount) || amount <= 0) return;

            const result = eng.makeOffer(club, targetClub, targetPlayer, amount, {});
            document.getElementById('transfer-output').innerHTML =
                `<p style="color:${result.success ? 'var(--green)' : 'var(--gold)'};">${result.msg}</p>`;
            if (result.offer && result.offer.status === 'counter') {
                const btn = document.createElement('button');
                btn.textContent = '⚡ Gegenangebot annehmen';
                btn.className = 'gold small';
                btn.onclick = () => {
                    const res = eng.acceptCounter(result.offer.id);
                    document.getElementById('transfer-output').innerHTML =
                        `<p style="color:${res.success ? 'var(--green)' : 'var(--red)'};">${res.msg}</p>`;
                    renderTransfers();
                    renderDashboard();
                    updateHeader();
                };
                document.getElementById('transfer-output').appendChild(btn);
                const btn2 = document.createElement('button');
                btn2.textContent = '❌ Ablehnen';
                btn2.className = 'danger small';
                btn2.onclick = () => {
                    const res = eng.rejectOffer(result.offer.id);
                    document.getElementById('transfer-output').innerHTML =
                        `<p style="color:var(--gold);">${res.msg}</p>`;
                    renderTransfers();
                };
                document.getElementById('transfer-output').appendChild(btn2);
            }
            renderTransfers();
            updateHeader();
        }

            const eng = appState.engine;

                return;

            let out = `<h4>📋 Offene Angebote</h4>`;
            eng.transferOffers.forEach((o, idx) => {
                const isIncoming = o.toClub && o.toClub.name === appState.playerClub.name;
                const isOutgoing = o.fromClub && o.fromClub.name === appState.playerClub.name;
                const label = isIncoming ? '👉 Angebot für dich' : isOutgoing ? '👈 Dein Angebot' : '⚖️';
                out += `<div class="news-item" style="border-left-color:${isIncoming ? 'var(--gold)' : 'var(--blue)'}">
                    <p><strong>${label}</strong> ${o.player?.name || 'Spieler'} – ${formatMoney(o.amount)}</p>
                    <p>Von: ${o.fromClubName || '?'} → Zu: ${o.toClubName || '?'}</p>
                    <p>Status: ${o.status} ${o.counterAmount ? `(Gegenangebot: ${formatMoney(o.counterAmount)})` : ''}</p>
                    ${isIncoming ? `<button onclick="acceptIncomingOffer(${idx})" class="success small">Annehmen</button>` : ''}
                    ${isOutgoing && o.status === 'counter' ? `<button onclick="acceptCounterOffer(${idx})" class="gold small">Gegenangebot annehmen</button>` : ''}
                    <button onclick="rejectOffer(${idx})" class="danger small">Ablehnen</button>
                </div>`;

        function acceptIncomingOffer(idx) {
            const eng = appState.engine;
            const offer = eng.transferOffers[idx];
            if (!offer) return;
            if (offer.toClub && offer.toClub.name === appState.playerClub.name) {
                const player = offer.player;
                const buyer = offer.fromClub;
                if (!player || !buyer) return;
                if (confirm(`${buyer.name} bietet ${formatMoney(offer.amount)} für ${player.name}. Verkaufen?`)) {
                    const idx2 = eng.transferOffers.indexOf(offer);
                    if (idx2 !== -1) eng.transferOffers.splice(idx2, 1);
                    const offerObj = { ...offer, fromClub: appState.playerClub, toClub: buyer, status: 'accept' };
                    eng.executeTransfer(offerObj);
                    document.getElementById('transfer-output').innerHTML =
                        `<p style="color:var(--green);">✅ Verkauf abgeschlossen!</p>`;
                    renderTransfers();
                    renderDashboard();
                    updateHeader();
                }
            } else {
                alert("Ungültiges Angebot.");
            }
        }

        function acceptCounterOffer(idx) {
            const eng = appState.engine;
            const offer = eng.transferOffers[idx];
            if (!offer) return;
            if (offer.status !== 'counter') { alert("Kein Gegenangebot."); return; }
            if (!offer.counterAmount) { alert("Kein Gegenangebot."); return; }
            const result = eng.acceptCounter(offer.id);
            document.getElementById('transfer-output').innerHTML =
                `<p style="color:${result.success ? 'var(--green)' : 'var(--red)'};">${result.msg}</p>`;
            renderTransfers();
            renderDashboard();
            updateHeader();

        function startScoutingUI() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const regions = ["Deutschland", "Europa", "Südamerika", "Afrika", "Nordamerika", "Asien", "Weltweit"];
            const region = prompt(`Region wählen:\n${regions.map((r,i) => `${i+1}. ${r}`).join('\n')}\nAuswahl (1-7):`);
            if (!region) return;
            const idx = parseInt(region) - 1;
            if (idx < 0 || idx >= regions.length) return;
            const pos = prompt("Position (IV, AV, ZM, FL, ST) oder 'alle':");
            if (!pos) return;
            const posFilter = pos.toLowerCase() === 'alle' ? 'alle' : pos;
            if (posFilter !== 'alle' && !POSITIONS.includes(posFilter)) { alert("Ungültige Position."); return; }
            const minAge = parseInt(prompt("Mindestalter:") || "16");
            const maxAge = parseInt(prompt("Höchstalter:") || "25");
            const minPot = parseInt(prompt("Mindestpotential:") || "65");
            const duration = parseInt(prompt("Dauer (Wochen, 2-8):") || "4");
            const cost = Math.round((duration * 0.15 + 0.3) * 10) / 10;
            if (cost > club.transferBudget) {
                alert(`❌ Nicht genug Budget. Benötigt: ${formatMoney(cost)}`);
                return;
            }
            const result = eng.startScouting(club, regions[idx], minAge, maxAge, posFilter, minPot, duration, cost);

                `<p style="color:${result.success ? 'var(--green)' : 'var(--red)'};">${result.msg}</p>`;

            updateHeader();

        function signScoutedPlayer(reportId) {
            const club = appState.playerClub;
            const eng = appState.engine;
            const report = eng.scoutingReports.find(r => r.id === reportId);
            if (!report || !report.results?.length) { alert("Keine Spieler verfügbar."); return; }
            const list = report.results.map((p, i) => `${i+1}. ${p.name} (${p.position}, ${p.overall} Stärke, ${formatMoney(p.marketValue)})`)
                .join('\n');
            const choice = parseInt(prompt(`Spieler verpflichten:\n${list}\nAuswahl (1-${report.results.length}):`));
            if (isNaN(choice) || choice < 1 || choice > report.results.length) return;
            const player = report.results[choice - 1];
            if (!player) return;
            const cost = player.marketValue * 1.1;
            if (cost > club.transferBudget) {
                alert(`❌ Nicht genug Budget. Benötigt: ${formatMoney(cost)}`);
                return;
            }
            const newPlayer = new Player(
                Date.now() + Math.random() * 10000,
                player.name,
                player.age,
                player.position,
                { ...player.attributes },
                player.marketValue,
                player.salary,
                3 + randInt(0, 2),
                player.potential,
                player.nationality
            );
            newPlayer.morale = 60 + randInt(0, 30);
            club.players.push(newPlayer);
            club.transferBudget -= cost;
            club.financialReserves -= cost * 0.5;
            const idx = report.results.indexOf(player);
            if (idx !== -1) report.results.splice(idx, 1);
            eng.addNews(`✅ ${newPlayer.name} wurde vom Scouting verpflichtet.`, "success");
            alert(`✅ ${newPlayer.name} verpflichtet!`);
            closeModal();
            renderScouting();
            renderDashboard();
            updateHeader();
        }

            if (!eng.news.length) {
                html += `<p>Keine Nachrichten.</p>`;
            } else {
                eng.news.slice(0, 100).forEach(n => {
                    const cls = n.type === 'urgent' ? 'urgent' : n.type === 'success' ? 'success' : n.type ===
                        'warning' ? 'warning' : '';
                    html += `<div class="news-item ${cls}">
                        <span class="news-date">[${n.date}]</span>
                        <span>${n.text}</span>
                    </div>`;
                });
            }
            html += `</div>`;
            tabContents.news.innerHTML = html;
        }

        function clearNews() {
            if (confirm("Alle Nachrichten löschen?")) {
                appState.engine.news = [];
                renderNews();
            }
        }

        // ---- MATCHDAY ----
        function renderMatchday() {
            const eng = appState.engine;
            const club = appState.playerClub;
            const isSeasonOver = eng.currentMatchday >= 34;

            let html = `
                <h3>📅 Spieltag ${eng.currentMatchday + (isSeasonOver ? ' (Saison beendet)' : '')}</h3>
                <div class="btn-group">
                    ${!isSeasonOver ? `<button onclick="simulateMatchdayUI()" class="success">▶ Nächsten Spieltag simulieren</button>` :
                    `<button onclick="startNextSeason()" class="gold">📅 Nächste Saison starten</button>`}
                    <button onclick="showFullTable()" class="secondary">📊 Tabelle</button>
                    <button onclick="showMatchReports()" class="secondary">📋 Spielberichte</button>
                </div>
                <div id="matchday-results" style="margin-top:12px;"></div>
                <div id="matchday-table"></div>
            `;

            const table = eng.getTable(club.league);
            let tableHtml = `<h4>&gt; Tabelle ${club.league}</h4><table><tr><th>Pl.</th><th>Verein</th><th>Pkt.</th><th>Form</th></tr>`;
            table.slice(0, 18).forEach(([name, pts], i) => {
                const pos = i + 1;
                let rowClass = '';
                if (club.league === "Bundesliga") {
                    if (pos <= 4) rowClass = 'row-champions';
                    else if (pos === 5 || pos === 6) rowClass = 'row-europa';
                    else if (pos === 16) rowClass = 'row-playoff';
                    else if (pos >= 17) rowClass = 'row-relegation';
                } else {
                    if (pos <= 2) rowClass = 'row-champions';
                    else if (pos === 3) rowClass = 'row-playoff';
                    else if (pos >= 17) rowClass = 'row-relegation';
                }
                if (name === club.name) rowClass += ' row-own';
                const crest = getCrest(name);
                const c = eng.getClub(name);
                const formStr = c?.getFormString() || '-----';
                const formDisplay = formStr.split('').map(ch => ch === 'W' ? '✅' : ch === 'L' ? '❌' : '➖').join('');
                tableHtml +=
                    `<tr class="${rowClass.trim()}"><td>${pos}</td><td>${crest} · ${name}</td><td>${pts}</td><td>${formDisplay}</td></tr>`;
            });
            tableHtml += `</table>`;
            tabContents.matchday.innerHTML = html + tableHtml;
        }

        function simulateMatchdayUI() {
            const eng = appState.engine;
            const club = appState.playerClub;
            if (eng.currentMatchday >= 34) {
                alert("Saison bereits beendet! Starte nächste Saison.");
                return;
            }

            const bundesClubs = eng.clubs.filter(c => c.league === "Bundesliga");
            const zweitClubs = eng.clubs.filter(c => c.league === "2. Bundesliga");

            const fixtures1 = buildFixtures(bundesClubs);
            const fixtures2 = buildFixtures(zweitClubs);

            const results1 = eng.simulateMatchday(fixtures1);
            const oldMatchday = eng.currentMatchday;
            const results2 = eng.simulateMatchday(fixtures2);
            eng.currentMatchday = oldMatchday + 1;

            let html = `<h4>Spieltag ${eng.currentMatchday} — Ergebnisse</h4>`;
            html += renderResultsBlock(eng, "Bundesliga", results1, club.name);
            html += renderResultsBlock(eng, "2. Bundesliga", results2, club.name);

            document.getElementById('matchday-results').innerHTML = html;
            updateHeader();
            renderMatchday();
            renderDashboard();
            eng.saveGame();
        }

        function buildFixtures(clubs) {
            const shuffled = [...clubs].sort(() => Math.random() - 0.5);
            const fixtures = [];
            for (let i = 0; i < shuffled.length; i += 2) {
                if (i + 1 < shuffled.length) {
                    fixtures.push([shuffled[i], shuffled[i + 1]]);
                } else {
                    fixtures.push([shuffled[i], null]);
                }
            }
            return fixtures;
        }

        function renderResultsBlock(eng, leagueName, results, playerClubName) {
            let html = `<h4>&gt; ${leagueName.toUpperCase()}</h4><div class="ticker">`;
            results.forEach(r => {
                if (!r.away) {
                    html += `<p>${r.home} ist spielfrei.</p>`;
                    return;
                }
                const isOwn = r.home === playerClubName || r.away === playerClubName;
                const isWin = r.homeGoals > r.awayGoals && r.home === playerClubName;
                const isLoss = r.homeGoals < r.awayGoals && r.home === playerClubName;
                const isDraw = r.homeGoals === r.awayGoals;
                let resultIcon = isWin ? '✅' : isLoss ? '❌' : isDraw ? '➖' : '';
                html += `<p${isOwn ? ' class="highlight"' : ''}>
                    ${resultIcon} <strong>${r.home} ${r.homeGoals} - ${r.awayGoals} ${r.away}</strong>
                    (xG: ${r.xG_home} - ${r.xG_away})
                </p>`;
                if (r.playerOfTheMatch) {
                    html += `<p class="tiny-text text-dim">⭐ Spieler des Spiels: ${r.playerOfTheMatch.name} (${r.playerOfTheMatch.club})</p>`;
                }
                r.events.forEach(e => html += `<p>&nbsp;&nbsp;${e}</p>`);
                html += `<hr>`;
            });
            html += `</div>`;
            return html;
        }

        function showFullTable() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const table = eng.getTable(club.league);
            let html =
                `<h4>📊 Tabelle ${club.league}</h4><table><tr><th>Pl.</th><th>Verein</th><th>Pkt.</th><th>Spiele</th><th>+/-</th></tr>`;
            table.slice(0, 18).forEach(([name, pts], i) => {
                const pos = i + 1;
                const c = eng.getClub(name);
                const gd = (c?.seasonGoalsScored || 0) - (c?.seasonGoalsConceded || 0);
                const rowClass = name === club.name ? 'row-own' : '';
                const crest = getCrest(name);
                html += `<tr class="${rowClass}"><td>${pos}</td><td>${crest} ${name}</td><td>${pts}</td>
                    <td>${eng.currentMatchday}</td><td>${gd}</td></tr>`;
            });
            html += `</table>`;
            showModal("📊 Tabelle", html);
        }

        function showMatchReports() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const matches = eng.matchReports.filter(r => r.home === club.name || r.away === club.name).slice(-8);
            if (!matches.length) {
                showModal("📋 Spielberichte", "<p>Keine Spielberichte verfügbar.</p>");
                return;
            }
            let html = `<h4>Letzte Spiele</h4>`;
            matches.forEach(r => {
                const isHome = r.home === club.name;
                const opponent = isHome ? r.away : r.home;
                const goals = isHome ? r.homeGoals : r.awayGoals;
                const oppGoals = isHome ? r.awayGoals : r.homeGoals;
                const result = goals > oppGoals ? 'Sieg' : goals < oppGoals ? 'Niederlage' : 'Unentschieden';
                html += `<div class="match-result ${goals > oppGoals ? 'win' : goals < oppGoals ? 'loss' : 'draw'}">
                    <strong>${r.home} ${r.homeGoals}:${r.awayGoals} ${r.away}</strong> – ${result}
                    ${r.playerOfTheMatch ? `<span class="tiny-text text-dim">⭐ ${r.playerOfTheMatch.name}</span>` : ''}
                </div>`;
            });
            showModal("📋 Spielberichte", html);
        }

        function startNextSeason() {
            const eng = appState.engine;
            if (!eng.seasonComplete) {
                if (!confirm("Saison noch nicht beendet. Trotzdem fortsetzen?")) return;
            }
            eng.endSeason();
            updateHeader();
            renderMatchday();
            renderDashboard();
            alert(`📅 Neue Saison ${eng.currentSeason} gestartet!`);
        }

        // ---- SAVE ----
        function renderSave() {
            let html = `
                <h3>💾 Speichern & Laden</h3>
                <div class="btn-group">
                    <button onclick="saveGameUI()" class="success">💾 Spiel speichern</button>
                    <button onclick="loadGameUI()" class="secondary">📂 Spiel laden</button>
                    <button onclick="deleteSaveUI()" class="danger">🗑 Save löschen</button>
                </div>
                <div id="save-output"></div>
                <div class="card" style="margin-top:12px;">
                    <p style="font-size:14px;color:var(--dim);">Automatisches Speichern nach jedem Spieltag und Saisonende.</p>
                    <p style="font-size:14px;color:var(--dim);">Daten werden lokal im Browser gespeichert (localStorage).</p>
                </div>
            `;
            tabContents.save.innerHTML = html;
        }

        function saveGameUI() {
            const eng = appState.engine;
            eng.saveGame();
            document.getElementById('save-output').innerHTML = '<p style="color:var(--green);">✅ Spiel gespeichert!</p>';
        }

        function loadGameUI() {
            const raw = localStorage.getItem('sportdirektorSave');
            if (!raw) {
                document.getElementById('save-output').innerHTML = '<p style="color:var(--red);">❌ Kein Save gefunden.</p>';
                return;
            }
            try {
                const data = JSON.parse(raw);
                const eng = new GameEngine([]);
                eng.loadGame(data);
                appState.clubs = eng.clubs;
                appState.engine = eng;
                const playerName = appState.playerClub?.name;
                if (playerName) {
                    const found = eng.clubs.find(c => c.name === playerName);
                    if (found) appState.playerClub = found;
                }
                if (!appState.playerClub && appState.clubs.length) {
                    appState.playerClub = appState.clubs[0];
                }
                updateHeader();
                document.getElementById('save-output').innerHTML = '<p style="color:var(--green);">✅ Spiel geladen!</p>';
                if (appState.playerClub) {
                    gameScreen.classList.remove('hidden');
                    selectScreen.classList.add('hidden');
                    startScreen.classList.add('hidden');
                    clubNameHeader.textContent = appState.playerClub.name + " (" + appState.playerClub.league + ")";
                    switchTab('dashboard');
                } else {
                    location.reload();
                }
            } catch (e) {
                document.getElementById('save-output').innerHTML = '<p style="color:var(--red);">❌ Fehler beim Laden.</p>';
                console.error(e);
            }
        }

        function deleteSaveUI() {
            if (confirm("Wirklich alle Spielstände löschen?")) {
                localStorage.removeItem('sportdirektorSave');
                document.getElementById('save-output').innerHTML = '<p style="color:var(--gold);">🗑 Save gelöscht.</p>';
            }
        }

        // ================================================================
        //  EVENT LISTENERS & INIT
        // ================================================================

        document.querySelectorAll('.menu button').forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        document.querySelectorAll('#league-tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedLeagueTab = btn.dataset.league;
                document.querySelectorAll('#league-tabs button').forEach(b => b.classList.toggle('active', b ===
                btn));
                renderClubList();
            });
        });

        document.getElementById('btn-new-career').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            selectScreen.classList.remove('hidden');
            const clubs = generateRealisticClubs();
            appState.clubs = clubs;
            appState.engine = new GameEngine(clubs);
            renderClubList();
        });

        document.getElementById('btn-load-career').addEventListener('click', () => {
            const raw = localStorage.getItem('sportdirektorSave');
            if (!raw) { alert("❌ Kein Save gefunden."); return; }
            try {
                const data = JSON.parse(raw);
                const eng = new GameEngine([]);
                eng.loadGame(data);
                appState.clubs = eng.clubs;
                appState.engine = eng;
                startScreen.classList.add('hidden');
                selectScreen.classList.remove('hidden');
                renderClubList();
                if (appState.playerClub) {
                    const found = eng.clubs.find(c => c.name === appState.playerClub.name);
                    if (found) {
                        appState.playerClub = found;
                        startGame();
                        return;
                    }
                }
            } catch (e) {
                alert("❌ Fehler beim Laden.");
                console.error(e);
            }
        });

        document.getElementById('back-to-start').addEventListener('click', () => {
            selectScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        // ---- Init ----
        startScreen.classList.remove('hidden');
        selectScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');

        // Generate initial data
        const initClubs = generateRealisticClubs();
        appState.clubs = initClubs;
        appState.engine = new GameEngine(initClubs);

        // ---- Expose functions ----
        window.showSquadAnalysis = showSquadAnalysis;
        window.showPlayerDetails = showPlayerDetails;
        window.extendContractPlayer = extendContractPlayer;
        window.changeRole = changeRole;
        window.showContractNegotiations = showContractNegotiations;
        window.acceptContractDemand = acceptContractDemand;
        window.rejectContractDemand = rejectContractDemand;
        window.sellPlayerUI = sellPlayerUI;
        window.extendContractUI = extendContractUI;
        window.scoutPlayersUI = scoutPlayersUI;
        window.makeOfferUI = makeOfferUI;
        window.viewOffersUI = viewOffersUI;
        window.acceptIncomingOffer = acceptIncomingOffer;
        window.acceptCounterOffer = acceptCounterOffer;
        window.rejectOffer = rejectOffer;
        window.viewTransferHistoryUI = viewTransferHistoryUI;
        window.startScoutingUI = startScoutingUI;
        window.viewScoutingResultsUI = viewScoutingResultsUI;
        window.signScoutedPlayer = signScoutedPlayer;
        window.showScoutedPlayers = showScoutedPlayers;
        window.evaluateCoachUI = evaluateCoachUI;
        window.fireCoachUI = fireCoachUI;
        window.hireCoachUI = hireCoachUI;
        window.extendCoachContractUI = extendCoachContractUI;
        window.showClubHistory = showClubHistory;
        window.upgradeAcademy = upgradeAcademy;
        window.clearNews = clearNews;
        window.simulateMatchdayUI = simulateMatchdayUI;
        window.showFullTable = showFullTable;
        window.showMatchReports = showMatchReports;
        window.startNextSeason = startNextSeason;
        window.saveGameUI = saveGameUI;
        window.loadGameUI = loadGameUI;
        window.deleteSaveUI = deleteSaveUI;
        window.closeModal = closeModal;
        window.showModal = showModal;
        window.renderTransfers = renderTransfers;
        window.renderSquad = renderSquad;

        window.appState = appState;

        console.log("⚽ Sportdirektor-Simulator 2026/27 – EA FC Style Interface");
        console.log(`📊 ${appState.clubs.length} Vereine, ${appState.clubs.reduce((a,c) => a + c.players.length, 0)} Spieler generiert.`);
    </script>
</body>
</html>
