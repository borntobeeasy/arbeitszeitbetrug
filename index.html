<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Sportdirektor-Simulator // Bundesliga &amp; 2. Bundesliga 2026/27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           RETRO ARCADE / TELETEXT THEME
           Palette: DFL-Rot #e3000f · Bundesliga-Gold #ffd200 · Terminal-Grün #39ff14
           Tiefschwarz-Blau #05070f / #0c1024 · Panel #10142a
           Pixel-Font "Press Start 2P" fuer Ueberschriften/UI, "VT323" fuer Zahlen/Ticker
        =================================================================== */
        :root {
            --bg: #05070f;
            --panel: #0c1024;
            --panel-2: #10142a;
            --line: #2a2f52;
            --red: #e3000f;
            --gold: #ffd200;
            --blue: #1e5fff;
            --green: #39ff14;
            --text: #e8ecff;
            --dim: #8890c0;
            --pixel: 'Press Start 2P', monospace;
            --mono: 'VT323', 'JetBrains Mono', monospace;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scrollbar-color: var(--red) var(--bg);
        }
        body {
            font-family: var(--mono);
            font-size: 20px;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            line-height: 1.35;
            background-image: radial-gradient(ellipse at top, rgba(30, 95, 255, 0.12), transparent 60%),
                radial-gradient(ellipse at bottom, rgba(227, 0, 15, 0.10), transparent 60%);
        }
        /* CRT scanline + flicker overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.035) 0px,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 2px,
                    transparent 3px);
            mix-blend-mode: overlay;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 998;
            box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.75);
            animation: flicker 6s infinite;
        }
        @keyframes flicker {
            0%,
            97%,
            100% {
                opacity: 1;
            }
            98% {
                opacity: 0.94;
            }
            99% {
                opacity: 0.98;
            }
        }
        h1,
        h2,
        h3 {
            font-family: var(--pixel);
            color: var(--gold);
            text-shadow: 2px 2px 0 var(--red), 4px 4px 0 rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            line-height: 1.6;
        }
        h1 {
            font-size: 22px;
            padding: 14px 0;
            text-align: center;
        }
        h2 {
            font-size: 15px;
            margin-bottom: 10px;
        }
        h3 {
            font-size: 12px;
            margin-bottom: 10px;
            color: var(--blue);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
        }
        h4 {
            font-family: var(--pixel);
            font-size: 10px;
            color: var(--green);
            margin: 10px 0;
        }
        p {
            font-size: 20px;
        }

        button {
            font-family: var(--pixel);
            font-size: 10px;
            background: var(--red);
            border: none;
            outline: 3px solid #7a0009;
            outline-offset: -3px;
            color: #fff;
            padding: 10px 14px;
            border-radius: 0;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            text-transform: uppercase;
        }
        button:hover {
            background: #ff2436;
        }
        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000;
        }
        button:focus-visible {
            outline: 3px dashed var(--gold);
            outline-offset: 2px;
        }
        button.secondary {
            background: var(--blue);
            outline-color: #0b2a80;
        }
        button.success {
            background: #158a3d;
            outline-color: #0a4a20;
        }
        button.danger {
            background: var(--red);
            outline-color: #7a0009;
        }
        button.gold {
            background: var(--gold);
            color: #000;
            outline-color: #a08600;
        }
        button.small {
            font-size: 8px;
            padding: 5px 10px;
        }

        input,
        select,
        textarea {
            font-family: var(--mono);
            font-size: 20px;
            padding: 6px 12px;
            border-radius: 0;
            border: 2px solid var(--line);
            margin: 4px 0;
            background: #060814;
            color: var(--green);
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--gold);
            border-color: var(--gold);
        }

        .container {
            background: var(--panel);
            padding: 20px;
            border: 2px solid var(--line);
            border-image: linear-gradient(135deg, var(--red), var(--gold), var(--blue)) 1;
            margin-top: 14px;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
        }
        .card {
            background: var(--panel-2);
            padding: 15px;
            border: 2px solid var(--line);
            flex: 1 1 200px;
            position: relative;
        }
        .card h3,
        .card h4 {
            margin-top: 0;
        }
        .card.wide {
            flex: 1 1 100%;
        }
        .card .value {
            font-size: 28px;
            color: var(--gold);
            font-family: var(--pixel);
        }
        .card .label {
            font-size: 14px;
            color: var(--dim);
            font-family: var(--pixel);
        }

        .menu {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .menu button {
            background: var(--panel-2);
            outline-color: var(--line);
            color: var(--dim);
            font-size: 9px;
            padding: 8px 12px;
        }
        .menu button.active {
            background: var(--red);
            color: #fff;
            outline-color: #7a0009;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 20px;
        }
        th,
        td {
            padding: 5px 10px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        th {
            background: var(--panel-2);
            color: var(--gold);
            font-family: var(--pixel);
            font-size: 9px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--red);
        }
        tr.row-champions td:first-child {
            box-shadow: inset 4px 0 0 var(--blue);
        }
        tr.row-europa td:first-child {
            box-shadow: inset 4px 0 0 var(--green);
        }
        tr.row-playoff td:first-child {
            box-shadow: inset 4px 0 0 var(--gold);
        }
        tr.row-relegation td:first-child {
            box-shadow: inset 4px 0 0 var(--red);
        }
        tr.row-own {
            background: rgba(255, 210, 0, 0.12);
        }
        tr.row-own td:first-child {
            font-weight: bold;
            color: var(--gold);
        }
        tr.clickable {
            cursor: pointer;
        }
        tr.clickable:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .highlight {
            color: var(--gold);
            font-weight: bold;
        }
        .ticker {
            background: #010102;
            border: 2px solid var(--line);
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 20px;
            color: var(--green);
        }
        .ticker p {
            margin: 4px 0;
        }
        .ticker hr {
            border: none;
            border-top: 1px dashed var(--line);
            margin: 8px 0;
        }
        .hidden {
            display: none !important;
        }
        .status {
            font-family: var(--pixel);
            font-size: 11px;
            padding: 8px 12px;
            background: var(--panel-2);
            border: 2px solid var(--red);
            color: var(--gold);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .btn-group button {
            background: var(--blue);
            outline-color: #0b2a80;
        }
        .btn-group button.danger {
            background: var(--red);
            outline-color: #7a0009;
        }
        .btn-group button.success {
            background: #158a3d;
            outline-color: #0a4a20;
        }
        .btn-group button.gold {
            background: var(--gold);
            color: #000;
            outline-color: #a08600;
        }

        .progress-bar {
            display: flex;
            height: 18px;
            background: #0a0c1a;
            border: 1px solid var(--line);
            margin: 4px 0;
            width: 100%;
            max-width: 200px;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--gold);
            transition: width 0.3s;
        }
        .progress-bar .fill.green {
            background: var(--green);
        }
        .progress-bar .fill.red {
            background: var(--red);
        }
        .progress-bar .fill.blue {
            background: var(--blue);
        }

        .crest {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            font-family: var(--pixel);
            font-size: 11px;
            background: var(--panel-2);
            border: 2px solid var(--gold);
            box-shadow: 3px 3px 0 #000;
            color: var(--gold);
            flex-shrink: 0;
        }
        .crest.league-2 {
            border-color: var(--blue);
            color: var(--blue);
        }
        .club-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .club-card .club-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .club-card .club-head h3 {
            margin: 0;
            font-size: 11px;
        }
        .league-tag {
            display: inline-block;
            font-family: var(--pixel);
            font-size: 8px;
            padding: 3px 6px;
            margin-bottom: 6px;
            background: var(--red);
            color: #fff;
        }
        .league-tag.tag-2 {
            background: var(--blue);
        }

        .arcade-title {
            text-align: center;
            margin-bottom: 4px;
        }
        .blink {
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        .subtitle {
            text-align: center;
            font-family: var(--pixel);
            font-size: 9px;
            color: var(--dim);
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .league-tabs {
            display: flex;
            gap: 8px;
            margin: 10px 0 16px;
        }
        .league-tabs button {
            background: var(--panel-2);
            color: var(--dim);
            outline-color: var(--line);
        }
        .league-tabs button.active {
            background: var(--gold);
            color: #000;
            outline-color: #a08600;
        }

        ::selection {
            background: var(--gold);
            color: #000;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--red);
            border: 2px solid var(--bg);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: var(--panel);
            border: 3px solid var(--gold);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.7);
        }
        .modal-box h2 {
            margin-top: 0;
        }
        .modal-box .close-btn {
            float: right;
            background: var(--red);
            outline-color: #7a0009;
            font-size: 14px;
            padding: 5px 14px;
        }

        .news-item {
            padding: 10px;
            border-left: 4px solid var(--blue);
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
        }
        .news-item .news-date {
            color: var(--dim);
            font-size: 14px;
            font-family: var(--pixel);
        }
        .news-item .news-title {
            color: var(--gold);
            font-weight: bold;
        }
        .news-item.urgent {
            border-left-color: var(--red);
            background: rgba(227, 0, 15, 0.08);
        }
        .news-item.success {
            border-left-color: var(--green);
            background: rgba(57, 255, 20, 0.05);
        }

        .badge {
            display: inline-block;
            font-family: var(--pixel);
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 0;
            margin: 0 4px;
        }
        .badge.gold {
            background: var(--gold);
            color: #000;
        }
        .badge.red {
            background: var(--red);
            color: #fff;
        }
        .badge.blue {
            background: var(--blue);
            color: #fff;
        }
        .badge.green {
            background: var(--green);
            color: #000;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .player-row .p-info {
            flex: 1;
            min-width: 120px;
        }
        .player-row .p-stats {
            display: flex;
            gap: 12px;
            font-size: 16px;
            color: var(--dim);
        }

        @media (max-width: 700px) {
            body {
                font-size: 16px;
                padding: 10px;
            }
            h1 {
                font-size: 14px;
            }
            h2 {
                font-size: 11px;
            }
            button {
                font-size: 8px;
                padding: 6px 10px;
            }
            .card {
                flex: 1 1 100%;
            }
            .menu button {
                font-size: 7px;
                padding: 5px 8px;
            }
            table {
                font-size: 16px;
            }
            th,
            td {
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>

    <h1 class="arcade-title">⚽ SPORTDIREKTOR SIMULATOR</h1>
    <p class="subtitle">1. BUNDESLIGA <span class="blink">▮</span> 2. BUNDESLIGA — SAISON 2026/27</p>

    <div id="app">
        <!-- ====== START SCREEN ====== -->
        <div id="start-screen" class="container">
            <div style="text-align:center;padding:30px 0;">
                <h1 style="font-size:32px;">⚽ SPORTDIREKTOR</h1>
                <p style="font-size:28px;color:var(--gold);">BUNDESLIGA MANAGEMENT</p>
                <p style="font-size:18px;color:var(--dim);margin:20px 0 40px;">SIMULATOR 2026/27</p>
                <div style="display:flex;flex-direction:column;gap:16px;align-items:center;max-width:300px;margin:0 auto;">
                    <button id="btn-new-career" style="width:100%;font-size:14px;padding:16px;">🆕 NEUE KARRIERE</button>
                    <button id="btn-load-career" style="width:100%;font-size:14px;padding:16px;background:var(--blue);outline-color:#0b2a80;">📂 KARRIERE LADEN</button>
                </div>
                <p style="margin-top:30px;color:var(--dim);font-size:14px;">Alle Daten werden lokal im Browser gespeichert.</p>
            </div>
        </div>

        <!-- ====== SELECT SCREEN ====== -->
        <div id="select-screen" class="container hidden">
            <h2>&gt; Wähle deinen Verein_</h2>
            <div id="league-tabs" class="league-tabs">
                <button data-league="Bundesliga" class="active">1. Bundesliga</button>
                <button data-league="2. Bundesliga">2. Bundesliga</button>
            </div>
            <div id="club-list" class="flex"></div>
            <button id="back-to-start" class="secondary" style="margin-top:14px;">⬅ Zurück</button>
        </div>

        <!-- ====== MAIN GAME UI ====== -->
        <div id="game-screen" class="hidden">
            <!-- Header -->
            <div class="flex" style="justify-content:space-between;align-items:center;">
                <h2 id="club-name-header"></h2>
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                    <span id="season-display" class="status">Saison 2026/27</span>
                    <span id="matchday-display" class="status">Spieltag 0</span>
                    <span id="budget-display" class="status" style="border-color:var(--gold);">€0.0M</span>
                </div>
            </div>

            <!-- Menu -->
            <div class="menu" id="main-menu">
                <button data-tab="dashboard" class="active">Dashboard</button>
                <button data-tab="squad">Kader</button>
                <button data-tab="transfers">Transfers</button>
                <button data-tab="scouting">Scouting</button>
                <button data-tab="coach">Trainer</button>
                <button data-tab="board">Vorstand</button>
                <button data-tab="news">News</button>
                <button data-tab="matchday">Spieltag</button>
                <button data-tab="save">Speichern</button>
            </div>

            <!-- Tab Contents -->
            <div id="tab-dashboard" class="container tab-content"></div>
            <div id="tab-squad" class="container tab-content hidden"></div>
            <div id="tab-transfers" class="container tab-content hidden"></div>
            <div id="tab-scouting" class="container tab-content hidden"></div>
            <div id="tab-coach" class="container tab-content hidden"></div>
            <div id="tab-board" class="container tab-content hidden"></div>
            <div id="tab-news" class="container tab-content hidden"></div>
            <div id="tab-matchday" class="container tab-content hidden"></div>
            <div id="tab-save" class="container tab-content hidden"></div>
        </div>
    </div>

    <!-- ====== MODAL CONTAINER ====== -->
    <div id="modal-container"></div>

    <script>
        // ================================================================
        //  DATA MODELS
        // ================================================================

        const POSITIONS = ["IV", "AV", "ZM", "FL", "ST"];
        const ATTRIBUTES = ["geschwindigkeit", "passspiel", "schuss", "defensive", "kopfball"];
        const POSITION_WEIGHTS = {
            IV: { defensive: 0.6, kopfball: 0.2, passspiel: 0.1, geschwindigkeit: 0.05, schuss: 0.05 },
            AV: { geschwindigkeit: 0.3, defensive: 0.3, passspiel: 0.2, schuss: 0.1, kopfball: 0.1 },
            ZM: { passspiel: 0.3, schuss: 0.2, geschwindigkeit: 0.15, defensive: 0.25, kopfball: 0.1 },
            FL: { geschwindigkeit: 0.3, schuss: 0.25, passspiel: 0.2, defensive: 0.1, kopfball: 0.15 },
            ST: { schuss: 0.35, kopfball: 0.25, geschwindigkeit: 0.2, passspiel: 0.1, defensive: 0.1 }
        };

        const FIRST_NAMES = ["Max", "Lukas", "Julian", "Marco", "Mats", "Thomas", "Manuel", "Joshua", "Serge", "Leon",
            "Kai", "Timo", "Niclas", "Florian", "Robin", "Bernd", "Kevin", "Matthias", "Christian", "Jan",
            "Felix", "Luis", "Paul", "Finn", "Luca", "Elias", "Marlon", "Emil", "Anton", "Oskar",
            "David", "Noah", "Matteo", "Johannes", "Philipp", "Moritz", "Benedikt", "Jakob", "Alexander", "Niklas"
        ];
        const LAST_NAMES = ["Müller", "Schmidt", "Schneider", "Fischer", "Weber", "Meyer", "Wagner", "Becker", "Schulz",
            "Hoffmann",
            "Koch", "Richter", "Klein", "Wolf", "Schröder", "Neumann", "Zimmermann", "Braun", "Krüger", "Frank",
            "Bauer", "König", "Huber", "Keller", "Baum", "Schulze", "Lange", "Werner", "Hartmann", "Krause",
            "Fuchs", "Peters", "Möller", "Weiß", "Jung", "Hahn", "Schubert", "Vogel", "Friedrich", "Klein"
        ];

        const NATIONALITIES = ["Deutschland", "Österreich", "Schweiz", "Polen", "Frankreich", "Italien", "Spanien",
            "England", "Niederlande", "Belgien", "Dänemark", "Schweden", "Norwegen", "Brasilien", "Argentinien",
            "Uruguay", "Kroatien", "Serbien", "Tschechien", "Slowakei", "Ungarn", "Griechenland", "Türkei", "USA",
            "Kanada", "Australien", "Japan", "Korea", "China", "Kamerun", "Ghana", "Nigeria", "Senegal", "Elfenbeinküste"
        ];

        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function randomName() {
            return randomItem(FIRST_NAMES) + " " + randomItem(LAST_NAMES);
        }

        function randomNationality() { return randomItem(NATIONALITIES); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function rand(min, max) { return min + Math.random() * (max - min); }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        // ---- Player ----
        class Player {
            constructor(id, name, age, position, attributes, marketValue, salary, contractYears, potential, nationality) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.position = position;
                this.attributes = attributes;
                this.marketValue = marketValue;
                this.salary = salary;
                this.contractYears = contractYears;
                this.potential = potential;
                this.nationality = nationality || randomNationality();
                this.satisfaction = 60 + randInt(0, 35);
                this.gamesPlayed = 0;
                this.goals = 0;
                this.assists = 0;
                this.injuryWeeks = 0;
                this.formPenalty = 0;
                this.morale = 60 + randInt(0, 30);
                this.reputation = 40 + randInt(0, 40);
                this.role = "Stammspieler";
                this.yellowCards = 0;
                this.redCards = 0;
                this.weeksDeveloped = 0;
            }

            get overall() {
                const vals = Object.values(this.attributes);
                let ov = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                ov = clamp(ov - this.formPenalty, 1, 99);
                return ov;
            }

            get form() {
                let f = 70 + randInt(-5, 5);
                f = clamp(f - this.formPenalty * 1.5, 0, 100);
                return Math.round(f);
            }

            toJSON() {
                return { ...this, attributes: { ...this.attributes } };
            }

            static fromJSON(data) {
                const p = new Player(data.id, data.name, data.age, data.position, data.attributes,

        function generatePlayer(id, age = null, position = null) {
            if (age === null) age = 18 + randInt(0, 18);
            if (position === null) position = randomItem(POSITIONS);
            const attrs = {};
            ATTRIBUTES.forEach(attr => {
                let base = 45 + randInt(0, 40);
                const weights = POSITION_WEIGHTS[position];
                if (weights && weights[attr]) {
                    base += Math.floor(weights[attr] * 25);
                }
                attrs[attr] = clamp(base, 1, 99);
            });
            const overall = Math.round(Object.values(attrs).reduce((a, b) => a + b, 0) / ATTRIBUTES.length);
            const marketValue = Math.round((0.3 + (overall / 100) * 12 + rand(-0.5, 0.5)) * 10) / 10;
            const salary = Math.round((0.15 + (overall / 100) * 5 + rand(-0.3, 0.3)) * 10) / 10;
            const contract = 1 + randInt(0, 4);
            const potential = clamp(overall + 5 + randInt(0, 25), 1, 99);
            const nat = randomNationality();
            return new Player(id, randomName(), age, position, attrs, Math.max(0.1, marketValue),
                Math.max(0.05, salary), contract, potential, nat);
        }

        function buildLeagueClubs(clubDefs, league, startId, financeScale) {
            const clubs = [];
            let playerId = startId;
            clubDefs.forEach((def, idx) => {
                const factor = 1.0 - (idx / (clubDefs.length * 1.3));
                const f = clamp(factor, 0.2, 1.0);
                const financial = Math.round((financeScale.reserveBase + f * financeScale.reserveSpan) * 10) / 10;
                const transfer = Math.round((financeScale.transferBase + f * financeScale.transferSpan) * 10) / 10;
                const salary = Math.round((financeScale.salaryBase + f * financeScale.salarySpan) * 10) / 10;
                const goals = {
                    leaguePlace: 1 + randInt(0, 17),
                    cupRound: ["round1", "round2", "quarter", "semi", "final"][randInt(0, 4)]
                };
                const stadium = { name: def.stadium, capacity: def.capacity };
                const club = new Club(def.name, league, financial, transfer, salary, goals,
                    1 + randInt(0, 5), stadium, def.reputation || 50);
                const numPlayers = 22 + randInt(0, 8);
                for (let i = 0; i < numPlayers; i++) {
                    let age = 18 + randInt(0, 18);
                    if (i < 4) age = 17 + randInt(0, 4);
                    else if (i > 18) age = 30 + randInt(0, 6);
                    const p = generatePlayer(playerId++, age);
                    const valueMult = (0.6 + 0.5 * f) * financeScale.valueMultiplier;
                    p.marketValue = Math.round(p.marketValue * valueMult * 10) / 10;
                    p.salary = Math.round(p.salary * (0.7 + 0.5 * f) * 10) / 10;
                    club.players.push(p);
                }
                // assign a coach
                const coach = generateCoach(1000 + idx + startId);
                coach.wageDemand = Math.round((0.5 + f * 2.5) * 10) / 10;
                club.coach = coach;
                clubs.push(club);
            });
            return clubs;
        }

            });
            return [...bundesliga, ...zweitliga];
        }

        class GameEngine {
            constructor(clubs) {
                this.clubs = clubs;
                this.currentMatchday = 0;
                this.currentSeason = 2026;
                this.leagueTable = {};
                this.leagueTable2 = {};
                this.clubs.forEach(c => {
                    if (c.league === "Bundesliga") this.leagueTable[c.name] = 0;
                    else this.leagueTable2[c.name] = 0;
                });
                this.transferOffers = [];
                this.scoutingReports = [];
                this.news = [];
                this.newsId = 0;
                this.seasonComplete = false;
                this.transferWindowOpen = true;
                this.matchdayResults = [];
                this.clubHistory = {};
                this.running = true;
                this.youthIntakeTimer = 0;
                this.eventTimer = 0;
                this.seasonGoals = {};
                this.clubs.forEach(c => {
                    this.seasonGoals[c.name] = { ...c.seasonGoals };
                });
            }

            getTable(leagueName) {
                const table = leagueName === "Bundesliga" ? this.leagueTable : this.leagueTable2;
                const namesInLeague = new Set(this.clubs.filter(c => c.league === leagueName).map(c => c.name));
                return Object.entries(table)
                    .filter(([name]) => namesInLeague.has(name))
                    .sort((a, b) => b[1] - a[1]);
            }

            clubLeague(clubName) {
                const c = this.clubs.find(c => c.name === clubName);
                return c ? c.league : "Bundesliga";
            }

            getClub(name) { return this.clubs.find(c => c.name === name); }

            // ---- Squad Analysis ----
            analyzeSquad(club) {
                const counts = {},
                    avg = {};
                club.players.forEach(p => {
                    counts[p.position] = (counts[p.position] || 0) + 1;
                    if (!avg[p.position]) avg[p.position] = [];
                    avg[p.position].push(p.overall);
                });
                for (let pos in avg) {
                    avg[pos] = Math.round(avg[pos].reduce((a, b) => a + b, 0) / avg[pos].length);
                }
                return { counts, avgOverall: avg };
            }

            squadDepthReport(club) {
                const analysis = this.analyzeSquad(club);
                let report = `📊 Kaderanalyse ${club.name}:\nPosition | Anzahl | Ø Stärke\n`;
                for (let pos in analysis.counts) {
                    report += `${pos.padEnd(8)} | ${analysis.counts[pos].toString().padEnd(5)} | ${analysis.avgOverall[pos]}\n`;
                }
                const weak = [];
                for (let pos in analysis.counts) {
                    if (analysis.counts[pos] < 2) weak.push(pos + " (zu dünn)");
                    else if (analysis.avgOverall[pos] < 65) weak.push(pos + " (schwach)");
                }
                report += weak.length ? `⚠ Schwachstellen: ${weak.join(', ')}` : "✅ Kader ausgewogen.";
                return report;
            }

            // ---- Transfers ----
            scoutPlayers(club, position, budget) {
                const candidates = [];
                this.clubs.forEach(other => {
                    if (other === club) return;
                    other.players.forEach(p => {
                        if (p.position === position && p.marketValue <= budget * 1.2) {
                            candidates.push({ player: p, club: other });
                        }
                    });
                });
                candidates.sort((a, b) => b.player.overall - a.player.overall);
                return candidates.slice(0, 12);
            }

            makeOffer(fromClub, toClub, player, amount, addons) {
                if (amount > fromClub.transferBudget) return { success: false, msg: "Nicht genug Transferbudget." };
                const ratio = amount / player.marketValue;
                let decision;
                let counterAmount = null;
                if (ratio >= 1.3) decision = "accept";
                else if (ratio < 0.7) decision = "reject";
                else {
                    decision = "counter";
                    counterAmount = Math.round((amount * (1.05 + rand(0, 0.25)) + 0.5) * 10) / 10;
                }
                const offer = {
                    id: Date.now() + Math.random(),
                    player: player,
                    playerId: player.id,
                    fromClub: fromClub,
                    fromClubName: fromClub.name,
                    toClub: toClub,
                    toClubName: toClub.name,
                    amount: amount,
                    status: decision,
                    counterAmount: counterAmount,
                    addons: addons || {},
                    date: this.currentMatchday
                };
                if (decision === "accept") {
                    this.executeTransfer(offer);
                    return { success: true, msg: `${player.name} wechselt für ${amount.toFixed(1)} Mio. zu ${fromClub.name}.`,
                        offer };
                } else if (decision === "reject") {
                    return { success: false, msg: `${toClub.name} lehnt ab.` };
                } else {
                    this.transferOffers.push(offer);
                    return { success: false, msg: `${toClub.name} fordert ${counterAmount.toFixed(1)} Mio. (Gegenangebot).`,
                        offer };
                }
            }

            executeTransfer(offer) {
                const { player, fromClub, toClub, amount } = offer;
                const idx = fromClub.players.indexOf(player);
                if (idx !== -1) fromClub.players.splice(idx, 1);
                toClub.players.push(player);
                toClub.transferBudget -= amount;
                toClub.financialReserves -= amount;
                fromClub.transferBudget += amount;
                fromClub.financialReserves += amount;
                player.contractYears = 3 + randInt(0, 2);
                const oIdx = this.transferOffers.indexOf(offer);
                if (oIdx !== -1) this.transferOffers.splice(oIdx, 1);
                this.addNews(`Transfer abgeschlossen: ${player.name} wechselt von ${fromClub.name} zu ${toClub.name} für ${amount.toFixed(1)} Mio. €`,
                    "success");
                this.addNews(`${toClub.name} verpflichtet ${player.name} für ${amount.toFixed(1)} Mio. €`, "success");
            }

            acceptCounter(offerId) {
                const offer = this.transferOffers.find(o => o.id === offerId);
                if (!offer) return { success: false, msg: "Angebot nicht gefunden." };
                if (offer.status !== "counter") return { success: false, msg: "Kein Gegenangebot." };
                if (!offer.counterAmount) return { success: false, msg: "Kein Gegenangebot." };
                if (offer.counterAmount > offer.fromClub.transferBudget) {
                    return { success: false, msg: "Nicht genug Budget für Gegenangebot." };
                }
                // Execute with counter amount
                const oldAmount = offer.amount;
                offer.amount = offer.counterAmount;
                offer.status = "accept";
                this.executeTransfer(offer);
                return { success: true, msg: `Gegenangebot angenommen! ${offer.player.name} wechselt für ${offer.amount.toFixed(1)} Mio.` };
            }

            rejectOffer(offerId) {
                const idx = this.transferOffers.findIndex(o => o.id === offerId);
                if (idx === -1) return { success: false, msg: "Angebot nicht gefunden." };
                this.transferOffers.splice(idx, 1);
                return { success: true, msg: "Angebot abgelehnt." };
            }

            // ---- Coach ----
            evaluateCoach(club) {
                if (!club.coach) return "❌ Kein Trainer.";
                const c = club.coach;
                const perf = club.fanSatisfaction;
                const score = (perf * 0.4 + c.reputation * 0.4 + c.tacticalQuality * 0.2);
                let rating = score > 75 ? "Hervorragend" : score > 55 ? "Gut" : score > 40 ? "Durchschnittlich" :
                "Verbesserungswürdig";
                return `🧑‍🏫 ${c.name} (${c.age} Jahre)\nReputation: ${c.reputation} | Taktik: ${c.tacticalQuality}\nJugendförderung: ${c.youthDevelopment} | Autorität: ${c.authority}\nMedien: ${c.media}\nPhilosophie: ${c.philosophy} | Formation: ${c.preferredFormation}\nBewertung: ${rating}`;
            }

            hireCoach(club, coach) {
                if (club.coach) return { success: false, msg: `${club.name} hat bereits einen Trainer.` };
                club.coach = coach;
                this.addNews(`${coach.name} wird neuer Trainer von ${club.name}.`, "success");
                return { success: true, msg: `${coach.name} als neuer Trainer verpflichtet.` };
            }

            fireCoach(club) {
                if (!club.coach) return { success: false, msg: "Kein Trainer." };
                const fired = club.coach;
                club.coach = null;
                this.addNews(`${fired.name} wurde als Trainer entlassen.`, "urgent");
                return { success: true, msg: `${fired.name} entlassen.` };
            }

            // ---- Scouting ----
            startScouting(club, region, ageMin, ageMax, position, minPotential, durationWeeks, budget) {
                if (budget > club.transferBudget) return { success: false, msg: "Nicht genug Budget." };
                club.transferBudget -= budget;
                const report = {
                    id: Date.now() + Math.random(),
                    club: club.name,
                    region,
                    ageMin,
                    ageMax,
                    position,
                    minPotential,
                    durationWeeks,
                    budget,
                    startDay: this.currentMatchday,
                    completed: false,
                    results: [],
                    progress: 0
                };
                this.scoutingReports.push(report);
                this.addNews(`Scoutingauftrag in ${region} gestartet (${position}, Potential ${minPotential}+). Dauer: ${durationWeeks} Wochen.`,
                    "success");
                return { success: true, msg: "Scoutingauftrag gestartet.", report };
            }

            advanceScouting(weeks) {
                const reports = this.scoutingReports.filter(r => !r.completed);
                reports.forEach(r => {
                    r.progress += weeks;
                    if (r.progress >= r.durationWeeks) {
                        r.completed = true;
                        // Generate results
                        const numResults = 2 + randInt(0, 5);
                        for (let i = 0; i < numResults; i++) {
                            const age = r.ageMin + randInt(0, r.ageMax - r.ageMin);
                            const p = generatePlayer(9999 + Math.random() * 10000, age, r.position);
                            const potBonus = randInt(0, 15);
                            p.potential = clamp(p.potential + potBonus, 1, 99);
                            if (p.overall < 40) p.overall = 40 + randInt(0, 20);
                            // scale market value down for scouted players (they're not signed yet)
                            p.marketValue = Math.round(p.marketValue * (0.4 + rand(0, 0.4)) * 10) / 10;
                            p.nationality = r.region === "Deutschland" ? "Deutschland" :
                                r.region === "Südamerika" ? randomItem(["Brasilien", "Argentinien", "Uruguay", "Chile",
                                    "Kolumbien"
                                ]) :
                                r.region === "Afrika" ? randomItem(["Kamerun", "Ghana", "Nigeria", "Senegal",
                                    "Elfenbeinküste"
                                ]) :
                                r.region === "Asien" ? randomItem(["Japan", "Korea", "China", "Australien"]) :
                                r.region === "Nordamerika" ? randomItem(["USA", "Kanada", "Mexiko"]) :
                                randomNationality();
                            r.results.push(p);
                        }
                        this.addNews(`Scoutingauftrag in ${r.region} abgeschlossen! ${r.results.length} Spieler gefunden.`,
                            "success");
                    }
                });
            }

            getScoutingResults(clubName) {
                return this.scoutingReports.filter(r => r.club === clubName && r.completed);
            }

            // ---- Board ----
            evaluateBoard(club) {
                const goals = this.seasonGoals[club.name] || club.seasonGoals;
                const table = this.getTable(club.league);
                const pos = table.findIndex(([name]) => name === club.name) + 1;
                let achieved = 0;
                let total = 0;
                if (goals.leaguePlace) {
                    total++;
                    if (pos <= goals.leaguePlace) achieved++;
                }
                if (goals.cupRound) {
                    total++;
                    // simplified: check if club has a cup result
                    if (club.history.some(h => h.cup && h.cup === goals.cupRound)) achieved++;
                }
                const score = total > 0 ? achieved / total : 0.5;
                club.boardSatisfaction = clamp(club.boardSatisfaction + (score - 0.5) * 15, 0, 100);
                if (club.boardSatisfaction < 25) {
                    this.addNews(`⚠ Vorstand unzufrieden! Saisonziele gefährdet.`, "urgent");
                }
                return {
                    satisfaction: Math.round(club.boardSatisfaction),
                    pos,
                    goals,
                    achieved,
                    total,
                    score: Math.round(score * 100)
                };
            }

            // ---- News ----
            addNews(text, type = "normal") {
                const entry = {
                    id: this.newsId++,
                    text,
                    type,
                    date: `${this.currentSeason}/${this.currentMatchday}`,
                    timestamp: Date.now()
                };
                this.news.unshift(entry);
                if (this.news.length > 200) this.news.pop();
                return entry;
            }

            // ---- Match Simulation ----
            simulateMatch(homeClub, awayClub) {
                let homeStrength = homeClub.averageOverall();
                let awayStrength = awayClub.averageOverall();
                if (homeClub.coach) homeStrength += homeClub.coach.tacticalQuality * 0.06;
                if (awayClub.coach) awayStrength += awayClub.coach.tacticalQuality * 0.06;
                // Home advantage
                homeStrength *= 1.05;
                // Form / morale adjustments
                const homeMorale = homeClub.players.reduce((a, p) => a + p.morale, 0) / homeClub.players.length;
                const awayMorale = awayClub.players.reduce((a, p) => a + p.morale, 0) / awayClub.players.length;
                homeStrength *= (0.8 + (homeMorale / 100) * 0.4);
                awayStrength *= (0.8 + (awayMorale / 100) * 0.4);
                homeStrength *= (1 + (Math.random() - 0.5) * 0.35);
                awayStrength *= (1 + (Math.random() - 0.5) * 0.35);

                const diff = homeStrength - awayStrength;
                const homeXg = Math.max(0.2, (homeStrength / 100) * 2.2 + diff * 0.015 + rand(-0.3, 0.3));
                const awayXg = Math.max(0.2, (awayStrength / 100) * 2.2 - diff * 0.015 + rand(-0.3, 0.3));
                let homeGoals = this.poissonRandom(homeXg);
                let awayGoals = this.poissonRandom(awayXg);
                homeGoals = clamp(homeGoals, 0, 8);
                awayGoals = clamp(awayGoals, 0, 8);

                // Events
                const events = [];
                for (let i = 0; i < homeGoals; i++) {
                    const scorer = homeClub.players[randInt(0, homeClub.players.length - 1)];
                    if (scorer) {
                        scorer.goals = (scorer.goals || 0) + 1;
                        events.push(`⚽ ${scorer.name} (${homeClub.name}) ${i+1}. Tor`);
                    } else {
                        events.push(`⚽ ${homeClub.name} Tor!`);
                    }
                }
                for (let i = 0; i < awayGoals; i++) {
                    const scorer = awayClub.players[randInt(0, awayClub.players.length - 1)];
                    if (scorer) {
                        scorer.goals = (scorer.goals || 0) + 1;
                        events.push(`⚽ ${scorer.name} (${awayClub.name}) ${i+1}. Tor`);
                    } else {
                        events.push(`⚽ ${awayClub.name} Tor!`);
                    }
                }
                // Random yellow card
                if (Math.random() < 0.25) {
                    const team = Math.random() < 0.5 ? homeClub : awayClub;
                    const player = team.players[randInt(0, team.players.length - 1)];
                    if (player) {
                        player.yellowCards = (player.yellowCards || 0) + 1;
                        events.push(`🟨 Gelb für ${player.name} (${team.name})`);
                    }
                }
                // Random injury
                if (Math.random() < 0.12) {
                    const team = Math.random() < 0.5 ? homeClub : awayClub;
                    const player = team.players[randInt(0, team.players.length - 1)];
                    if (player) {
                        const weeks = 1 + randInt(0, 4);
                        player.injuryWeeks = weeks;
                        events.push(`🩹 Verletzung! ${player.name} (${team.name}) fällt ${weeks} Wochen aus.`);
                    }
                }

                // Update player stats
                homeClub.players.forEach(p => { p.gamesPlayed = (p.gamesPlayed || 0) + 1;
                    p.morale = clamp(p.morale + rand(-2, 3), 0, 100); });
                awayClub.players.forEach(p => { p.gamesPlayed = (p.gamesPlayed || 0) + 1;
                    p.morale = clamp(p.morale + rand(-2, 3), 0, 100); });

                // Update club season stats
                homeClub.seasonGoalsScored = (homeClub.seasonGoalsScored || 0) + homeGoals;
                homeClub.seasonGoalsConceded = (homeClub.seasonGoalsConceded || 0) + awayGoals;
                awayClub.seasonGoalsScored = (awayClub.seasonGoalsScored || 0) + awayGoals;
                awayClub.seasonGoalsConceded = (awayClub.seasonGoalsConceded || 0) + homeGoals;

                return {
                    home: homeClub.name,
                    away: awayClub.name,
                    homeGoals,
                    awayGoals,
                    xG_home: Math.round(homeXg * 100) / 100,
                    xG_away: Math.round(awayXg * 100) / 100,
                    events,
                    homeStrength: Math.round(homeStrength),
                    awayStrength: Math.round(awayStrength)
                };
            }

            poissonRandom(lambda) {
                if (lambda < 30) {
                    let L = Math.exp(-lambda);
                    let k = 0;
                    let p = 1;
                    do {
                        k++;
                        p *= Math.random();
                    } while (p > L);
                    return k - 1;
                }
                return Math.round(lambda + Math.sqrt(lambda) * (Math.random() - 0.5) * 2);
            }

            simulateMatchday(fixtures) {
                const results = [];
                fixtures.forEach(([home, away]) => {
                    if (!away) {
                        results.push({ home: home.name, away: "BYE", homeGoals: null, awayGoals: null, events: [],
                            homeStrength: 0, awayStrength: 0 });
                        return;
                    }
                    const result = this.simulateMatch(home, away);
                    results.push(result);
                    const table = home.league === "Bundesliga" ? this.leagueTable : this.leagueTable2;
                    if (result.homeGoals > result.awayGoals) {
                        table[home.name] = (table[home.name] || 0) + 3;
                        home.seasonPoints = (home.seasonPoints || 0) + 3;
                    } else if (result.homeGoals < result.awayGoals) {
                        table[away.name] = (table[away.name] || 0) + 3;
                        away.seasonPoints = (away.seasonPoints || 0) + 3;
                    } else {
                        table[home.name] = (table[home.name] || 0) + 1;
                        table[away.name] = (table[away.name] || 0) + 1;
                        home.seasonPoints = (home.seasonPoints || 0) + 1;
                        away.seasonPoints = (away.seasonPoints || 0) + 1;
                    }
                });
                this.currentMatchday++;
                this.matchdayResults = results;
                this.advanceScouting(1);
                this.youthIntakeTimer++;
                // Youth intake every 10 weeks
                if (this.youthIntakeTimer >= 10) {
                    this.youthIntakeTimer = 0;
                    this.clubs.forEach(club => {
                        this.generateYouthIntake(club);
                    });
                }
                // Random events
                this.eventTimer++;
                if (this.eventTimer % 3 === 0) {
                    this.generateRandomEvent();
                }
                // Player development
                this.developPlayers();

                // Check season end (34 matchdays)
                if (this.currentMatchday >= 34) {
                    this.seasonComplete = true;
                    this.endSeason();
                }
                return results;
            }

            generateYouthIntake(club) {
                const level = club.youthAcademyLevel || 1;
                const numTalents = 1 + randInt(0, level);
                for (let i = 0; i < numTalents; i++) {
                    const age = 16 + randInt(0, 2);
                    const p = generatePlayer(99999 + Math.random() * 100000, age);
                    const boost = randInt(0, level * 3);
                    p.potential = clamp(p.potential + boost, 1, 99);
                    p.overall = clamp(p.overall + randInt(0, 5 + level), 1, 99);
                    p.marketValue = Math.round((0.2 + (p.overall / 100) * 2) * 10) / 10;
                    p.salary = Math.round((0.05 + (p.overall / 100) * 0.5) * 10) / 10;
                    p.contractYears = 3 + randInt(0, 2);
                    p.nationality = club.league === "Bundesliga" ? "Deutschland" : randomNationality();
                    club.players.push(p);
                    club.youthTalents.push({ playerId: p.id, season: this.currentSeason });
                    this.addNews(`🌱 Jugendspieler ${p.name} (${p.position}, ${p.overall} Stärke, Potential ${p.potential}) in ${club.name} nachgerückt.`,
                        "success");
                }
                return numTalents;
            }

            developPlayers() {
                this.clubs.forEach(club => {
                    club.players.forEach(p => {
                        p.weeksDeveloped = (p.weeksDeveloped || 0) + 1;
                        const devSpeed = 0.1 + (p.potential - p.overall) / 200 +
                            (club.coach ? club.coach.youthDevelopment / 200 : 0.1) +
                            (p.gamesPlayed > 10 ? 0.05 : 0);
                        if (Math.random() < devSpeed && p.overall < p.potential) {
                            // Increase a random attribute
                            const attr = randomItem(ATTRIBUTES);
                            p.attributes[attr] = clamp(p.attributes[attr] + randInt(1, 3), 1, 99);
                            // Also increase market value slightly
                            p.marketValue = Math.round((p.marketValue + 0.1 + rand(0, 0.3)) * 10) / 10;
                        }
                        // Morale changes based on games played
                        if (p.gamesPlayed > 15) {
                            p.morale = clamp(p.morale + rand(0, 1), 0, 100);
                        } else if (p.gamesPlayed < 5 && p.role !== "Talent") {
                            p.morale = clamp(p.morale + rand(-2, 0), 0, 100);
                        }
                        // Injury recovery
                        if (p.injuryWeeks > 0) {
                            p.injuryWeeks--;
                            if (p.injuryWeeks === 0) {
                                this.addNews(`💪 ${p.name} (${club.name}) ist wieder fit.`, "normal");
                            }
                        }
                        // Form penalty recovery
                        if (p.formPenalty > 0) {
                            p.formPenalty = Math.max(0, p.formPenalty - 0.5);
                        }
                    });
                });
            }

            generateRandomEvent() {
                const club = randomItem(this.clubs);
                if (!club) return;
                const eventType = randInt(0, 9);
                // 0-2: player related, 3-5: transfer related, 6-7: coach, 8-9: club
                if (eventType <= 2) {
                    // Player event
                    if (club.players.length < 3) return;
                    const p = randomItem(club.players);
                    if (!p) return;
                    const sub = randInt(0, 3);
                    if (sub === 0 && p.satisfaction < 60) {
                        this.addNews(`😤 ${p.name} (${club.name}) ist unzufrieden und fordert mehr Spielzeit.`, "urgent");
                        p.morale = clamp(p.morale - 10, 0, 100);
                    } else if (sub === 1 && p.overall > 75 && p.contractYears < 2) {
                        this.addNews(`📝 ${p.name} (${club.name}) möchte seinen Vertrag verlängern.`, "normal");
                        p.satisfaction = clamp(p.satisfaction + 5, 0, 100);
                    } else if (sub === 2 && p.gamesPlayed > 20 && p.goals > 10) {
                        this.addNews(`🌟 ${p.name} (${club.name}) ist in Top-Form und wird von großen Vereinen beobachtet.`,
                            "success");
                        p.marketValue = Math.round((p.marketValue + rand(0.5, 2)) * 10) / 10;
                    } else {
                        // Player randomly improves
                        if (Math.random() < 0.3) {
                            const attr = randomItem(ATTRIBUTES);
                            p.attributes[attr] = clamp(p.attributes[attr] + randInt(1, 2), 1, 99);
                            this.addNews(`📈 ${p.name} (${club.name}) hat sich im Training verbessert (${attr}).`, "success");
                        }
                    }
                } else if (eventType <= 5) {
                    // Transfer event
                    if (club.players.length < 2) return;
                    const p = randomItem(club.players);
                    if (!p) return;
                    if (Math.random() < 0.4) {
                        const interested = this.clubs.filter(c => c !== club && c.transferBudget > p.marketValue * 0.7);
                        if (interested.length > 0) {
                            const buyer = randomItem(interested);
                            const offer = Math.round((p.marketValue * (0.8 + rand(0, 0.5))) * 10) / 10;
                            this.addNews(`🔔 ${buyer.name} bietet ${offer.toFixed(1)} Mio. für ${p.name} (${club.name}).`,
                                "urgent");
                            // Auto-create a transfer offer
                            const offerObj = {
                                id: Date.now() + Math.random(),
                                player: p,
                                playerId: p.id,
                                fromClub: buyer,
                                fromClubName: buyer.name,
                                toClub: club,
                                toClubName: club.name,
                                amount: offer,
                                status: "pending",
                                counterAmount: null,
                                addons: {},
                                date: this.currentMatchday,
                                incoming: true
                            };
                            this.transferOffers.push(offerObj);
                        }
                    }
                } else if (eventType <= 7) {
                    // Coach event
                    if (!club.coach) return;
                    if (Math.random() < 0.3) {
                        this.addNews(`🧑‍🏫 ${club.coach.name} (${club.name}) fordert Verstärkung auf dem Transfermarkt.`,
                            "normal");
                        club.coach.satisfaction = clamp(club.coach.satisfaction - 5, 0, 100);
                    } else {
                        this.addNews(`📊 ${club.coach.name} (${club.name}) ist mit der Kaderentwicklung zufrieden.`,
                            "success");
                        club.coach.satisfaction = clamp(club.coach.satisfaction + 5, 0, 100);
                    }
                } else {
                    // Club event
                    const sub = randInt(0, 2);
                    if (sub === 0) {
                        // Sponsor
                        const bonus = randInt(1, 5);
                        club.financialReserves += bonus;
                        club.transferBudget += bonus * 0.3;
                        this.addNews(`💰 Neuer Sponsor: ${club.name} erhält ${bonus.toFixed(1)} Mio. € zusätzlich.`,
                            "success");
                    } else if (sub === 1) {
                        // Fan event
                        const change = randInt(-5, 10);
                        club.fanSatisfaction = clamp(club.fanSatisfaction + change, 0, 100);
                        if (change > 5) {
                            this.addNews(`❤️ Fan-Zufriedenheit bei ${club.name} gestiegen!`, "success");
                        } else if (change < -3) {
                            this.addNews(`😡 Fanproteste bei ${club.name}!`, "urgent");
                        }
                    } else {
                        // Stadium/Infrastructure
                        if (Math.random() < 0.2) {
                            const cost = randInt(2, 8);
                            if (club.financialReserves > cost) {
                                club.financialReserves -= cost;
                                club.stadium.capacity += randInt(1000, 5000);
                                this.addNews(`🏟 Stadionausbau in ${club.name} abgeschlossen. Kapazität: ${club.stadium.capacity}`,
                                    "success");
                            }
                        }
                    }
                }
            }

            endSeason() {
                // Process season end: promotion, relegation, European spots, etc.
                this.addNews(`🏆 Saison ${this.currentSeason} beendet!`, "success");
                // Determine champions, promotion, relegation
                const bundesTable = this.getTable("Bundesliga");
                const zweitTable = this.getTable("2. Bundesliga");

                if (bundesTable.length > 0) {
                    const champ = bundesTable[0][0];
                    const champClub = this.getClub(champ);
                    if (champClub) {
                        champClub.trophies.push({ season: this.currentSeason, title: "Meister" });
                        this.addNews(`🏆 ${champ} ist Meister der 1. Bundesliga ${this.currentSeason}!`, "success");
                    }
                    // Relegation: 16th plays playoff vs 3rd of 2. Bundesliga
                    if (bundesTable.length >= 16) {
                        const relegationClub = this.getClub(bundesTable[15][0]);
                        const promotionClub = zweitTable.length >= 3 ? this.getClub(zweitTable[2][0]) : null;
                        if (relegationClub && promotionClub) {
                            // Playoff simulation
                            const playoff = this.simulateMatch(relegationClub, promotionClub);
                            let playoffWinner, playoffLoser;
                            if (playoff.homeGoals > playoff.awayGoals) {
                                playoffWinner = relegationClub;
                                playoffLoser = promotionClub;
                            } else if (playoff.homeGoals < playoff.awayGoals) {
                                playoffWinner = promotionClub;
                                playoffLoser = relegationClub;
                            } else {
                                // Extra time penalty (simplified: random)
                                if (Math.random() < 0.5) {
                                    playoffWinner = relegationClub;
                                    playoffLoser = promotionClub;
                                } else {
                                    playoffWinner = promotionClub;
                                    playoffLoser = relegationClub;
                                }
                            }
                            this.addNews(`⚖ Relegation: ${playoffWinner.name} bleibt/stetigt auf!`, "urgent");
                            // Swap leagues
                            if (playoffWinner === promotionClub) {
                                playoffWinner.league = "Bundesliga";
                                playoffLoser.league = "2. Bundesliga";
                            } else {
                                playoffWinner.league = "Bundesliga";
                                playoffLoser.league = "2. Bundesliga";
                            }
                        }
                    }
                    // Direct relegation: 17th and 18th
                    if (bundesTable.length >= 18) {
                        const rel1 = this.getClub(bundesTable[16][0]);
                        const rel2 = this.getClub(bundesTable[17][0]);
                        if (rel1) rel1.league = "2. Bundesliga";
                        if (rel2) rel2.league = "2. Bundesliga";
                        this.addNews(`⬇ ${rel1?.name} und ${rel2?.name} steigen in die 2. Bundesliga ab.`, "urgent");
                    }
                }
                // Promotion from 2. Bundesliga: top 2
                if (zweitTable.length >= 2) {
                    const prom1 = this.getClub(zweitTable[0][0]);
                    const prom2 = this.getClub(zweitTable[1][0]);
                    if (prom1) {
                        prom1.league = "Bundesliga";
                        this.addNews(`⬆ ${prom1.name} steigt in die 1. Bundesliga auf!`, "success");
                    }
                    if (prom2) {
                        prom2.league = "Bundesliga";
                        this.addNews(`⬆ ${prom2.name} steigt in die 1. Bundesliga auf!`, "success");
                    }
                }

                // Reset for next season
                this.currentSeason++;
                this.currentMatchday = 0;
                this.seasonComplete = false;
                this.clubs.forEach(c => {
                    c.seasonPoints = 0;
                    c.seasonGoalsScored = 0;
                    c.seasonGoalsConceded = 0;
                    c.players.forEach(p => {
                        p.gamesPlayed = 0;
                        p.goals = 0;
                        p.assists = 0;
                        p.yellowCards = 0;
                        p.redCards = 0;
                    });
                    // Increase player ages
                    c.players.forEach(p => p.age++);
                    // Set new season goals
                    const table = this.getTable(c.league);
                    const pos = table.findIndex(([name]) => name === c.name) + 1;
                    const prevGoal = this.seasonGoals[c.name]?.leaguePlace || 10;
                    const newGoal = Math.max(1, Math.min(18, prevGoal + randInt(-2, 3)));
                    c.seasonGoals = {
                        leaguePlace: newGoal,
                        cupRound: ["round1", "round2", "quarter", "semi", "final"][randInt(0, 4)]
                    };
                    this.seasonGoals[c.name] = { ...c.seasonGoals };
                    // Update budgets
                    const tvMoney = c.league === "Bundesliga" ? 10 + rand(0, 10) : 3 + rand(0, 5);
                    const sponsorBonus = c.league === "Bundesliga" ? 5 + rand(0, 8) : 1 + rand(0, 3);
                    c.financialReserves += tvMoney + sponsorBonus + rand(0, 5);
                    c.transferBudget += rand(2, 8) + (c.league === "Bundesliga" ? 5 : 1);
                    c.transferBudget = Math.round(c.transferBudget * 10) / 10;
                    c.financialReserves = Math.round(c.financialReserves * 10) / 10;
                    // Fan trust changes
                    const tablePos = this.getTable(c.league).findIndex(([name]) => name === c.name) + 1;
                    if (tablePos <= 4) c.fanSatisfaction = clamp(c.fanSatisfaction + 5, 0, 100);
                    else if (tablePos >= 16) c.fanSatisfaction = clamp(c.fanSatisfaction - 10, 0, 100);
                    else c.fanSatisfaction = clamp(c.fanSatisfaction + rand(-2, 3), 0, 100);
                });
                // Reset league tables
                this.leagueTable = {};
                this.leagueTable2 = {};
                this.clubs.forEach(c => {
                    if (c.league === "Bundesliga") this.leagueTable[c.name] = 0;
                    else this.leagueTable2[c.name] = 0;
                });

                this.addNews(`📅 Neue Saison ${this.currentSeason} gestartet!`, "success");
                this.saveGame();
            }

            // ---- Save/Load ----
            saveGame() {
                const data = {
                    clubs: this.clubs.map(c => c.toJSON()),
                    currentMatchday: this.currentMatchday,
                    currentSeason: this.currentSeason,
                    leagueTable: this.leagueTable,
                    leagueTable2: this.leagueTable2,
                    transferOffers: this.transferOffers.map(o => ({
                        ...o,
                        player: o.player ? { id: o.player.id, name: o.player.name } : null,
                        fromClub: o.fromClub ? o.fromClub.name : null,
                        toClub: o.toClub ? o.toClub.name : null
                    })),
                    scoutingReports: this.scoutingReports,
                    news: this.news,
                    newsId: this.newsId,
                    seasonComplete: this.seasonComplete,
                    seasonGoals: this.seasonGoals,
                    youthIntakeTimer: this.youthIntakeTimer,
                    eventTimer: this.eventTimer,
                    clubHistory: this.clubHistory
                };
                localStorage.setItem('sportdirektorSave', JSON.stringify(data));
                return data;
            }

            loadGame(data) {
                this.clubs = data.clubs.map(c => Club.fromJSON(c));
                this.currentMatchday = data.currentMatchday || 0;
                this.currentSeason = data.currentSeason || 2026;
                this.leagueTable = data.leagueTable || {};
                this.leagueTable2 = data.leagueTable2 || {};
                this.transferOffers = data.transferOffers || [];
                this.scoutingReports = data.scoutingReports || [];
                this.news = data.news || [];
                this.newsId = data.newsId || 0;
                this.seasonComplete = data.seasonComplete || false;
                this.seasonGoals = data.seasonGoals || {};
                this.youthIntakeTimer = data.youthIntakeTimer || 0;
                this.eventTimer = data.eventTimer || 0;
                this.clubHistory = data.clubHistory || {};
                // Rebuild transfer offers with actual objects
                this.transferOffers = this.transferOffers.map(o => {
                    const from = this.getClub(o.fromClubName);
                    const to = this.getClub(o.toClubName);
                    let player = null;
                    if (o.player && o.player.id) {
                        for (let c of this.clubs) {
                            const p = c.players.find(p => p.id === o.player.id);
                            if (p) { player = p; break; }
                        }
                    }
                    return { ...o, fromClub: from, toClub: to, player: player };
                });
                return this;
            }
        }

        function makeOfferUI() {
            const club = appState.playerClub;
            const eng = appState.engine;
            const search = prompt("Spielername oder ID für Angebot:");
            if (!search) return;
            let targetPlayer = null,
                targetClub = null;
            const id = parseInt(search);
            if (!isNaN(id)) {
                for (let c of eng.clubs) {
                    if (c === club) continue;
                    const p = c.players.find(p => p.id === id);
                    if (p) { targetPlayer = p;
                        targetClub = c; break; }
                }
            } else {
                const name = search.toLowerCase();
                for (let c of eng.clubs) {
                    if (c === club) continue;
                    const p = c.players.find(p => p.name.toLowerCase().includes(name));
                    if (p) { targetPlayer = p;
                        targetClub = c; break; }
                }
            }
            if (!targetPlayer) { alert("❌ Spieler nicht gefunden."); return; }
            const amount = parseFloat(prompt(`Angebot für ${targetPlayer.name} (Wert: ${formatMoney(targetPlayer.marketValue)}):`));
            if (isNaN(amount) || amount <= 0) return;
            const result = eng.makeOffer(club, targetClub, targetPlayer, amount);
            document.getElementById('transfer-output').innerHTML =
                `<p style="color:${result.success ? 'var(--green)' : 'var(--gold)'};">${result.msg}</p>`;
            if (result.offer && result.offer.status === 'counter') {
                const btn = document.createElement('button');
                btn.textContent = '⚡ Gegenangebot annehmen';
                btn.onclick = () => {
                    const res = eng.acceptCounter(result.offer.id);
                    document.getElementById('transfer-output').innerHTML =
                        `<p style="color:${res.success ? 'var(--green)' : 'var(--red)'};">${res.msg}</p>`;
                    renderTransfers();
                };
                document.getElementById('transfer-output').appendChild(btn);
            }
            renderTransfers();
        }

                document.getElementById('transfer-output').innerHTML = "<p>📭 Keine offenen Angebote.</p>";
                return;
            }
            let out = `<h4>📋 Offene Angebote</h4>`;
            eng.transferOffers.forEach((o, idx) => {
                const isIncoming = o.toClub && o.toClub.name === appState.playerClub.name;
                const isOutgoing = o.fromClub && o.fromClub.name === appState.playerClub.name;
                const label = isIncoming ? '👉 Angebot für dich' : isOutgoing ? '👈 Dein Angebot' : '⚖️';
                out += `<div class="news-item" style="border-left-color:${isIncoming ? 'var(--gold)' : 'var(--blue)'}">
                    <p><strong>${label}</strong> ${o.player?.name || 'Spieler'} – ${formatMoney(o.amount)}</p>
                    <p>Von: ${o.fromClubName || '?'} → Zu: ${o.toClubName || '?'}</p>
                    <p>Status: ${o.status} ${o.counterAmount ? `(Gegenangebot: ${formatMoney(o.counterAmount)})` : ''}</p>
                    ${isIncoming ? `<button onclick="acceptIncomingOffer(${idx})" class="success small">Annehmen</button>` : ''}
                    ${isOutgoing && o.status === 'counter' ? `<button onclick="acceptCounterOffer(${idx})" class="gold small">Gegenangebot annehmen</button>` : ''}
                    <button onclick="rejectOffer(${idx})" class="danger small">Ablehnen</button>
                </div>`;
            });
            document.getElementById('transfer-output').innerHTML = out;

        function acceptIncomingOffer(idx) {
            const eng = appState.engine;
            const offer = eng.transferOffers[idx];
            if (!offer) return;
            // Incoming offer: the offer is from another club to buy the player from the player's club
            // But in our model, we need to check the direction
            if (offer.toClub && offer.toClub.name === appState.playerClub.name) {
                // This is an offer FOR a player of the player's club
                // The player is in offer.player, the buying club is offer.fromClub
                // We need to sell the player
                const player = offer.player;
                const buyer = offer.fromClub;
                if (!player || !buyer) return;
                if (confirm(`${buyer.name} bietet ${formatMoney(offer.amount)} für ${player.name}. Verkaufen?`)) {
                    const idx2 = eng.transferOffers.indexOf(offer);
                    if (idx2 !== -1) eng.transferOffers.splice(idx2, 1);
                    const offerObj = { ...offer, fromClub: appState.playerClub, toClub: buyer, status: 'accept' };
                    eng.executeTransfer(offerObj);
                    document.getElementById('transfer-output').innerHTML = `<p style="color:var(--green);">✅ Verkauf abgeschlossen!</p>`;
                    renderTransfers();

        function signScoutedPlayer(reportId) {
            const club = appState.playerClub;
            const eng = appState.engine;
            const report = eng.scoutingReports.find(r => r.id === reportId);
            if (!report || !report.results?.length) { alert("Keine Spieler verfügbar."); return; }
            const list = report.results.map((p, i) => `${i+1}. ${p.name} (${p.position}, ${p.overall} Stärke, ${formatMoney(p.marketValue)})`)
                .join('\n');
            const choice = parseInt(prompt(`Spieler verpflichten:\n${list}\nAuswahl (1-${report.results.length}):`));
            if (isNaN(choice) || choice < 1 || choice > report.results.length) return;
            const player = report.results[choice - 1];
            if (!player) return;
            const cost = player.marketValue * 1.1;
            if (cost > club.transferBudget) {
                alert(`❌ Nicht genug Budget. Benötigt: ${formatMoney(cost)}`);
                return;
            }
            // Add player to club
            const newPlayer = new Player(
                Date.now() + Math.random() * 10000,
                player.name,
                player.age,
                player.position,
                { ...player.attributes },
                player.marketValue,
                player.salary,
                3 + randInt(0, 2),
                player.potential,
                player.nationality
            );
            club.players.push(newPlayer);
            club.transferBudget -= cost;
            club.financialReserves -= cost * 0.5;
            // Remove from report
            const idx = report.results.indexOf(player);
            if (idx !== -1) report.results.splice(idx, 1);
            eng.addNews(`✅ ${newPlayer.name} wurde vom Scouting verpflichtet.`, "success");
            alert(`✅ ${newPlayer.name} verpflichtet!`);
            closeModal();
            renderScouting();

        function simulateMatchdayUI() {
            const eng = appState.engine;
            const club = appState.playerClub;
            if (eng.currentMatchday >= 34) {
                alert("Saison bereits beendet! Starte nächste Saison.");
                return;
            }

            // Build fixtures for both leagues
            const bundesClubs = eng.clubs.filter(c => c.league === "Bundesliga");
            const zweitClubs = eng.clubs.filter(c => c.league === "2. Bundesliga");

            const fixtures1 = buildFixtures(bundesClubs);
            const fixtures2 = buildFixtures(zweitClubs);

            // Simulate both leagues
            const results1 = eng.simulateMatchday(fixtures1);
            // We need to simulate 2. Bundesliga separately without incrementing matchday twice
            const oldMatchday = eng.currentMatchday;
            const results2 = eng.simulateMatchday(fixtures2);
            eng.currentMatchday = oldMatchday + 1;

            // Render results
            let html = `<h4>Spieltag ${eng.currentMatchday} — Ergebnisse</h4>`;
            html += renderResultsBlock(eng, "Bundesliga", results1, club.name);
            html += renderResultsBlock(eng, "2. Bundesliga", results2, club.name);

            document.getElementById('matchday-results').innerHTML = html;
            updateHeader();
            renderMatchday();
            renderDashboard();
        }

        function buildFixtures(clubs) {
            const shuffled = [...clubs].sort(() => Math.random() - 0.5);
            const fixtures = [];
            for (let i = 0; i < shuffled.length; i += 2) {
                if (i + 1 < shuffled.length) {
                    fixtures.push([shuffled[i], shuffled[i + 1]]);
                } else {
                    fixtures.push([shuffled[i], null]);
                }
            }
            return fixtures;
        }

        function renderResultsBlock(eng, leagueName, results, playerClubName) {
            let html = `<h4>&gt; ${leagueName.toUpperCase()}</h4><div class="ticker">`;
            results.forEach(r => {
                if (!r.away) {
                    html += `<p>${r.home} ist spielfrei.</p>`;
                    return;
                }
                const isOwn = r.home === playerClubName || r.away === playerClubName;
                html += `<p${isOwn ? ' class="highlight"' : ''}>
                    <strong>${r.home} ${r.homeGoals} - ${r.awayGoals} ${r.away}</strong>
                    (xG: ${r.xG_home} - ${r.xG_away})

                r.events.forEach(e => html += `<p>&nbsp;&nbsp;${e}</p>`);
                html += `<hr>`;
            });
            html += `</div>`;
            return html;
        }

            try {
                const data = JSON.parse(raw);

                appState.engine = eng;
                // Find player club by name

                if (playerName) {
                    const found = eng.clubs.find(c => c.name === playerName);
