                club.fanTrust = data.fanTrust;
                club.boardSatisfaction = data.boardSatisfaction;
                club.fanSatisfaction = data.fanSatisfaction;
                club.trophies = data.trophies || [];
                club.seasonPoints = data.seasonPoints || 0;
                club.seasonGoalsScored = data.seasonGoalsScored || 0;
                club.seasonGoalsConceded = data.seasonGoalsConceded || 0;
                club.history = data.history || [];
                club.sponsorIncome = data.sponsorIncome || 5;
                club.ticketIncome = data.ticketIncome || 2;
                club.merchandisingIncome = data.merchandisingIncome || 1;
                club.youthTalents = data.youthTalents || [];
                club.players = data.players.map(p => Player.fromJSON(p));
                club.coach = data.coach ? Coach.fromJSON(data.coach) : null;
                club.lastFiveResults = data.lastFiveResults || [];
                club.financialHistory = data.financialHistory || [];
                club.staff = data.staff || { scouts: [] };
                club.avgAge = data.avgAge || 0;
                club.squadValueCache = data.squadValueCache || 0;
                return club;
            }
        }

        // ---- Generate realistic clubs with real player data ----
        function generateRealisticClubs() {
            const clubs = [];

            // Process Bundesliga clubs
            BUNDESLIGA_CLUBS.forEach(def => {
                const budget = def.budget;
                const club = new Club(
                    def.name,
                    "Bundesliga",
                    budget.reserve || 50,
                    budget.transfer || 30,
                    budget.salary || 25,
                    { leaguePlace: def.goal.league || 8, cupRound: def.goal.cup || "quarter" },
                    2 + randInt(0, 4),
                    { name: def.stadium, capacity: def.capacity || 30000 },
                    def.reputation || 70,
                    def.philosophy || "Entwicklung"
                );
                // Add players from data
                const playerData = PLAYER_DATA[def.name] || [];
                if (playerData.length) {
                    const players = buildPlayersFromData(def.name, playerData);
                    club.players = players;
                } else {
                    // Fallback: generate random players
                    for (let i = 0; i < 22; i++) {
                        const age = 18 + randInt(0, 18);
                        const p = generatePlayer(10000 + i + Math.random() * 1000, age);
                        club.players.push(p);
                    }
                }
                // Assign coach
                const coach = generateCoach(1000 + Math.random() * 1000);
                coach.wageDemand = Math.round((0.5 + (def.reputation || 50) / 50 * 2) * 10) / 10;
                club.coach = coach;
                clubs.push(club);
            });

            // Process 2. Bundesliga clubs
            ZWEITLIGA_CLUBS.forEach(def => {
                const budget = def.budget || { reserve: 15, transfer: 6, salary: 8 };
                const club = new Club(
                    def.name,
                    "2. Bundesliga",
                    budget.reserve || 15,
                    budget.transfer || 6,
                    budget.salary || 8,
                    { leaguePlace: def.goal?.league || 8, cupRound: def.goal?.cup || "round2" },
                    1 + randInt(0, 3),
                    { name: def.stadium, capacity: def.capacity || 20000 },
                    def.reputation || 50,
                    def.philosophy || "Entwicklung"
                );
                const playerData = PLAYER_DATA[def.name] || [];
                if (playerData.length) {
                    const players = buildPlayersFromData(def.name, playerData);
                    club.players = players;
                } else {
                    for (let i = 0; i < 20; i++) {
                        const age = 18 + randInt(0, 18);
                        const p = generatePlayer(20000 + i + Math.random() * 1000, age);
                        p.marketValue = Math.round(p.marketValue * 0.4 * 10) / 10;
                        p.salary = Math.round(p.salary * 0.5 * 10) / 10;
                        club.players.push(p);
                    }
                }
                const coach = generateCoach(2000 + Math.random() * 1000);
                coach.wageDemand = Math.round((0.3 + (def.reputation || 40) / 50 * 1.5) * 10) / 10;
                club.coach = coach;
                clubs.push(club);
            });

            return clubs;
        }

        // ---- Generator fallback ----
        function generatePlayer(id, age = null, position = null) {
            if (age === null) age = 18 + randInt(0, 18);
            if (position === null) position = randomItem(POSITIONS);
            const attrs = {};
            ATTRIBUTES.forEach(attr => {
                let base = 45 + randInt(0, 40);
                const weights = POSITION_WEIGHTS[position] || POSITION_WEIGHTS["ZM"];
                if (weights && weights[attr]) {
                    base += Math.floor(weights[attr] * 25);
                }
                attrs[attr] = clamp(base, 1, 99);
            });
            const overall = Math.round(Object.values(attrs).reduce((a, b) => a + b, 0) / ATTRIBUTES.length);
            const marketValue = Math.round((0.3 + (overall / 100) * 12 + rand(-0.5, 0.5)) * 10) / 10;
            const salary = Math.round((0.15 + (overall / 100) * 5 + rand(-0.3, 0.3)) * 10) / 10;
            const contract = 1 + randInt(0, 4);
            const potential = clamp(overall + 5 + randInt(0, 25), 1, 99);
            const nat = randomNationality();
            return new Player(id, randomName(), age, position, attrs, Math.max(0.1, marketValue),
                Math.max(0.05, salary), contract, potential, nat);
        }

        function randomName() {
            const first = ["Max", "Lukas", "Julian", "Marco", "Mats", "Thomas", "Manuel", "Joshua", "Serge", "Leon",
                "Kai", "Timo", "Niclas", "Florian", "Robin", "Bernd", "Kevin", "Matthias", "Christian", "Jan"
            ];
            const last = ["Müller", "Schmidt", "Schneider", "Fischer", "Weber", "Meyer", "Wagner", "Becker", "Schulz",
                "Hoffmann"
            ];
            return first[Math.floor(Math.random() * first.length)] + " " + last[Math.floor(Math.random() * last.length)];
        }

        function randomNationality() {
            const nats = ["Deutschland", "Österreich", "Schweiz", "Polen", "Frankreich", "Italien", "Spanien",
                "England", "Niederlande", "Belgien", "Dänemark", "Schweden", "Norwegen", "Brasilien", "Argentinien"
            ];
            return nats[Math.floor(Math.random() * nats.length)];
        }

        function generateCoach(id) {
            const philosophies = ["Ballbesitz", "Konterspiel", "Pressing", "Direktes Spiel", "Tiki-Taka", "Catenaccio"];
            const formations = ["4-3-3", "4-2-3-1", "3-4-3", "4-4-2", "3-5-2", "5-3-2", "4-1-4-1"];
            const allSkills = ["offensive_development", "youth_promotion", "motivation", "defensive_organisation",
                "media_competence"
            ];
            const strengths = {};
            const weaknesses = {};
            allSkills.forEach(skill => {
                strengths[skill] = 40 + randInt(0, 45);
                weaknesses[skill] = 30 + randInt(0, 40);
            });
            const age = 35 + randInt(0, 30);
            const rep = 40 + randInt(0, 45);
            const wage = 0.5 + rand(0, 3.5);
            const c = new Coach(id, randomName(), age, rep,
                randomItem(philosophies), randomItem(formations),
                strengths, weaknesses,
                1 + randInt(0, 3), Math.round(wage * 10) / 10);
            c.tacticalQuality = 40 + randInt(0, 50);
            c.youthDevelopment = 40 + randInt(0, 50);
            c.authority = 40 + randInt(0, 45);
            c.media = 40 + randInt(0, 45);
            return c;
        }

        // ---- POSITIONS for the game ----
        const POSITIONS = ["IV", "AV", "ZM", "FL", "ST"];
        const ATTRIBUTES = ["geschwindigkeit", "passspiel", "schuss", "defensive", "kopfball"];
        const POSITION_WEIGHTS = {
            IV: { defensive: 0.6, kopfball: 0.2, passspiel: 0.1, geschwindigkeit: 0.05, schuss: 0.05 },
            AV: { geschwindigkeit: 0.3, defensive: 0.3, passspiel: 0.2, schuss: 0.1, kopfball: 0.1 },
            ZM: { passspiel: 0.3, schuss: 0.2, geschwindigkeit: 0.15, defensive: 0.25, kopfball: 0.1 },
            FL: { geschwindigkeit: 0.3, schuss: 0.25, passspiel: 0.2, defensive: 0.1, kopfball: 0.15 },
            ST: { schuss: 0.35, kopfball: 0.25, geschwindigkeit: 0.2, passspiel: 0.1, defensive: 0.1 }
        };

        // ---- CREST mapping ----
        const CLUB_CREST = {};
        BUNDESLIGA_CLUBS.forEach(c => CLUB_CREST[c.name] = c.crest);
        ZWEITLIGA_CLUBS.forEach(c => CLUB_CREST[c.name] = c.crest);

        // ================================================================
        //  GAME ENGINE (simplified but functional)
        // ================================================================

        class GameEngine {
            constructor(clubs) {
                this.clubs = clubs;
                this.currentMatchday = 0;
                this.currentSeason = 2026;
                this.leagueTable = {};
                this.leagueTable2 = {};
                this.clubs.forEach(c => {
                    if (c.league === "Bundesliga") this.leagueTable[c.name] = 0;
                    else this.leagueTable2[c.name] = 0;
                });
                this.transferOffers = [];
                this.scoutingReports = [];
                this.news = [];
                this.newsId = 0;
                this.seasonComplete = false;
                this.transferWindowOpen = true;
                this.matchdayResults = [];
                this.clubHistory = {};
                this.running = true;
                this.youthIntakeTimer = 0;
                this.eventTimer = 0;
                this.seasonGoals = {};
                this.clubs.forEach(c => {
                    this.seasonGoals[c.name] = { ...c.seasonGoals };
                });
                this.matchReports = [];
                this.transferHistory = [];
                this.pendingDecisions = [];
                this.decisionId = 0;
            }

            getTable(leagueName) {
                const table = leagueName === "Bundesliga" ? this.leagueTable : this.leagueTable2;
                const namesInLeague = new Set(this.clubs.filter(c => c.league === leagueName).map(c => c.name));
                return Object.entries(table)
                    .filter(([name]) => namesInLeague.has(name))
                    .sort((a, b) => b[1] - a[1]);
            }

            getClub(name) { return this.clubs.find(c => c.name === name); }

            // ---- Basic operations ----
            addNews(text, type = "normal") {
                const entry = {
                    id: this.newsId++,
                    text,
                    type,
                    date: `${this.currentSeason}/${this.currentMatchday}`,
                    timestamp: Date.now()
                };
                this.news.unshift(entry);
                if (this.news.length > 200) this.news.pop();
                return entry;
            }

            // ---- Squad analysis ----
            analyzeSquad(club) {
                const counts = {},
                    avg = {};
                club.players.forEach(p => {
                    counts[p.position] = (counts[p.position] || 0) + 1;
                    if (!avg[p.position]) avg[p.position] = [];
                    avg[p.position].push(p.overall);
                });
                for (let pos in avg) {
                    avg[pos] = Math.round(avg[pos].reduce((a, b) => a + b, 0) / avg[pos].length);
                }
                return { counts, avgOverall: avg };
            }

            squadDepthReport(club) {
                const analysis = this.analyzeSquad(club);
                let report = `📊 Kaderanalyse ${club.name}:\nPosition | Anzahl | Ø Stärke\n`;
                for (let pos in analysis.counts) {
                    report += `${pos.padEnd(8)} | ${analysis.counts[pos].toString().padEnd(5)} | ${analysis.avgOverall[pos]}\n`;
                }
                const weak = [];
                for (let pos in analysis.counts) {
                    if (analysis.counts[pos] < 2) weak.push(pos + " (zu dünn)");
                    else if (analysis.avgOverall[pos] < 65) weak.push(pos + " (schwach)");
                }
                report += weak.length ? `⚠ Schwachstellen: ${weak.join(', ')}` : "✅ Kader ausgewogen.";
                return report;
            }

            // ---- Transfers ----
            scoutPlayers(club, position, budget) {
                const candidates = [];
                this.clubs.forEach(other => {
                    if (other === club) return;
                    other.players.forEach(p => {
                        if (p.position === position && p.marketValue <= budget * 1.3) {
                            candidates.push({ player: p, club: other });
                        }
                    });
                });
                candidates.sort((a, b) => b.player.overall - a.player.overall);
                return candidates.slice(0, 15);
            }

            makeOffer(fromClub, toClub, player, amount, addons = {}) {
                if (amount > fromClub.transferBudget) {
                    return { success: false, msg: "Nicht genug Transferbudget.", offer: null };
                }
                const ratio = amount / player.marketValue;
                let decision;
                let counterAmount = null;
                const aiFactor = toClub.reputation / 100;
                if (ratio >= 1.4 + (1 - aiFactor) * 0.3) decision = "accept";
                else if (ratio < 0.6 + (1 - aiFactor) * 0.2) decision = "reject";
                else {
                    decision = "counter";
                    counterAmount = Math.round((amount * (1.05 + rand(0, 0.35)) + 0.5) * 10) / 10;
                }
                const offer = {
                    id: Date.now() + Math.random(),
                    player: player,
                    playerId: player.id,
                    fromClub: fromClub,
                    fromClubName: fromClub.name,
                    toClub: toClub,
                    toClubName: toClub.name,
                    amount: amount,
                    status: decision,
                    counterAmount: counterAmount,
                    addons: addons || {},
                    date: this.currentMatchday,
                    season: this.currentSeason,
                    timestamp: Date.now()
                };
                if (decision === "accept") {
                    this.executeTransfer(offer);
                    this.transferHistory.push({ ...offer, status: "completed" });
                    return { success: true, msg: `${player.name} wechselt für ${amount.toFixed(1)} Mio. zu ${fromClub.name}.`,
                        offer };
                } else if (decision === "reject") {
                    this.transferHistory.push({ ...offer, status: "rejected" });
                    return { success: false, msg: `${toClub.name} lehnt das Angebot für ${player.name} ab.`, offer: null };
                } else {
                    this.transferOffers.push(offer);
                    this.transferHistory.push({ ...offer, status: "counter" });
                    return { success: false, msg: `${toClub.name} fordert ${counterAmount.toFixed(1)} Mio. (Gegenangebot).`,
                        offer };
                }
            }

            executeTransfer(offer) {
                const { player, fromClub, toClub, amount } = offer;
                const idx = fromClub.players.indexOf(player);
                if (idx !== -1) fromClub.players.splice(idx, 1);
                toClub.players.push(player);
                toClub.transferBudget -= amount;
                toClub.financialReserves -= amount * 0.5;
                fromClub.transferBudget += amount;
                fromClub.financialReserves += amount * 0.5;
                player.contractYears = 3 + randInt(0, 2);
                player.satisfaction = clamp(player.satisfaction + 10, 0, 100);
                player.morale = clamp(player.morale + 15, 0, 100);
                player.wantsTransfer = false;
                player.transferRequestReason = null;
                const oIdx = this.transferOffers.indexOf(offer);
                if (oIdx !== -1) this.transferOffers.splice(oIdx, 1);
                this.addNews(`Transfer abgeschlossen: ${player.name} wechselt von ${fromClub.name} zu ${toClub.name} für ${amount.toFixed(1)} Mio. €`,
                    "success");
                this.addNews(`${toClub.name} verpflichtet ${player.name} für ${amount.toFixed(1)} Mio. €`, "success");
                this.transferHistory.push({ ...offer, status: "completed", executedAt: Date.now() });
            }

            acceptCounter(offerId) {
                const offer = this.transferOffers.find(o => o.id === offerId);
                if (!offer) return { success: false, msg: "Angebot nicht gefunden." };
                if (offer.status !== "counter") return { success: false, msg: "Kein Gegenangebot." };
                if (!offer.counterAmount) return { success: false, msg: "Kein Gegenangebot." };
                if (offer.counterAmount > offer.fromClub.transferBudget) {
                    return { success: false, msg: "Nicht genug Budget für Gegenangebot." };
                }
                offer.amount = offer.counterAmount;
                offer.status = "accept";
                this.executeTransfer(offer);
                return { success: true, msg: `Gegenangebot angenommen! ${offer.player.name} wechselt für ${offer.amount.toFixed(1)} Mio.` };
            }

            rejectOffer(offerId) {
                const idx = this.transferOffers.findIndex(o => o.id === offerId);
                if (idx === -1) return { success: false, msg: "Angebot nicht gefunden." };
                const offer = this.transferOffers[idx];
                this.transferOffers.splice(idx, 1);
                this.transferHistory.push({ ...offer, status: "rejected" });
                return { success: true, msg: "Angebot abgelehnt." };
            }

            // ---- Coach ----
            evaluateCoach(club) {
                if (!club.coach) return "❌ Kein Trainer.";
                const c = club.coach;
                const perf = club.fanSatisfaction;
                const score = (perf * 0.4 + c.reputation * 0.4 + c.tacticalQuality * 0.2);
                let rating = score > 75 ? "Hervorragend" : score > 55 ? "Gut" : score > 40 ? "Durchschnittlich" :
                    "Verbesserungswürdig";
                return `🧑‍🏫 ${c.name} (${c.age} Jahre)\nReputation: ${c.reputation} | Taktik: ${c.tacticalQuality}\nJugendförderung: ${c.youthDevelopment} | Autorität: ${c.authority}\nMedien: ${c.media}\nPhilosophie: ${c.philosophy} | Formation: ${c.preferredFormation}\nBewertung: ${rating}`;
            }

            hireCoach(club, coach) {
                if (club.coach) return { success: false, msg: `${club.name} hat bereits einen Trainer.` };
                club.coach = coach;
                this.addNews(`${coach.name} wird neuer Trainer von ${club.name}.`, "success");
                return { success: true, msg: `${coach.name} als neuer Trainer verpflichtet.` };
            }

            fireCoach(club) {
                if (!club.coach) return { success: false, msg: "Kein Trainer." };
                const fired = club.coach;
                club.coach = null;
                this.addNews(`${fired.name} wurde als Trainer entlassen.`, "urgent");
                return { success: true, msg: `${fired.name} entlassen.` };
            }

            // ---- Scouting ----
            startScouting(club, region, ageMin, ageMax, position, minPotential, durationWeeks, budget) {
                if (budget > club.transferBudget) return { success: false, msg: "Nicht genug Budget." };
                club.transferBudget -= budget;
                const report = {
                    id: Date.now() + Math.random(),
                    club: club.name,
                    region,
                    ageMin,
                    ageMax,
                    position,
                    minPotential,
                    durationWeeks,
                    budget,
                    startDay: this.currentMatchday,
                    completed: false,
                    results: [],
                    progress: 0,
                    scoutName: "Scout " + randomItem(["Müller", "Schmidt", "Fischer", "Weber", "Hoffmann"])
                };
                this.scoutingReports.push(report);
                this.addNews(`🔍 Scoutingauftrag in ${region} gestartet (${position}, Potential ${minPotential}+). Dauer: ${durationWeeks} Wochen.`,
                    "success");
                return { success: true, msg: "Scoutingauftrag gestartet.", report };
            }

            advanceScouting(weeks) {
                const reports = this.scoutingReports.filter(r => !r.completed);
                reports.forEach(r => {
                    r.progress += weeks;
                    if (r.progress >= r.durationWeeks) {
                        r.completed = true;
                        const numResults = 2 + randInt(0, 5) + (r.durationWeeks > 4 ? randInt(0, 2) : 0);
                        for (let i = 0; i < numResults; i++) {
                            const age = r.ageMin + randInt(0, r.ageMax - r.ageMin);
                            const p = generatePlayer(9999 + Math.random() * 100000, age, r.position === "alle" ? null : r
                                .position);
                            const potBonus = randInt(0, 15 + (r.durationWeeks > 5 ? 5 : 0));
                            p.potential = clamp(p.potential + potBonus, 1, 99);
                            if (p.overall < 40) p.overall = 40 + randInt(0, 20);
                            const regionFactor = r.region === "Südamerika" ? 1.2 : r.region === "Europa" ? 1.1 : 0.9;
                            p.marketValue = Math.round(p.marketValue * (0.3 + rand(0, 0.3)) * regionFactor * 10) / 10;
                            p.nationality = r.region === "Deutschland" ? "Deutschland" :
                                r.region === "Südamerika" ? randomItem(["Brasilien", "Argentinien", "Uruguay", "Chile",
                                    "Kolumbien"
                                ]) :
                                r.region === "Afrika" ? randomItem(["Kamerun", "Ghana", "Nigeria", "Senegal",
                                    "Elfenbeinküste"
                                ]) :
                                r.region === "Asien" ? randomItem(["Japan", "Korea", "China", "Australien"]) :
                                r.region === "Nordamerika" ? randomItem(["USA", "Kanada", "Mexiko"]) :
                                randomNationality();
                            r.results.push(p);
                        }
                        this.addNews(`📊 Scoutingauftrag in ${r.region} abgeschlossen! ${r.results.length} Spieler gefunden.`,
                            "success");
                    }
                });
            }

            getScoutingResults(clubName) {
                return this.scoutingReports.filter(r => r.club === clubName && r.completed);
            }

            // ---- Board evaluation ----
            evaluateBoard(club) {
                const goals = this.seasonGoals[club.name] || club.seasonGoals;
                const table = this.getTable(club.league);
                const pos = table.findIndex(([name]) => name === club.name) + 1;
                let achieved = 0;
                let total = 0;
                if (goals.leaguePlace) {
                    total++;
                    if (pos <= goals.leaguePlace) achieved++;
                }
                if (goals.cupRound) {
                    total++;
                    if (club.history.some(h => h.cup && h.cup === goals.cupRound)) achieved++;
                }
                const score = total > 0 ? achieved / total : 0.5;
                const financialScore = club.financialReserves > 20 ? 1 : club.financialReserves > 5 ? 0.7 : 0.3;
                const combinedScore = (score * 0.6 + financialScore * 0.4);
                club.boardSatisfaction = clamp(club.boardSatisfaction + (combinedScore - 0.5) * 12, 0, 100);
                if (club.boardSatisfaction < 25) {
                    this.addNews(`⚠ Vorstand unzufrieden! Saisonziele gefährdet.`, "urgent");
                }
                return {
                    satisfaction: Math.round(club.boardSatisfaction),
                    pos,
                    goals,
                    achieved,
                    total,
                    score: Math.round(score * 100),
                    combinedScore: Math.round(combinedScore * 100)
                };
            }

            // ---- Match simulation ----
            simulateMatch(homeClub, awayClub) {
                let homeStrength = homeClub.averageOverall();
                let awayStrength = awayClub.averageOverall();
                if (homeClub.coach) homeStrength += homeClub.coach.tacticalQuality * 0.06;
                if (awayClub.coach) awayStrength += awayClub.coach.tacticalQuality * 0.06;
                homeStrength *= 1.05;
                const homeMorale = homeClub.players.reduce((a, p) => a + p.morale, 0) / homeClub.players.length || 50;
                const awayMorale = awayClub.players.reduce((a, p) => a + p.morale, 0) / awayClub.players.length || 50;
                homeStrength *= (0.7 + (homeMorale / 100) * 0.5);
                awayStrength *= (0.7 + (awayMorale / 100) * 0.5);
                homeStrength *= (1 + (Math.random() - 0.5) * 0.35);
                awayStrength *= (1 + (Math.random() - 0.5) * 0.35);

                const diff = homeStrength - awayStrength;
                const homeXg = Math.max(0.15, (homeStrength / 100) * 2.2 + diff * 0.015 + rand(-0.3, 0.3));
                const awayXg = Math.max(0.15, (awayStrength / 100) * 2.2 - diff * 0.015 + rand(-0.3, 0.3));
                let homeGoals = this.poissonRandom(homeXg);
                let awayGoals = this.poissonRandom(awayXg);
                homeGoals = clamp(homeGoals, 0, 8);
                awayGoals = clamp(awayGoals, 0, 8);

                const events = [];
                for (let i = 0; i < homeGoals; i++) {
                    const scorer = homeClub.players[randInt(0, homeClub.players.length - 1)];
                    if (scorer) {
                        scorer.goals = (scorer.goals || 0) + 1;
                        events.push(`⚽ ${scorer.name} (${homeClub.name}) Tor!`);
                    } else {
                        events.push(`⚽ ${homeClub.name} Tor!`);
                    }
                }
                for (let i = 0; i < awayGoals; i++) {
                    const scorer = awayClub.players[randInt(0, awayClub.players.length - 1)];
                    if (scorer) {
                        scorer.goals = (scorer.goals || 0) + 1;
                        events.push(`⚽ ${scorer.name} (${awayClub.name}) Tor!`);
                    } else {
                        events.push(`⚽ ${awayClub.name} Tor!`);
                    }
                }
                if (Math.random() < 0.25) {
                    const team = Math.random() < 0.5 ? homeClub : awayClub;
                    const player = team.players[randInt(0, team.players.length - 1)];
                    if (player) {
                        player.yellowCards = (player.yellowCards || 0) + 1;
                        events.push(`🟨 Gelb für ${player.name} (${team.name})`);
                    }
                }
                if (Math.random() < 0.12) {
                    const team = Math.random() < 0.5 ? homeClub : awayClub;
                    const player = team.players[randInt(0, team.players.length - 1)];
                    if (player) {
                        const weeks = 1 + randInt(0, 4);
                        player.injuryWeeks = weeks;
                        events.push(`🩹 Verletzung! ${player.name} (${team.name}) fällt ${weeks} Wochen aus.`);
                    }
                }

                homeClub.players.forEach(p => { p.gamesPlayed = (p.gamesPlayed || 0) + 1;
                    p.morale = clamp(p.morale + rand(-3, 4), 0, 100); });
                awayClub.players.forEach(p => { p.gamesPlayed = (p.gamesPlayed || 0) + 1;
                    p.morale = clamp(p.morale + rand(-3, 4), 0, 100); });

                homeClub.seasonGoalsScored = (homeClub.seasonGoalsScored || 0) + homeGoals;
                homeClub.seasonGoalsConceded = (homeClub.seasonGoalsConceded || 0) + awayGoals;
                awayClub.seasonGoalsScored = (awayClub.seasonGoalsScored || 0) + awayGoals;
                awayClub.seasonGoalsConceded = (awayClub.seasonGoalsConceded || 0) + homeGoals;

                const result = {
                    home: homeClub.name,
                    away: awayClub.name,
                    homeGoals,
                    awayGoals,
                    xG_home: Math.round(homeXg * 100) / 100,
                    xG_away: Math.round(awayXg * 100) / 100,
                    events,
                    homeStrength: Math.round(homeStrength),
                    awayStrength: Math.round(awayStrength),
                    homeMorale: Math.round(homeMorale),
                    awayMorale: Math.round(awayMorale),
                    playerOfTheMatch: null
                };

                // Player of the match
                const candidates = [...homeClub.players, ...awayClub.players].filter(p => p.overall > 70);
                if (candidates.length > 0) {
                    const picked = candidates.reduce((a, b) => a.overall > b.overall ? a : b);
                    result.playerOfTheMatch = { name: picked.name, club: picked.club === homeClub ? homeClub.name :
                            awayClub.name };
                }

                this.matchReports.push(result);
                if (this.matchReports.length > 50) this.matchReports.shift();

                return result;
            }

            poissonRandom(lambda) {
                if (lambda < 30) {
                    let L = Math.exp(-lambda);
                    let k = 0;
                    let p = 1;
                    do {
                        k++;
                        p *= Math.random();
                    } while (p > L);
                    return k - 1;
                }
                return Math.round(lambda + Math.sqrt(lambda) * (Math.random() - 0.5) * 2);
            }

            simulateMatchday(fixtures) {
                const results = [];
                fixtures.forEach(([home, away]) => {
                    if (!away) {
                        results.push({ home: home.name, away: "BYE", homeGoals: null, awayGoals: null, events: [],
                            homeStrength: 0, awayStrength: 0, playerOfTheMatch: null });
                        return;
                    }
                    const result = this.simulateMatch(home, away);
                    results.push(result);
                    const table = home.league === "Bundesliga" ? this.leagueTable : this.leagueTable2;
                    if (result.homeGoals > result.awayGoals) {
                        table[home.name] = (table[home.name] || 0) + 3;
                        home.seasonPoints = (home.seasonPoints || 0) + 3;
                        home.lastFiveResults.push('W');
                        away.lastFiveResults.push('L');
                        home.players.forEach(p => p.morale = clamp(p.morale + rand(1, 4), 0, 100));
                        away.players.forEach(p => p.morale = clamp(p.morale + rand(-4, -1), 0, 100));
                        this.addNews(`📈 ${home.name} gewinnt ${result.homeGoals}:${result.awayGoals} gegen ${away.name}`,
                            "success");
                    } else if (result.homeGoals < result.awayGoals) {
                        table[away.name] = (table[away.name] || 0) + 3;
                        away.seasonPoints = (away.seasonPoints || 0) + 3;
                        home.lastFiveResults.push('L');
                        away.lastFiveResults.push('W');
                        away.players.forEach(p => p.morale = clamp(p.morale + rand(1, 4), 0, 100));
                        home.players.forEach(p => p.morale = clamp(p.morale + rand(-4, -1), 0, 100));
                        this.addNews(`📉 ${away.name} schlägt ${home.name} auswärts mit ${result.awayGoals}:${result.homeGoals}`,
                            "success");
                    } else {
                        table[home.name] = (table[home.name] || 0) + 1;
                        table[away.name] = (table[away.name] || 0) + 1;
                        home.seasonPoints = (home.seasonPoints || 0) + 1;
                        away.seasonPoints = (away.seasonPoints || 0) + 1;
                        home.lastFiveResults.push('D');
                        away.lastFiveResults.push('D');
                        this.addNews(`🤝 ${home.name} und ${away.name} trennen sich ${result.homeGoals}:${result.awayGoals}`,
                            "normal");
                    }
                });
                this.currentMatchday++;
                this.matchdayResults = results;
                this.advanceScouting(1);
                this.youthIntakeTimer++;
                if (this.youthIntakeTimer >= 8) {
                    this.youthIntakeTimer = 0;
                    this.clubs.forEach(club => {
                        this.generateYouthIntake(club);
                    });
                }
                this.eventTimer++;
                if (this.eventTimer % 2 === 0) {
                    this.generateRandomEvent();
                }
                this.developPlayers();
                this.checkPlayerMorale();

                if (this.currentMatchday >= 34) {
                    this.seasonComplete = true;
                    this.endSeason();
                }
                return results;
            }

            generateYouthIntake(club) {
                const level = club.youthAcademyLevel || 1;
                const numTalents = 1 + randInt(0, Math.min(level, 4));
                for (let i = 0; i < numTalents; i++) {
                    const age = 16 + randInt(0, 2);
                    const p = generatePlayer(99999 + Math.random() * 100000, age);
                    const boost = randInt(0, level * 3 + 2);
                    p.potential = clamp(p.potential + boost, 1, 99);
                    p.overall = clamp(p.overall + randInt(0, 5 + level), 1, 99);
                    p.marketValue = Math.round((0.2 + (p.overall / 100) * 2) * 10) / 10;
                    p.salary = Math.round((0.05 + (p.overall / 100) * 0.5) * 10) / 10;
                    p.contractYears = 3 + randInt(0, 2);
                    p.nationality = club.league === "Bundesliga" && Math.random() < 0.6 ? "Deutschland" :
                        randomNationality();
                    club.players.push(p);
                    club.youthTalents.push({ playerId: p.id, season: this.currentSeason, name: p.name });
                    this.addNews(`🌱 Jugendspieler ${p.name} (${p.position}, ${p.overall} Stärke, Potential ${p.potential}) in ${club.name} nachgerückt.`,
                        "success");
                }
                return numTalents;
            }

            developPlayers() {
                this.clubs.forEach(club => {
                    club.players.forEach(p => {
                        p.weeksDeveloped = (p.weeksDeveloped || 0) + 1;
                        const devSpeed = 0.08 + (p.potential - p.overall) / 180 +
                            (club.coach ? club.coach.youthDevelopment / 180 : 0.08) +
                            (p.gamesPlayed > 12 ? 0.05 : 0) +
                            (p.morale > 70 ? 0.03 : -0.02);
                        if (Math.random() < devSpeed && p.overall < p.potential) {
                            const attr = randomItem(ATTRIBUTES);
                            p.attributes[attr] = clamp(p.attributes[attr] + randInt(1, 3), 1, 99);
                            p.marketValue = Math.round((p.marketValue + 0.1 + rand(0, 0.3)) * 10) / 10;
                            if (Math.random() < 0.05) {
                                this.addNews(`📈 ${p.name} (${club.name}) hat sich im Training verbessert!`, "success");
                            }
                        }
                        if (p.gamesPlayed > 18) {
                            p.morale = clamp(p.morale + rand(0, 1.5), 0, 100);
                        } else if (p.gamesPlayed < 5 && p.role !== "Talent") {
                            p.morale = clamp(p.morale + rand(-2.5, -0.5), 0, 100);
                            if (p.morale < 30 && !p.wantsTransfer) {
                                p.wantsTransfer = true;
                                p.transferRequestReason = "Zu wenig Einsatzzeit";
                                this.addNews(`😤 ${p.name} (${club.name}) fordert Wechsel wegen fehlender Spielzeit.`,
                                    "urgent");
                            }
                        }
                        if (p.injuryWeeks > 0) {
                            p.injuryWeeks--;
                            if (p.injuryWeeks === 0) {
                                this.addNews(`💪 ${p.name} (${club.name}) ist wieder fit.`, "normal");
                            }
                        }
                        if (p.formPenalty > 0) {
                            p.formPenalty = Math.max(0, p.formPenalty - 0.5);
                        }
                        if (p.contractYears < 2 && p.overall > 70 && Math.random() < 0.01) {
                            if (!p.contractDemand) {
                                p.contractDemand = {
                                    salary: Math.round(p.salary * (1.1 + rand(0, 0.3)) * 10) / 10,
                                    years: 2 + randInt(0, 2),
                                    bonus: Math.round(rand(0.2, 1.5) * 10) / 10
                                };
                                this.addNews(`📝 ${p.name} (${club.name}) möchte seinen Vertrag verlängern.`, "warning");
                            }
                        }
                    });
                });
            }

            checkPlayerMorale() {
                this.clubs.forEach(club => {
                    club.players.forEach(p => {
                        if (p.morale < 20 && !p.wantsTransfer && Math.random() < 0.02) {
                            p.wantsTransfer = true;
                            p.transferRequestReason = "Allgemeine Unzufriedenheit";
                            this.addNews(`🚨 ${p.name} (${club.name}) möchte den Verein verlassen!`, "urgent");
                        }
                        p.moraleHistory.push({ morale: p.morale, matchday: this.currentMatchday });
                        if (p.moraleHistory.length > 20) p.moraleHistory.shift();
                    });
                });
            }

            generateRandomEvent() {
                const club = randomItem(this.clubs);
                if (!club) return;
                const eventType = randInt(0, 11);
                if (eventType <= 2) {
                    if (club.players.length < 3) return;
                    const p = randomItem(club.players);
                    if (!p) return;
                    const sub = randInt(0, 3);
                    if (sub === 0 && p.satisfaction < 60) {
                        this.addNews(`😤 ${p.name} (${club.name}) ist unzufrieden und fordert mehr Spielzeit.`, "urgent");
                        p.morale = clamp(p.morale - 10, 0, 100);
                    } else if (sub === 1 && p.overall > 75 && p.contractYears < 2) {
                        this.addNews(`📝 ${p.name} (${club.name}) möchte seinen Vertrag verlängern.`, "warning");
                        p.satisfaction = clamp(p.satisfaction + 5, 0, 100);
                    } else if (sub === 2 && p.gamesPlayed > 20 && p.goals > 8) {
                        this.addNews(`🌟 ${p.name} (${club.name}) ist in Top-Form!`, "success");
                        p.marketValue = Math.round((p.marketValue + rand(0.5, 2.5)) * 10) / 10;
                    } else {
                        if (Math.random() < 0.25) {
                            const attr = randomItem(ATTRIBUTES);
                            p.attributes[attr] = clamp(p.attributes[attr] + randInt(1, 2), 1, 99);
                            this.addNews(`📈 ${p.name} (${club.name}) verbessert sich im Training (${attr}).`, "success");
                        }
                    }
                } else if (eventType <= 5) {
                    if (club.players.length < 2) return;
                    const p = randomItem(club.players);
                    if (!p) return;
                    if (Math.random() < 0.35) {
                        const interested = this.clubs.filter(c => c !== club && c.transferBudget > p.marketValue * 0.6);
                        if (interested.length > 0) {
                            const buyer = randomItem(interested);
                            const offer = Math.round((p.marketValue * (0.75 + rand(0, 0.55))) * 10) / 10;
                            this.addNews(`🔔 ${buyer.name} bietet ${offer.toFixed(1)} Mio. für ${p.name} (${club.name}).`,
                                "urgent");
                            const offerObj = {
                                id: Date.now() + Math.random(),
                                player: p,
                                playerId: p.id,
                                fromClub: buyer,
                                fromClubName: buyer.name,
                                toClub: club,
                                toClubName: club.name,
                                amount: offer,
                                status: "pending",
                                counterAmount: null,
                                addons: {},
                                date: this.currentMatchday,
                                incoming: true
                            };
                            this.transferOffers.push(offerObj);
                        }
                    }
                } else if (eventType <= 7) {
                    if (!club.coach) return;
                    if (Math.random() < 0.25) {
                        const neededPos = randomItem(POSITIONS);
                        const demand = {
                            type: "player_request",
                            position: neededPos,
                            text: `Trainer ${club.coach.name} fordert Verstärkung auf der Position ${neededPos}.`,
                            target: neededPos
                        };
                        club.coach.demands.push(demand);
                        this.addNews(`🧑‍🏫 ${club.coach.name} (${club.name}) fordert einen neuen ${neededPos}.`, "warning");
                        club.coach.satisfaction = clamp(club.coach.satisfaction - 5, 0, 100);
                    } else {
                        this.addNews(`📊 ${club.coach.name} (${club.name}) ist mit der Kaderentwicklung zufrieden.`,
                            "success");
                        club.coach.satisfaction = clamp(club.coach.satisfaction + 5, 0, 100);
                    }
                } else if (eventType <= 9) {
                    const sub = randInt(0, 2);
                    if (sub === 0) {
                        const bonus = randInt(1, 6);
                        club.financialReserves += bonus;
                        club.transferBudget += bonus * 0.3;
                        this.addNews(`💰 Neuer Sponsor: ${club.name} erhält ${bonus.toFixed(1)} Mio. € zusätzlich.`,
                            "success");
                    } else if (sub === 1) {
                        const change = randInt(-5, 10);
                        club.fanSatisfaction = clamp(club.fanSatisfaction + change, 0, 100);
                        if (change > 5) {
                            this.addNews(`❤️ Fan-Zufriedenheit bei ${club.name} gestiegen!`, "success");
                        } else if (change < -3) {
                            this.addNews(`😡 Fanproteste bei ${club.name}!`, "urgent");
                        }
                    } else {
                        if (Math.random() < 0.2 && club.financialReserves > 5) {
                            const cost = randInt(2, 10);
                            if (club.financialReserves > cost) {
                                club.financialReserves -= cost;
                                club.stadium.capacity += randInt(1000, 6000);
                                this.addNews(`🏟 Stadionausbau in ${club.name} abgeschlossen. Kapazität: ${club.stadium.capacity}`,
                                    "success");
                            }
                        }
                    }
                } else {
                    if (Math.random() < 0.15) {
                        const rival = randomItem(this.clubs.filter(c => c !== club));
                        if (rival) {
                            this.addNews(`🔥 Rivalität: ${club.name} vs. ${rival.name} – Spannung vor dem Spiel!`,
                                "warning");
                        }
                    }
                }
            }

            endSeason() {
                this.addNews(`🏆 Saison ${this.currentSeason} beendet!`, "success");
                const bundesTable = this.getTable("Bundesliga");
                const zweitTable = this.getTable("2. Bundesliga");

                if (bundesTable.length > 0) {
                    const champ = bundesTable[0][0];
                    const champClub = this.getClub(champ);
                    if (champClub) {
                        champClub.trophies.push({ season: this.currentSeason, title: "Meister" });
                        this.addNews(`🏆 ${champ} ist Meister der 1. Bundesliga ${this.currentSeason}!`, "success");
                        champClub.fanSatisfaction = clamp(champClub.fanSatisfaction + 15, 0, 100);
                    }
                    if (bundesTable.length >= 16) {
                        const relegationClub = this.getClub(bundesTable[15][0]);
                        const promotionClub = zweitTable.length >= 3 ? this.getClub(zweitTable[2][0]) : null;
                        if (relegationClub && promotionClub) {
                            const playoff = this.simulateMatch(relegationClub, promotionClub);
                            let playoffWinner, playoffLoser;
                            if (playoff.homeGoals > playoff.awayGoals) {
                                playoffWinner = relegationClub;
                                playoffLoser = promotionClub;
                            } else if (playoff.homeGoals < playoff.awayGoals) {
                                playoffWinner = promotionClub;
                                playoffLoser = relegationClub;
                            } else {
                                if (Math.random() < 0.5) {
                                    playoffWinner = relegationClub;
                                    playoffLoser = promotionClub;
                                } else {
                                    playoffWinner = promotionClub;
                                    playoffLoser = relegationClub;
                                }
                            }
                            this.addNews(`⚖ Relegation: ${playoffWinner.name} bleibt/steigt auf!`, "urgent");
                            if (playoffWinner === promotionClub) {
                                playoffWinner.league = "Bundesliga";
                                playoffLoser.league = "2. Bundesliga";
                            } else {
                                playoffWinner.league = "Bundesliga";
                                playoffLoser.league = "2. Bundesliga";
                            }
                        }
                    }
                    if (bundesTable.length >= 18) {
                        const rel1 = this.getClub(bundesTable[16][0]);
                        const rel2 = this.getClub(bundesTable[17][0]);
                        if (rel1) rel1.league = "2. Bundesliga";
                        if (rel2) rel2.league = "2. Bundesliga";
                        this.addNews(`⬇ ${rel1?.name} und ${rel2?.name} steigen in die 2. Bundesliga ab.`, "urgent");
                    }
                }
                if (zweitTable.length >= 2) {
                    const prom1 = this.getClub(zweitTable[0][0]);
                    const prom2 = this.getClub(zweitTable[1][0]);
                    if (prom1) { prom1.league = "Bundesliga";
                        this.addNews(`⬆ ${prom1.name} steigt in die 1. Bundesliga auf!`, "success"); }
                    if (prom2) { prom2.league = "Bundesliga";
                        this.addNews(`⬆ ${prom2.name} steigt in die 1. Bundesliga auf!`, "success"); }
                }

                this.clubs.forEach(c => {
                    const table = c.league === "Bundesliga" ? this.leagueTable : this.leagueTable2;
                    const pos = Object.entries(table).sort((a, b) => b[1] - a[1]).findIndex(([name]) => name === c.name) +
                        1;
                    c.history.push({
                        season: this.currentSeason,
                        position: pos || 0,
                        points: c.seasonPoints || 0,
                        goalsScored: c.seasonGoalsScored || 0,
                        goalsConceded: c.seasonGoalsConceded || 0,
                        league: c.league
                    });
                    if (c.history.length > 20) c.history.shift();
                });

                this.currentSeason++;
                this.currentMatchday = 0;
                this.seasonComplete = false;
                this.clubs.forEach(c => {
                    c.seasonPoints = 0;
                    c.seasonGoalsScored = 0;
                    c.seasonGoalsConceded = 0;
                    c.lastFiveResults = [];
                    c.players.forEach(p => {
                        p.gamesPlayed = 0;
                        p.goals = 0;
                        p.assists = 0;
                        p.yellowCards = 0;
                        p.redCards = 0;
                        p.contractDemand = null;
                    });
                    c.players.forEach(p => p.age++);

                    const table = this.getTable(c.league);
                    const pos = table.findIndex(([name]) => name === c.name) + 1;
                    const prevGoal = this.seasonGoals[c.name]?.leaguePlace || 10;
                    const newGoal = Math.max(1, Math.min(18, prevGoal + randInt(-2, 4)));
                    c.seasonGoals = {
                        leaguePlace: newGoal,
                        cupRound: ["round1", "round2", "quarter", "semi", "final"][randInt(0, 4)]
                    };
                    this.seasonGoals[c.name] = { ...c.seasonGoals };

                    const tvMoney = c.league === "Bundesliga" ? 10 + rand(0, 12) : 3 + rand(0, 6);
                    const sponsorBonus = c.league === "Bundesliga" ? 5 + rand(0, 10) : 1 + rand(0, 4);
                    const prizeMoney = c.history.length > 0 ? Math.max(0, (18 - (c.history[c.history.length - 1]?.position ||
                        10)) * 0.5) : 0;
                    c.financialReserves += tvMoney + sponsorBonus + prizeMoney + rand(0, 5);
                    c.transferBudget += rand(2, 10) + (c.league === "Bundesliga" ? 6 : 1.5);
                    c.transferBudget = Math.round(c.transferBudget * 10) / 10;
                    c.financialReserves = Math.round(c.financialReserves * 10) / 10;

                    const tablePos = this.getTable(c.league).findIndex(([name]) => name === c.name) + 1;
                    if (tablePos <= 4) c.fanSatisfaction = clamp(c.fanSatisfaction + 5, 0, 100);
                    else if (tablePos >= 16) c.fanSatisfaction = clamp(c.fanSatisfaction - 10, 0, 100);
                    else c.fanSatisfaction = clamp(c.fanSatisfaction + rand(-2, 4), 0, 100);
                });

                this.leagueTable = {};
                this.leagueTable2 = {};
                this.clubs.forEach(c => {
                    if (c.league === "Bundesliga") this.leagueTable[c.name] = 0;
                    else this.leagueTable2[c.name] = 0;
                });

                this.addNews(`📅 Neue Saison ${this.currentSeason} gestartet!`, "success");
                this.saveGame();
            }

            // ---- Urgent tasks ----
            getUrgentTasks(club) {
                const tasks = [];
                if (!club.coach) {
                    tasks.push({ text: "❌ Kein Trainer – stelle einen ein!", urgency: "urgent", action: "coach" });
                }
                if (club.players.length < 20) {
                    tasks.push({ text: "⚠ Kleiner Kader – verpflichte Spieler.", urgency: "warning", action: "transfers" });
                }
                if (club.transferBudget < 3) {
                    tasks.push({ text: "💰 Knappes Budget – Verkäufe erwägen.", urgency: "warning", action: "transfers" });
                }
                const boardEval = this.evaluateBoard(club);
                if (boardEval.satisfaction < 35) {
                    tasks.push({ text: "⚠ Vorstand unzufrieden – Ergebnisse verbessern!", urgency: "urgent",
                        action: "board" });
                }
                if (club.fanSatisfaction < 25) {
                    tasks.push({ text: "😡 Fanunruhe – sportliche Erfolge nötig.", urgency: "urgent", action: "board" });
                }
                const unhappy = club.players.filter(p => p.morale < 30);
                if (unhappy.length > 0) {
                    tasks.push({ text: `😤 ${unhappy.length} unzufriedene Spieler – kümmere dich um ihre Anliegen.`,
                        urgency: "urgent", action: "squad" });
                }
                const contractDemands = club.players.filter(p => p.contractDemand);
                if (contractDemands.length > 0) {
                    tasks.push({ text: `📝 ${contractDemands.length} Spieler wollen Verträge verlängern.`, urgency: "warning",
                        action: "squad" });
                }
                if (club.coach && club.coach.demands.length > 0) {
                    const d = club.coach.demands[0];
                    tasks.push({ text: `🧑‍🏫 Trainer fordert: ${d.text}`, urgency: "warning", action: "transfers" });
                }
                const transferRequests = club.players.filter(p => p.wantsTransfer);
                if (transferRequests.length > 0) {
                    tasks.push({ text: `🚪 ${transferRequests.length} Spieler wollen wechseln.`, urgency: "urgent",
                        action: "squad" });
                }
                if (tasks.length === 0) {
                    tasks.push({ text: "✅ Alles im grünen Bereich. Weiter so!", urgency: "normal", action: null });
                }
                return tasks;
            }

            // ---- Recent matches ----
            getRecentMatches(club) {
                return this.matchReports.filter(r => r.home === club.name || r.away === club.name).slice(-6);
            }

            // ---- Save/Load ----
            saveGame() {
                const data = {
                    clubs: this.clubs.map(c => c.toJSON()),
                    currentMatchday: this.currentMatchday,
                    currentSeason: this.currentSeason,
                    leagueTable: this.leagueTable,
                    leagueTable2: this.leagueTable2,
                    transferOffers: this.transferOffers.map(o => ({
                        ...o,
                        player: o.player ? { id: o.player.id, name: o.player.name } : null,
                        fromClub: o.fromClub ? o.fromClub.name : null,
                        toClub: o.toClub ? o.toClub.name : null
                    })),
                    scoutingReports: this.scoutingReports,
                    news: this.news,
                    newsId: this.newsId,
                    seasonComplete: this.seasonComplete,
                    seasonGoals: this.seasonGoals,
                    youthIntakeTimer: this.youthIntakeTimer,
                    eventTimer: this.eventTimer,
                    clubHistory: this.clubHistory,
                    matchReports: this.matchReports,
                    transferHistory: this.transferHistory,
                    pendingDecisions: this.pendingDecisions,
                    decisionId: this.decisionId
                };
                localStorage.setItem('sportdirektorSave', JSON.stringify(data));
                return data;
            }

            loadGame(data) {
                this.clubs = data.clubs.map(c => Club.fromJSON(c));
                this.currentMatchday = data.currentMatchday || 0;
                this.currentSeason = data.currentSeason || 2026;
                this.leagueTable = data.leagueTable || {};
                this.leagueTable2 = data.leagueTable2 || {};
                this.transferOffers = data.transferOffers || [];
                this.scoutingReports = data.scoutingReports || [];
                this.news = data.news || [];
                this.newsId = data.newsId || 0;
                this.seasonComplete = data.seasonComplete || false;
                this.seasonGoals = data.seasonGoals || {};
                this.youthIntakeTimer = data.youthIntakeTimer || 0;
                this.eventTimer = data.eventTimer || 0;
                this.clubHistory = data.clubHistory || {};
                this.matchReports = data.matchReports || [];
                this.transferHistory = data.transferHistory || [];
                this.pendingDecisions = data.pendingDecisions || [];
                this.decisionId = data.decisionId || 0;

                this.transferOffers = this.transferOffers.map(o => {
                    const from = this.getClub(o.fromClubName);
                    const to = this.getClub(o.toClubName);
                    let player = null;
                    if (o.player && o.player.id) {
                        for (let c of this.clubs) {
                            const p = c.players.find(p => p.id === o.player.id);
                            if (p) { player = p; break; }
                        }
                    }
                    return { ...o, fromClub: from, toClub: to, player: player };
                });
                return this;
            }
        }

        // ================================================================
        //  APPLICATION STATE
        // ================================================================

        let appState = {
            clubs: [],
            engine: null,
            playerClub: null,
            currentTab: 'dashboard',
            careerStarted: false
        };

        // ================================================================
        //  DOM REFS
        // ================================================================

        const startScreen = document.getElementById('start-screen');
        const selectScreen = document.getElementById('select-screen');
        const gameScreen = document.getElementById('game-screen');
        const clubList = document.getElementById('club-list');
        const clubNameHeader = document.getElementById('club-name-header');
        const seasonDisplay = document.getElementById('season-display');
        const matchdayDisplay = document.getElementById('matchday-display');
        const budgetDisplay = document.getElementById('budget-display');
        const modalContainer = document.getElementById('modal-container');

        const tabContents = {
            dashboard: document.getElementById('tab-dashboard'),
            squad: document.getElementById('tab-squad'),
            transfers: document.getElementById('tab-transfers'),
            scouting: document.getElementById('tab-scouting'),
            coach: document.getElementById('tab-coach'),
            board: document.getElementById('tab-board'),
            news: document.getElementById('tab-news'),
            matchday: document.getElementById('tab-matchday'),
            save: document.getElementById('tab-save')
        };

        let selectedLeagueTab = "Bundesliga";

        // ================================================================
        //  UI HELPERS
        // ================================================================

        function showModal(title, contentHTML, onClose) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
                    <div class="modal-box">
                        <button class="close-btn" onclick="closeModal()">✕</button>
                        <h2>${title}</h2>
                        <div>${contentHTML}</div>
                    </div>
                </div>
            `;
            if (onClose) modalContainer._onClose = onClose;
        }

        function closeModal() {
            if (modalContainer._onClose) modalContainer._onClose();
            modalContainer.innerHTML = '';
        }

        function progressBar(value, max = 100, color = 'gold') {
            const pct = clamp((value / max) * 100, 0, 100);
            return `<div class="progress-bar"><div class="fill ${color}" style="width:${pct}%"></div></div>`;
        }

        function formatMoney(v) { return v.toFixed(1) + " Mio. €"; }

        function getCrest(name) { return CLUB_CREST[name] || name.slice(0, 3).toUpperCase(); }

        function moraleBar(value) {
            const color = value >= 75 ? 'green' : value >= 50 ? 'gold' : 'red';
            return `<div class="morale-bar"><div class="fill ${color}" style="width:${value}%"></div></div>`;
        }

        // ================================================================
        //  RENDER FUNCTIONS
        // ================================================================

        function renderClubList() {
            clubList.innerHTML = '';
            const clubs = appState.clubs.filter(c => c.league === selectedLeagueTab);
            clubs.forEach(club => {
                const crest = getCrest(club.name);
                const crestClass = club.league === "2. Bundesliga" ? "crest league-2" : "crest";
                const div = document.createElement('div');
                div.className = 'club-card';
                const diff = club.reputation > 75 ? "★☆☆☆☆" :
                    club.reputation > 65 ? "★★☆☆☆" :
                    club.reputation > 55 ? "★★★☆☆" :
                    club.reputation > 45 ? "★★★★☆" : "★★★★★";
                const boardGoal = club.seasonGoals?.leaguePlace ? `Platz ${club.seasonGoals.leaguePlace}` : "—";
                div.innerHTML = `
                    <div class="club-head">
                        <div class="${crestClass}">${crest}</div>
                        <h3>${club.name}</h3>
                    </div>
                    <p style="font-size:14px;">💰 ${formatMoney(club.transferBudget)}</p>
                    <p style="font-size:14px;">📊 Kaderwert: ${formatMoney(club.squadValue())}</p>
                    <p style="font-size:14px;">🏟 ${club.stadium?.name || ''} (${club.stadium?.capacity || 0})</p>
                    <p style="font-size:14px;">🎯 Ziel: ${boardGoal} | Schwierigkeit: ${diff}</p>
                    <p style="font-size:14px;">📈 Reputation: ${club.reputation}</p>
                    <p style="font-size:12px;color:var(--dim);">${club.philosophy || '—'}</p>
                    <button data-name="${club.name}" class="select-club">▶ Übernehmen</button>
                `;
                div.querySelector('.select-club').addEventListener('click', () => {
                    appState.playerClub = appState.clubs.find(c => c.name === club.name);
                    if (appState.playerClub) startGame();
                });
                clubList.appendChild(div);
            });
        }

        function startGame() {
            if (!appState.playerClub) return;
            selectScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            clubNameHeader.textContent = appState.playerClub.name + " (" + appState.playerClub.league + ")";
            updateHeader();
            switchTab('dashboard');
            appState.engine.saveGame();
        }

        function updateHeader() {
            const club = appState.playerClub;
            if (!club) return;
            const eng = appState.engine;
            seasonDisplay.textContent = `Saison ${eng.currentSeason}/${eng.currentSeason+1}`;
            matchdayDisplay.textContent = `Spieltag ${eng.currentMatchday}`;
            budgetDisplay.textContent = `€${club.transferBudget.toFixed(1)}M`;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.menu button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            Object.keys(tabContents).forEach(key => {
                tabContents[key].classList.toggle('hidden', key !== tabId);
            });
            appState.currentTab = tabId;
            switch (tabId) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'squad':
                    renderSquad();
                    break;
                case 'transfers':
                    renderTransfers();
                    break;
                case 'scouting':
                    renderScouting();
                    break;
                case 'coach':
                    renderCoach();
                    break;
                case 'board':
                    renderBoard();
                    break;
                case 'news':
                    renderNews();
                    break;
                case 'matchday':
                    renderMatchday();
                    break;
                case 'save':
                    renderSave();
                    break;
            }
        }

        // ---- DASHBOARD ----
        function renderDashboard() {
            const club = appState.playerClub;
            const eng = appState.engine;
            if (!club) return;

            const table = eng.getTable(club.league);
            const pos = table.findIndex(([name]) => name === club.name) + 1;
            const pts = table.find(([name]) => name === club.name)?.[1] || 0;
            const boardEval = eng.evaluateBoard(club);
            const crest = getCrest(club.name);
            const leagueTag = club.league === "2. Bundesliga" ? "tag-2" : "";
            const tasks = eng.getUrgentTasks(club);
            const recentMatches = eng.getRecentMatches(club);

            let html = `
                <div class="flex">
                    <div class="card" style="flex:1 1 100%;">
                        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                            <div class="crest ${leagueTag}">${crest}</div>
                            <div>
                                <h2 style="margin:0;">${club.name}</h2>
                                <span class="league-tag ${leagueTag}">${club.league}</span>
                                <span class="badge gold">Platz ${pos}</span>
                                <span class="badge blue">${pts} Pkt.</span>
                                <span class="badge dim">${club.seasonGoalsScored}:${club.seasonGoalsConceded}</span>
                            </div>
                        </div>
                        <p style="font-size:14px;color:var(--dim);margin-top:6px;">📖 ${club.philosophy || '—'}</p>
                    </div>
                </div>
                <div class="flex">
                    <div class="card"><h3>💰 Finanzen</h3>
                        <p>Transferbudget: <span class="highlight">${formatMoney(club.transferBudget)}</span></p>
                        <p>Rücklagen: ${formatMoney(club.financialReserves)}</p>
                        <p>Gehaltssumme: ${formatMoney(club.totalWages())}</p>
                        <p>Kaderwert: ${formatMoney(club.squadValue())}</p>
                    </div>
                    <div class="card"><h3>👥 Kader</h3>
                        <p>Spieler: ${club.players.length}</p>
                        <p>Ø Stärke: ${club.averageOverall()}</p>
                        <p>Trainer: ${club.coach ? club.coach.name : '❌ Keiner'}</p>
                        <p>Jugendakademie: Lv. ${club.youthAcademyLevel}</p>
                    </div>
                    <div class="card"><h3>📊 Zufriedenheit</h3>
                        <p>Vorstand: ${boardEval.satisfaction}% ${progressBar(boardEval.satisfaction)}</p>
                        <p>Fans: ${club.fanSatisfaction}% ${progressBar(club.fanSatisfaction,100,'green')}</p>
                        <p>Trainer: ${club.coach ? club.coach.satisfaction : 0}% ${progressBar(club.coach?.satisfaction||0,100,'blue')}</p>
                    </div>
                    <div class="card"><h3>🎯 Saisonziele</h3>
                        <p>Liga: Platz ${club.seasonGoals?.leaguePlace || '?'}</p>
                        <p>Pokal: ${club.seasonGoals?.cupRound || '?'}</p>
                        <p>Fortschritt: ${boardEval.score}%</p>
                    </div>
                </div>
            `;

            // Tasks
            html += `<div class="card wide"><h3>⚠ Offene Aufgaben</h3>`;
            tasks.forEach(t => {
                const cls = t.urgency === 'urgent' ? 'urgent' : t.urgency === 'warning' ? 'warning' : 'done';
                const actionBtn = t.action ? `<button class="tiny secondary" onclick="switchTab('${t.action}')">→</button>` :
                    '';
                html += `<div class="task-item ${cls}"><span>${t.text}</span> ${actionBtn}</div>`;
            });
            html += `</div>`;

            // Recent matches
            if (recentMatches.length > 0) {
                html += `<div class="card wide"><h3>📋 Letzte Spiele</h3><div class="flex" style="gap:8px;">`;
                recentMatches.slice(-5).forEach(r => {
                    const isHome = r.home === club.name;
                    const opponent = isHome ? r.away : r.home;
                    const goals = isHome ? r.homeGoals : r.awayGoals;
                    const oppGoals = isHome ? r.awayGoals : r.homeGoals;
                    const resultClass = goals > oppGoals ? 'win' : goals < oppGoals ? 'loss' : 'draw';
                    const icon = goals > oppGoals ? '✅' : goals < oppGoals ? '❌' : '➖';
                    html += `<div class="match-result ${resultClass}" style="flex:1 1 150px;min-width:120px;">
                        <strong>${icon} ${club.name}</strong> ${goals}:${oppGoals} ${opponent}
                        <span class="tiny-text text-dim">(${isHome ? 'H' : 'A'})</span>
                    </div>`;
                });
                html += `</div></div>`;
            }

            // Low morale
            const lowMorale = club.players.filter(p => p.morale < 35);
            if (lowMorale.length > 0) {
                html += `<div class="card wide" style="border-color:var(--red);">
                    <h3 style="color:var(--red);">⚠ Spieler mit niedriger Moral</h3>
                    ${lowMorale.slice(0,5).map(p => `
                        <div class="player-row">
                            <span>${p.name}</span>
                            <span>${moraleBar(p.morale)} ${p.morale}%</span>
                            <span class="tiny-text text-dim">${p.getMoraleReason()}</span>
                        </div>
                    `).join('')}
                    ${lowMorale.length > 5 ? `<span class="tiny-text text-dim">+${lowMorale.length-5} weitere</span>` : ''}
                </div>`;
            }

            // News teaser
            const recentNews = eng.news.slice(0, 3);
            if (recentNews.length) {
                html += `<div class="card wide"><h3>📰 Aktuelle News</h3>`;
                recentNews.forEach(n => {
                    const cls = n.type === 'urgent' ? 'urgent' : n.type === 'success' ? 'success' : '';
                    html += `<div class="news-item ${cls}">
                        <span class="news-date">[${n.date}]</span>
                        <span>${n.text}</span>
                    </div>`;
                });
                html += `</div>`;
            }

            tabContents.dashboard.innerHTML = html;
        }

        // ---- SQUAD ----
        function renderSquad() {
            const club = appState.playerClub;
            if (!club) return;
            let html = `
                <div class="flex" style="justify-content:space-between;align-items:center;">
                    <h3>🧑‍🤝‍🧑 Kader von ${club.name}</h3>
                    <div>
                        <button onclick="showSquadAnalysis()" class="secondary small">📊 Analyse</button>
                        <button onclick="showPlayerDetails()" class="secondary small">🔍 Spieler</button>
                        <button onclick="showContractNegotiations()" class="gold small">📝 Verträge</button>
                    </div>
                </div>
                <div id="squad-analysis-output" style="margin-bottom:12px;"></div>
                <div style="overflow-x:auto;">
                <table>
                    <tr><th>#</th><th>Name</th><th>Pos</th><th>Alter</th><th>Stärke</th><th>Pot.</th><th>Wert</th><th>Gehalt</th><th>Vertrag</th><th>Moral</th></tr>
            `;

                html += `<tr>
                    <td>${i+1}</td>
                    <td>${p.name} ${inj} ${wants} ${demand}</td>
                    <td>${p.position}</td>
                    <td>${p.age}</td>
                    <td>${p.overall}</td>
                    <td>${p.potential}</td>
                    <td>${formatMoney(p.marketValue)}</td>
                    <td>${formatMoney(p.salary)}</td>
                    <td>${p.contractYears}J</td>
                    <td>${moraleBar(p.morale)} ${p.morale}%</td>
                </tr>`;
            });
            html += `</table></div>
                <div class="btn-group">
                    <button onclick="sellPlayerUI()" class="danger">📤 Spieler verkaufen</button>
                    <button onclick="extendContractUI()" class="gold">📝 Vertrag verlängern</button>
                </div>
            `;
